<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çizgi Takibi - İlkokulOyun.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Fredoka', 'Arial', sans-serif;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 720px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 30px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .header p {
            color: #9E9E9E;
            font-size: 15px;
            font-weight: 500;
        }

        .story {
            background: linear-gradient(135deg, #fff1f1 0%, #ffe8f5 100%);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 14px;
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            border: 1px solid #ffd6e0;
        }

        .story strong {
            color: #f5576c;
        }

        /* SEVİYE İLERLEME NOKTALARI */
        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .dot {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #EEE;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: all 0.3s ease;
            color: #BBB;
            font-weight: 600;
        }

        .dot.done {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: white;
            transform: scale(0.9);
        }

        .dot.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transform: scale(1.15);
            box-shadow: 0 4px 14px rgba(102, 126, 234, 0.4);
        }

        /* GÖREV BAŞLIĞI */
        .task-title {
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            color: #444;
            margin-bottom: 14px;
            padding: 12px;
            background: linear-gradient(135deg, #fdfbfb 0%, #f7f3ff 100%);
            border-radius: 16px;
            border: 2px dashed #c3b8f0;
        }

        .game-area {
            position: relative;
            background: white;
            border-radius: 20px;
            width: 100%;
            height: 400px;
            margin-bottom: 16px;
            overflow: hidden;
            touch-action: none;
            box-shadow: inset 0 2px 12px rgba(0,0,0,0.06);
            border: 3px solid #EDE7F6;
        }

        #canvas {
            display: block;
            cursor: crosshair;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        .message {
            text-align: center;
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 14px;
            min-height: 28px;
            transition: all 0.3s ease;
        }

        .message.success {
            color: #2ecc71;
            animation: pop 0.4s ease;
        }

        .message.fail {
            color: #ff7043;
            animation: shake 0.4s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat {
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f2f8 100%);
            border-radius: 14px;
            padding: 10px 22px;
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: #999;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #667eea;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-reset {
            background: #F1F3F5;
            color: #555;
        }

        .btn-reset:hover {
            background: #E4E7EB;
        }

        .btn-next {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 14px rgba(102, 126, 234, 0.35);
        }

        .btn-next:hover {
            box-shadow: 0 6px 18px rgba(102, 126, 234, 0.5);
            transform: translateY(-2px);
        }

        .back-btn {
            width: 100%;
            padding: 13px;
            background: transparent;
            color: #999;
            border: 2px solid #E0E0E0;
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        /* KONFETİ */
        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            top: -20px;
            z-index: 999;
            animation: fall linear forwards;
            border-radius: 3px;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0.3;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 16px;
            }

            .game-area {
                height: 320px;
            }
            
            .header h1 {
                font-size: 24px;
            }

            .dot {
                width: 28px;
                height: 28px;
                font-size: 13px;
            }

            .task-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Çizgi Takibi</h1>
            <p>Çizgilerin üzerinden geçerek takip et</p>
        </div>

        <div class="story">
            📖 <strong>Hikaye:</strong> Cıvata Rob çeşitli yollardan geçmeli! Çizginin üzerinden okun yönünde geç. Ne kadar doğru geçersen, o kadar puan! 🚀
        </div>

        <div class="progress-dots" id="progressDots"></div>

        <div class="task-title" id="taskTitle">⬆️ Yukarı Doğru Çiz</div>

        <div class="message" id="message"></div>

        <div class="game-area" id="gameArea">
            <canvas id="canvas"></canvas>
        </div>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-label">PUAN</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">SEVİYE</div>
                <div class="stat-value" id="level">1/9</div>
            </div>
        </div>

        <div class="buttons">
            <button class="btn btn-reset" onclick="resetLevel()">🔄 Yeniden Çiz</button>
            <button class="btn btn-next" onclick="nextLevel()">Devam ➜</button>
        </div>

        <button class="back-btn" onclick="history.back()">← Geri Dön</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const gameArea = document.getElementById('gameArea');
        const messageEl = document.getElementById('message');

        let score = 0;
        let level = 0;
        let isDrawing = false;
        let coveredPixels = new Set();

        const LINE_COLOR = '#66BB6A';
        const LINE_WIDTH = 10;

        const linePatterns = [
            { name: '⬆️ Yukarı Doğru Çiz', draw: drawUpArrow },
            { name: '⬇️ Aşağı Doğru Çiz', draw: drawDownArrow },
            { name: '➡️ Sağa Doğru Çiz', draw: drawRightArrow },
            { name: '⬅️ Sola Doğru Çiz', draw: drawLeftArrow },
            { name: '↗️ Çapraz Yukarı Çiz', draw: drawDiagonalUpRight },
            { name: '↙️ Çapraz Aşağı Çiz', draw: drawDiagonalDownLeft },
            { name: '⚡ Zikzak Çiz', draw: drawZigzag },
            { name: '🔃 Saat Yönünde Daire Çiz', draw: drawCircleRight },
            { name: '🔄 Saat Tersine Daire Çiz', draw: drawCircleLeft }
        ];

        function resizeCanvas() {
            const rect = gameArea.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            drawCurrentPattern();
        }

        window.addEventListener('resize', resizeCanvas);

        // ========== OK BAŞI YARDIMCI FONKSİYON ==========
        // (tipX, tipY): okun ucu, angle: okun gösterdiği yön (radyan)
        function drawArrowHead(tipX, tipY, angle) {
            const size = 22;
            ctx.beginPath();
            ctx.moveTo(
                tipX - size * Math.cos(angle - Math.PI / 7),
                tipY - size * Math.sin(angle - Math.PI / 7)
            );
            ctx.lineTo(tipX, tipY);
            ctx.lineTo(
                tipX - size * Math.cos(angle + Math.PI / 7),
                tipY - size * Math.sin(angle + Math.PI / 7)
            );
            ctx.stroke();
        }

        function setLineStyle() {
            ctx.strokeStyle = LINE_COLOR;
            ctx.lineWidth = LINE_WIDTH;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        // Başlangıç noktası işareti (sarı yıldız daire)
        function drawStartPoint(x, y) {
            ctx.fillStyle = '#FFD54F';
            ctx.beginPath();
            ctx.arc(x, y, 16, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#F57F17';
            ctx.font = 'bold 16px Fredoka, Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('👆', x, y + 1);
        }

        // ========== ÇİZGİ DESENLERİ ==========
        function drawUpArrow() {
            setLineStyle();
            const x = canvas.width / 2;
            const startY = canvas.height - 70;
            const endY = 70;

            ctx.beginPath();
            ctx.moveTo(x, startY);
            ctx.lineTo(x, endY);
            ctx.stroke();

            drawArrowHead(x, endY, -Math.PI / 2); // Yukarı
            drawStartPoint(x, startY);
        }

        function drawDownArrow() {
            setLineStyle();
            const x = canvas.width / 2;
            const startY = 70;
            const endY = canvas.height - 70;

            ctx.beginPath();
            ctx.moveTo(x, startY);
            ctx.lineTo(x, endY);
            ctx.stroke();

            drawArrowHead(x, endY, Math.PI / 2); // Aşağı
            drawStartPoint(x, startY);
        }

        function drawRightArrow() {
            setLineStyle();
            const y = canvas.height / 2;
            const startX = 70;
            const endX = canvas.width - 70;

            ctx.beginPath();
            ctx.moveTo(startX, y);
            ctx.lineTo(endX, y);
            ctx.stroke();

            drawArrowHead(endX, y, 0); // Sağa
            drawStartPoint(startX, y);
        }

        function drawLeftArrow() {
            setLineStyle();
            const y = canvas.height / 2;
            const startX = canvas.width - 70;
            const endX = 70;

            ctx.beginPath();
            ctx.moveTo(startX, y);
            ctx.lineTo(endX, y);
            ctx.stroke();

            drawArrowHead(endX, y, Math.PI); // Sola
            drawStartPoint(startX, y);
        }

        function drawDiagonalUpRight() {
            setLineStyle();
            const startX = 80;
            const startY = canvas.height - 80;
            const endX = canvas.width - 80;
            const endY = 80;

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();

            const angle = Math.atan2(endY - startY, endX - startX);
            drawArrowHead(endX, endY, angle);
            drawStartPoint(startX, startY);
        }

        function drawDiagonalDownLeft() {
            setLineStyle();
            const startX = canvas.width - 80;
            const startY = 80;
            const endX = 80;
            const endY = canvas.height - 80;

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();

            const angle = Math.atan2(endY - startY, endX - startX);
            drawArrowHead(endX, endY, angle);
            drawStartPoint(startX, startY);
        }

        // ZİKZAK - Soldan sağa keskin köşeli çizgi
        function drawZigzag() {
            setLineStyle();
            const startX = 70;
            const endX = canvas.width - 70;
            const centerY = canvas.height / 2;
            const height = 70;
            const segments = 5;
            const segWidth = (endX - startX) / segments;

            ctx.beginPath();
            ctx.moveTo(startX, centerY + height / 2);
            
            let lastX = startX, lastY = centerY + height / 2;
            for (let i = 1; i <= segments; i++) {
                const x = startX + i * segWidth;
                const y = (i % 2 === 1) ? centerY - height / 2 : centerY + height / 2;
                ctx.lineTo(x, y);
                lastX = x;
                lastY = y;
            }
            ctx.stroke();

            // Son segmentin yönünde ok
            const prevY = ((segments - 1) % 2 === 1) ? centerY - height / 2 : centerY + height / 2;
            const angle = Math.atan2(lastY - prevY, segWidth);
            drawArrowHead(lastX, lastY, angle);

            drawStartPoint(startX, centerY + height / 2);
        }

        // SAĞ DAİRE (Saat yönü) - Başlangıç üstte, ok SAĞ tarafta aşağı bakar
        function drawCircleRight() {
            setLineStyle();
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) * 0.28;

            // Tam daire çiz
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.stroke();

            // Ok başı - SAĞ tarafta (3 o'clock), saat yönünde AŞAĞI bakar
            const tipX = centerX + radius;
            const tipY = centerY + 12;
            drawArrowHead(tipX, tipY, Math.PI / 2); // Aşağı yön (saat yönü hareketi)

            // Başlangıç noktası - üstte (12 o'clock)
            drawStartPoint(centerX, centerY - radius);
        }

        // SOL DAİRE (Saat tersi) - Başlangıç üstte, ok SOL tarafta aşağı bakar
        function drawCircleLeft() {
            setLineStyle();
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) * 0.28;

            // Tam daire çiz
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.stroke();

            // Ok başı - SOL tarafta (9 o'clock), saat tersine AŞAĞI bakar
            const tipX = centerX - radius;
            const tipY = centerY + 12;
            drawArrowHead(tipX, tipY, Math.PI / 2); // Aşağı yön (saat tersi hareketi)

            // Başlangıç noktası - üstte (12 o'clock)
            drawStartPoint(centerX, centerY - radius);
        }

        // ========== SEVİYE YÖNETİMİ ==========
        function buildProgressDots() {
            const container = document.getElementById('progressDots');
            container.innerHTML = '';
            for (let i = 0; i < linePatterns.length; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                if (i < level) dot.className += ' done';
                if (i === level) dot.className += ' active';
                dot.textContent = i < level ? '✓' : (i + 1);
                container.appendChild(dot);
            }
        }

        function drawCurrentPattern() {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            linePatterns[level].draw();
            document.getElementById('taskTitle').textContent = linePatterns[level].name;
            buildProgressDots();
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches) {
                return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                };
            }
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('mouseup', finishDrawing);
        canvas.addEventListener('touchend', finishDrawing);

        function startDrawing(e) {
            e.preventDefault();
            isDrawing = true;
            coveredPixels.clear();
            messageEl.textContent = '';
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const pos = getPos(e);

            // Yeşil çizgi üzerinde miyiz kontrol et
            const imageData = ctx.getImageData(
                Math.max(0, pos.x - 10), Math.max(0, pos.y - 10), 20, 20
            );
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                // Yeşil renk tespiti (#66BB6A)
                if (data[i] < 150 && data[i + 1] > 140 && data[i + 2] < 150) {
                    coveredPixels.add(`${Math.round(pos.x/6)},${Math.round(pos.y/6)}`);
                    break;
                }
            }

            // Takip izini çiz (mor)
            ctx.fillStyle = 'rgba(118, 75, 162, 0.35)';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 11, 0, Math.PI * 2);
            ctx.fill();
        }

        function finishDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            checkSuccess();
        }

        function checkSuccess() {
            // Desene göre gereken minimum takip noktası
            const isCircle = level >= 7;
            const required = isCircle ? 45 : 30;
            const covered = coveredPixels.size;

            if (covered >= required) {
                showMessage('🌟 SÜPER! Harika takip ettin!', 'success');
                score += 100;
                document.getElementById('score').textContent = score;
                launchConfetti(15);
                setTimeout(nextLevel, 1200);
            } else if (covered >= required * 0.5) {
                showMessage('👍 Az kaldı! Bir daha dene!', 'fail');
            } else {
                showMessage('💪 Çizginin üzerinden geçmeyi dene!', 'fail');
            }
        }

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
        }

        function launchConfetti(count) {
            const colors = ['#667eea', '#f5576c', '#43e97b', '#FFD54F', '#4FC3F7'];
            for (let i = 0; i < count; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.animationDuration = (1.2 + Math.random() * 1.3) + 's';
                c.style.animationDelay = Math.random() * 0.3 + 's';
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 3000);
            }
        }

        function resetLevel() {
            coveredPixels.clear();
            messageEl.textContent = '';
            drawCurrentPattern();
        }

        function nextLevel() {
            if (level < linePatterns.length - 1) {
                level++;
                document.getElementById('level').textContent = (level + 1) + '/' + linePatterns.length;
                resetLevel();
            } else {
                launchConfetti(40);
                setTimeout(() => {
                    alert('🎉 OYUNU BİTİRDİN!\n\nToplam Puan: ' + score + ' 🏆\n\nTüm çizgi tiplerini başarıyla takip ettin!');
                    location.reload();
                }, 500);
            }
        }

        // Başlat
        resizeCanvas();
        document.getElementById('level').textContent = '1/' + linePatterns.length;
    </script>
</body>
</html>
