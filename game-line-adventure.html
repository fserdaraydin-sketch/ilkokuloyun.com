<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çizgi Çizme - İlkokulOyun.com</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 700px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #FF6B6B;
            font-size: 32px;
            margin-bottom: 5px;
        }

        .header p {
            color: #999;
            font-size: 16px;
        }

        .story {
            background: #FFE5E5;
            border-left: 5px solid #FF6B6B;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
            color: #555;
            line-height: 1.6;
        }

        .instruction {
            background: #FFF3E0;
            border: 2px solid #FF9800;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            color: #E65100;
            font-size: 18px;
        }

        .game-area {
            position: relative;
            background: white;
            border: 3px solid #FF6B6B;
            border-radius: 15px;
            width: 100%;
            height: 350px;
            margin-bottom: 20px;
            overflow: hidden;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas {
            display: block;
            cursor: crosshair;
            touch-action: none;
            background: white;
        }

        .score {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #FF6B6B;
            margin-bottom: 20px;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .btn-reset {
            background: #EFEFEF;
            color: #333;
        }

        .btn-reset:hover {
            background: #DDD;
        }

        .btn-next {
            background: #FF6B6B;
            color: white;
        }

        .btn-next:hover {
            background: #FF5252;
        }

        .back-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .back-btn:hover {
            background: #5568d3;
        }

        .message {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 25px;
        }

        .message.success {
            color: #2E7D32;
        }

        .message.fail {
            color: #E65100;
        }

        @media (max-width: 600px) {
            .game-area {
                height: 280px;
            }
            
            .header h1 {
                font-size: 28px;
            }
        }
    </style>
  <script defer src="analytics.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✏️ Çizgi Çiz</h1>
            <p>Sağlam ve düz çizgi çizmeyi öğren</p>
        </div>

        <div class="story">
            📖 <strong>Hikaye:</strong> Cıvata Rob hazinesini almak istediğinde engeller var. Her engeli çizgi çizerek aşmalısın. Düz ve güçlü çizgiler çiz! 🚀
        </div>

        <div class="instruction">
            👇 YUKARI DOĞRU DÜZEN ÇİZGİ ÇİZ 👆
        </div>

        <div class="message" id="message"></div>

        <div class="game-area" id="gameArea">
            <canvas id="canvas"></canvas>
        </div>

        <div class="score">
            Puan: <span id="score">0</span> | Seviye: <span id="level">1/3</span>
        </div>

        <div class="buttons">
            <button class="btn btn-reset" onclick="resetLevel()">🔄 Yeniden Çiz</button>
            <button class="btn btn-next" onclick="nextLevel()">✓ Devam</button>
        </div>

        <button class="back-btn" onclick="history.back()">← Geri Dön</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const gameArea = document.getElementById('gameArea');
        const messageEl = document.getElementById('message');

        let score = 0;
        let level = 1;
        let maxLevels = 3;
        let isDrawing = false;
        let points = [];
        let minY = Infinity;
        let maxY = -Infinity;

        // Canvas boyutunu ayarla
        function resizeCanvas() {
            const rect = gameArea.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            drawGuides();
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Rehber çizgileri çiz
        function drawGuides() {
            ctx.fillStyle = '#F5F5F5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // BAŞLA noktası (sol altta yeşil)
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.arc(50, canvas.height - 50, 15, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('BAŞLA', 50, canvas.height - 50);

            // BİTİR noktası (sağ üstte kırmızı)
            ctx.fillStyle = '#FF6B6B';
            ctx.beginPath();
            ctx.arc(canvas.width - 50, 50, 15, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.fillText('BİTİR', canvas.width - 50, 50);

            // Talimat yazısı
            ctx.fillStyle = '#CCC';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('↑', canvas.width / 2, canvas.height / 2);
        }

        // Mouse/Touch olayları
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches) {
                return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                };
            }
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('mouseup', finishDrawing);
        canvas.addEventListener('touchend', finishDrawing);

        function startDrawing(e) {
            e.preventDefault();
            isDrawing = true;
            points = [];
            minY = Infinity;
            maxY = -Infinity;
            messageEl.textContent = '';
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const pos = getPos(e);
            points.push(pos);
            minY = Math.min(minY, pos.y);
            maxY = Math.max(maxY, pos.y);

            // Çizgiyi canlı çiz
            redraw();
        }

        function redraw() {
            drawGuides();

            if (points.length > 1) {
                ctx.strokeStyle = '#FF6B6B';
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.stroke();
            }
        }

        function finishDrawing() {
            isDrawing = false;
            checkSuccess();
        }

        function checkSuccess() {
            if (points.length < 20) {
                showMessage('❌ Çok kısa çizdi!', 'fail');
                return;
            }

            // Düzlüğü kontrol et (X ekseninde sapmaya bak)
            let xVariance = 0;
            for (let i = 0; i < points.length; i++) {
                xVariance += Math.abs(points[i].x - (canvas.width / 2));
            }
            xVariance = xVariance / points.length;

            // Dikey mi kontrolü
            const height = maxY - minY;
            const width = Math.max(...points.map(p => p.x)) - Math.min(...points.map(p => p.x));

            if (xVariance > 80) {
                showMessage('❌ Daha düz çiz!', 'fail');
                return;
            }

            if (height < 100) {
                showMessage('❌ Daha uzun çiz!', 'fail');
                return;
            }

            if (width > 150) {
                showMessage('❌ Sağa sola kaymış! Düz çiz!', 'fail');
                return;
            }

            // BAŞARILI!
            showMessage('✅ BRİLYAN ÇIZDI! +' + (100 + Math.floor(100 - xVariance)), 'success');
            score += 100 + Math.floor(100 - xVariance);
            updateScore();
        }

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level + '/' + maxLevels;
        }

        function resetLevel() {
            points = [];
            messageEl.textContent = '';
            drawGuides();
        }

        function nextLevel() {
            if (level < maxLevels) {
                level++;
                updateScore();
                resetLevel();
            } else {
                alert('🎉 OYUNU BİTİRDİN!\n\nToplam Puan: ' + score + ' 🏆\n\nEvet! Çizgi çizmeyi öğrendin!');
                location.reload();
            }
        }

        updateScore();
    </script>
</body>
</html>
