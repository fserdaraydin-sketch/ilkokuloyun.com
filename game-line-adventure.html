<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çizgi Macerası - İlkokulOyun.com</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 700px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #FF6B6B;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .game-info {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            background: #F5F5F5;
            padding: 15px;
            border-radius: 10px;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 12px;
            color: #999;
            font-weight: bold;
        }

        .info-value {
            font-size: 24px;
            font-weight: bold;
            color: #FF6B6B;
            margin-top: 5px;
        }

        .story-box {
            background: linear-gradient(135deg, #FFE5E5 0%, #FFF0F0 100%);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #FF6B6B;
        }

        .story-title {
            font-weight: bold;
            color: #FF6B6B;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .story-text {
            color: #555;
            font-size: 13px;
            line-height: 1.5;
        }

        .game-area {
            position: relative;
            background: linear-gradient(to right, #FFF9E6 0%, #FFF3E0 100%);
            border: 3px solid #FF6B6B;
            border-radius: 10px;
            height: 400px;
            margin-bottom: 15px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            background: transparent;
            cursor: crosshair;
            touch-action: none;
        }

        .robot {
            position: absolute;
            font-size: 40px;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            transition: bottom 0.3s ease, left 0.2s ease;
            z-index: 10;
        }

        .treasure {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            z-index: 15;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #DDD;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF6B6B 0%, #FF8E72 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .combo-indicator {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #4ECDC4;
            margin-bottom: 10px;
            min-height: 40px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn-primary {
            background: #FF6B6B;
            color: white;
        }

        .btn-primary:hover {
            background: #FF5252;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #DDD;
            color: #333;
        }

        .btn-secondary:hover {
            background: #CCC;
        }

        .back-button {
            display: block;
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #5568d3;
        }

        .feedback {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: bold;
            min-height: 20px;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .feedback.success {
            background: #C8E6C9;
            color: #2E7D32;
        }

        .feedback.warning {
            background: #FFE0B2;
            color: #E65100;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .game-area {
                height: 300px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🤖 Merdiven Çıkma - Cıvata Rob</h1>
            <p>Robotu yukarı çıkarmaya yardım et!</p>
        </div>

        <div class="game-info">
            <div class="info-item">
                <div class="info-label">PUAN</div>
                <div class="info-value" id="score">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">COMBO</div>
                <div class="info-value" id="combo">0x</div>
            </div>
            <div class="info-item">
                <div class="info-label">BAŞARI</div>
                <div class="info-value" id="accuracy">0%</div>
            </div>
        </div>

        <div class="story-box">
            <div class="story-title">📖 Hikaye</div>
            <div class="story-text">
                Cıvata Rob'un tepedeki hazine kutusuna ulaşması lazım! Yukarı doğru düz çizgiler çizerek basamakları oluştur. 
                Ne kadar doğru çizersen, Rob o kadar hızlı çıkıyor! 🎯
            </div>
        </div>

        <div class="combo-indicator" id="comboDisplay"></div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="game-area" id="gameArea">
            <canvas id="canvas"></canvas>
            <div class="treasure">💎</div>
            <div class="robot" id="robot">🤖</div>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" onclick="resetGame()">🔄 Baştan Başla</button>
            <button class="btn btn-primary" onclick="nextLevel()">⏭️ Atla</button>
        </div>

        <button class="back-button" onclick="history.back()">← Geri Dön</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const gameArea = document.getElementById('gameArea');
        const robot = document.getElementById('robot');
        const feedback = document.getElementById('feedback');

        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let currentLevel = 0;
        let robotHeight = 0;
        let touchAccuracy = 0;
        let isDrawing = false;
        let coveredPixels = new Set();
        let levelTarget = 80; // 80% başarı = level tamamlanır

        const levels = [
            { height: 100, difficulty: 'Kolay', target: 3, description: '3 basamak çık' },
            { height: 150, difficulty: 'Normal', target: 5, description: '5 basamak çık' },
            { height: 200, difficulty: 'Zor', target: 7, description: '7 basamak çık' }
        ];

        function resizeCanvas() {
            const rect = gameArea.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            drawLevel();
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function drawLevel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            coveredPixels.clear();

            const level = levels[currentLevel];
            const stepHeight = canvas.height / level.target;
            
            // Basamakları çiz (gri çevrim)
            ctx.strokeStyle = '#E0E0E0';
            ctx.lineWidth = 8;
            ctx.setLineDash([5, 5]);

            for (let i = 0; i < level.target; i++) {
                const y = canvas.height - (i + 1) * stepHeight;
                ctx.beginPath();
                ctx.moveTo(canvas.width * 0.3, y);
                ctx.lineTo(canvas.width * 0.7, y);
                ctx.stroke();
            }

            ctx.setLineDash([]);

            // Talimat
            ctx.fillStyle = '#FF6B6B';
            ctx.font = 'bold 18px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('👇 DİKEY ÇİZGİLER ÇİZ', canvas.width / 2, 30);

            updateDisplay();
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            let x, y;
            if (e.touches) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            } else {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }
            return { x, y };
        }

        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
            checkLineQuality();
        });
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseout', () => isDrawing = false);

        canvas.addEventListener('touchstart', () => isDrawing = true);
        canvas.addEventListener('touchend', () => {
            isDrawing = false;
            checkLineQuality();
        });
        canvas.addEventListener('touchmove', draw);

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const pos = getMousePos(e);
            
            // Pikselleri kontrol et
            const imageData = ctx.getImageData(pos.x - 5, pos.y - 5, 10, 10);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] > 180) {
                    coveredPixels.add(`${pos.x},${pos.y}`);
                }
            }

            // Çizimi göster (kırmızı)
            ctx.fillStyle = 'rgba(255, 107, 107, 0.4)';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 6, 0, Math.PI * 2);
            ctx.fill();

            updateAccuracy();
        }

        function updateAccuracy() {
            const estimatedPixels = 3000;
            touchAccuracy = Math.min(100, Math.round((coveredPixels.size / estimatedPixels) * 100));
        }

        function checkLineQuality() {
            if (touchAccuracy > 70) {
                // Başarılı!
                combo++;
                maxCombo = Math.max(maxCombo, combo);
                score += 100 + (touchAccuracy * combo);
                
                // Rob yukarı çık
                const level = levels[currentLevel];
                const newHeight = robotHeight + 1;
                if (newHeight < level.target) {
                    robotHeight = newHeight;
                    animateRobotClimb();
                    showFeedback('✅ Mükemmel!', 'success');
                } else {
                    completeLevel();
                }
            } else if (touchAccuracy > 40) {
                showFeedback('⚠️ Daha doğru çiz', 'warning');
                combo = 0;
            } else {
                showFeedback('❌ Başarısız - Yeniden dene', 'warning');
                combo = 0;
            }

            updateDisplay();
            resetLevel();
        }

        function animateRobotClimb() {
            const level = levels[currentLevel];
            const stepHeight = canvas.height / level.target;
            const newBottom = robotHeight * stepHeight + 10;
            
            robot.style.bottom = newBottom + 'px';
            robot.textContent = '😊'; // Mutlu emoji
            
            setTimeout(() => {
                robot.textContent = '🤖'; // Geri normal
            }, 300);
        }

        function completeLevel() {
            showFeedback('🎉 LEVEL TESLİM! Hazinesine ulaştı!', 'success');
            setTimeout(() => {
                nextLevel();
            }, 1500);
        }

        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('combo').textContent = combo + 'x';
            document.getElementById('accuracy').textContent = touchAccuracy + '%';

            const level = levels[currentLevel];
            const progress = (robotHeight / level.target) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            // Combo göstergesi
            const comboDisplay = document.getElementById('comboDisplay');
            if (combo > 2) {
                comboDisplay.textContent = '🔥 ' + combo + ' COMBO!';
                comboDisplay.style.color = '#FF6B6B';
            } else {
                comboDisplay.textContent = '';
            }
        }

        function showFeedback(text, type) {
            feedback.textContent = text;
            feedback.className = 'feedback show ' + type;
            setTimeout(() => {
                feedback.classList.remove('show');
            }, 1500);
        }

        function resetLevel() {
            coveredPixels.clear();
            touchAccuracy = 0;
            drawLevel();
        }

        function resetGame() {
            score = 0;
            combo = 0;
            currentLevel = 0;
            robotHeight = 0;
            robot.style.bottom = '10px';
            robot.textContent = '🤖';
            updateDisplay();
            resetLevel();
        }

        function nextLevel() {
            if (currentLevel < levels.length - 1) {
                currentLevel++;
                robotHeight = 0;
                robot.style.bottom = '10px';
                robot.textContent = '🤖';
                updateDisplay();
                resetLevel();
            } else {
                alert('🎉 Tebrikler! Tüm seviyeleri tamamladın!\n\nToplam Puan: ' + score);
                resetGame();
            }
        }

        // Başlat
        drawLevel();
    </script>
</body>
</html>
