<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eşini Bul - 1. Sınıf Matematik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="grade1-style.css">
<script defer src="analytics.js"></script>
</head>
<body>
<div class="kutu">
  <div class="baslik"><h1>🧩 Eşini Bul</h1><p>1. Tema · Eş Nesneler</p></div>
  <div class="ilerleme"><div class="ilerleme-dolu" id="ilerlemeDolu"></div></div>
  <div class="yildizlar" id="yildizlar"></div>
  <div class="yonerge">
    <span class="yonerge-metin" id="yonergeMetin">Hazırlanıyor...</span>
    <button class="btn-ses" id="sesBtn" onclick="sesDegistir()" aria-label="Sesi aç kapat">🔊</button>
  </div>
  <div class="soru-gorsel" id="soruGorsel"></div>
  <div class="secenekler" id="secenekler"></div>
  <div class="geri" id="geri"></div>
  <button class="btn-devam" id="devamBtn" onclick="tekrarDinle()">🔊 Tekrar Dinle</button>
  <button class="btn-geri" onclick="history.back()">← Geri Dön</button>
</div>
<script src="grade1-engine.js"></script>
<script>
// ===== ŞEKİL ÇİZİCİ =====
const RENKLER=[
 {ad:'kırmızı',h:'#E53935'},{ad:'mavi',h:'#1E88E5'},{ad:'yeşil',h:'#43A047'},
 {ad:'sarı',h:'#FDD835'},{ad:'mor',h:'#8E24AA'},{ad:'turuncu',h:'#FB8C00'}
];
const SEKILLER=['kare','daire','ucgen','yildiz','kalp','baklava'];

function cizSekil(ctx,tip,cx,cy,r,renk){
  ctx.save();
  ctx.fillStyle=renk; ctx.strokeStyle='rgba(0,0,0,.22)'; ctx.lineWidth=2.5;
  ctx.beginPath();
  if(tip==='daire') ctx.arc(cx,cy,r,0,Math.PI*2);
  else if(tip==='kare'){ const s=r*1.72; ctx.rect(cx-s/2,cy-s/2,s,s); }
  else if(tip==='ucgen'){
    ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r*0.92,cy+r*0.72); ctx.lineTo(cx-r*0.92,cy+r*0.72); ctx.closePath();
  }else if(tip==='yildiz'){
    for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*0.46:r;
      const x=cx+rr*Math.cos(a), y=cy+rr*Math.sin(a); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.closePath();
  }else if(tip==='kalp'){
    const s=r*1.06;
    ctx.moveTo(cx,cy+s*0.72);
    ctx.bezierCurveTo(cx-s*1.5,cy-s*0.28,cx-s*0.55,cy-s*1.15,cx,cy-s*0.40);
    ctx.bezierCurveTo(cx+s*0.55,cy-s*1.15,cx+s*1.5,cy-s*0.28,cx,cy+s*0.72);
    ctx.closePath();
  }else{ // baklava
    ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r*0.78,cy); ctx.lineTo(cx,cy+r); ctx.lineTo(cx-r*0.78,cy); ctx.closePath();
  }
  ctx.fill(); ctx.stroke(); ctx.restore();
}
function sekilKarti(o,boyut){
  const{c,ctx,W,H}=sahne(148,110);
  cizSekil(ctx,o.s,W/2,H/2,(boyut||o.r||30),o.renk);
  return c;
}

// ETKİNLİK 1: Aynı şekil + aynı renk = EŞ
function etkEs(){
  const hedef={s:pick(SEKILLER),renk:pick(RENKLER).h,r:30};
  const yanlislar=[];
  // Farklı renk, aynı şekil
  yanlislar.push({s:hedef.s,renk:pick(RENKLER.filter(x=>x.h!==hedef.renk)).h,r:30});
  // Aynı renk, farklı şekil
  yanlislar.push({s:pick(SEKILLER.filter(x=>x!==hedef.s)),renk:hedef.renk,r:30});
  const secenek=[{...hedef,id:'dogru'},
                 {...yanlislar[0],id:'a'},{...yanlislar[1],id:'b'}];
  const ustG=sekilKarti(hedef,34); ustG.style.width='128px'; ustG.style.height='95px';
  return{
    yonerge:'Yukarıdaki şeklin EŞİNİ bul. Eş olan hem aynı şekilde hem aynı renkte olmalı.',
    secenek:secenek.map(o=>o.id), dogru:'dogru',
    ustGorsel:ustG,
    ciz:id=>sekilKarti(secenek.find(o=>o.id===id)),
    ipucu:'Eş nesneler birbirinin tıpatıp aynısıdır: aynı şekil, aynı renk, aynı büyüklük.'
  };
}

// ETKİNLİK 2: Eş olmayanı bul
function etkEsOlmayan(){
  const ortak={s:pick(SEKILLER),renk:pick(RENKLER).h};
  const farkli=rnd(0,1)===0
    ? {s:ortak.s,renk:pick(RENKLER.filter(x=>x.h!==ortak.renk)).h}
    : {s:pick(SEKILLER.filter(x=>x!==ortak.s)),renk:ortak.renk};
  const liste=[{...ortak,id:'a'},{...ortak,id:'b'},{...farkli,id:'fark'}];
  return{
    yonerge:'Aşağıdakilerden hangisi diğerlerinin EŞİ DEĞİL?',
    secenek:shuffle(liste.map(o=>o.id)), dogru:'fark',
    ciz:id=>sekilKarti(liste.find(o=>o.id===id)),
    ipucu:'İki tanesi tıpatıp aynı. Farklı olanı bul.'
  };
}

// ETKİNLİK 3: Boyut farkı — eş nesneler AYNI BÜYÜKLÜKTE olur
function etkBoyut(){
  const sekil=pick(SEKILLER), renk=pick(RENKLER).h;
  const r=30;
  const liste=[{s:sekil,renk,r,id:'dogru'},
               {s:sekil,renk,r:r*0.62,id:'kucuk'},
               {s:sekil,renk,r:r*1.34,id:'buyuk'}];
  const ustG=sekilKarti({s:sekil,renk,r},30); ustG.style.width='128px'; ustG.style.height='95px';
  return{
    yonerge:'Yukarıdaki şeklin EŞİNİ bul. Eş olan aynı büyüklükte olmalı.',
    secenek:shuffle(liste.map(o=>o.id)), dogru:'dogru',
    ustGorsel:ustG,
    ciz:id=>{const o=liste.find(x=>x.id===id); return sekilKarti(o,o.r);},
    ipucu:'Biri daha küçük, biri daha büyük. Tam aynı büyüklükte olanı seç.'
  };
}

// ETKİNLİK 4: Kaç tane eş var?
function etkKacEs(){
  const hedef={s:pick(SEKILLER),renk:pick(RENKLER).h};
  const adet=rnd(2,4);
  const liste=[];
  for(let i=0;i<adet;i++) liste.push({...hedef});
  while(liste.length<6){
    liste.push(rnd(0,1)===0
      ? {s:hedef.s,renk:pick(RENKLER.filter(x=>x.h!==hedef.renk)).h}
      : {s:pick(SEKILLER.filter(x=>x!==hedef.s)),renk:hedef.renk});
  }
  shuffle(liste);
  const{c,ctx,W,H}=sahne(268,104);
  liste.forEach((o,i)=>cizSekil(ctx,o.s,26+i*(216/5),H/2,22,o.renk));
  c.style.width='252px'; c.style.height='98px';
  const kucuk=sahne(98,74); cizSekil(kucuk.ctx,hedef.s,49,37,24,hedef.renk);

  const w=distractors(String(adet),()=>String(rnd(1,6)));
  return{
    yonerge:'Yukarıdaki şekilden kaç tane var? Doğru sayıyı seç.',
    secenek:shuffle([String(adet),...w.slice(0,2)]), dogru:String(adet),
    ustGorsel:(()=>{ const d=document.createElement('div');
      d.style.cssText='display:flex;flex-direction:column;align-items:center;gap:8px';
      const k=kucuk.c; k.style.cssText='border:3px solid #4DB6AC;border-radius:14px;width:92px;height:70px';
      d.appendChild(k); d.appendChild(c); return d; })(),
    ciz:t=>{ const{c:k,ctx,W,H}=sahne(148,92);
      ctx.save(); ctx.fillStyle='#37474F'; ctx.font='700 40px Fredoka,Arial';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t,W/2,H/2); ctx.restore(); return k; },
    ipucu:'Parmağınla tek tek say. Sadece tıpatıp aynı olanları say.'
  };
}

initEtkinlik([etkEs,etkEsOlmayan,etkBoyut,etkKacEs],
  {ad:'Eş Nesneler',c1:'#fbc2eb',c2:'#a6c1ee',koyu:'#6A1B9A',orta:'#AB47BC',acik:'#F3E5F5'});
</script>
</body>
</html>
