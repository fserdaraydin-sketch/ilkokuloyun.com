<script>
/* ---------- ÇİZİM YARDIMCILARI ---------- */
function yeniCanvas(g,h){
  const c=document.createElement('canvas');
  const dpr=Math.min(devicePixelRatio||1,2);
  c.width=g*dpr; c.height=h*dpr;
  c.style.width=g+'px'; c.style.height=h+'px';
  const x=c.getContext('2d'); x.scale(dpr,dpr);
  x.fillStyle='#FFFDF8'; x.fillRect(0,0,g,h);
  return {c,ctx:x,W:g,H:h};
}
function yaz(ctx,t,x,y,b,renk,hiza){
  ctx.save(); ctx.fillStyle=renk||'#37474F';
  ctx.font=(b||12)+'px Fredoka,Arial'; ctx.textAlign=hiza||'center';
  ctx.textBaseline='middle'; ctx.fillText(t,x,y); ctx.restore();
}
function kalinYaz(ctx,t,x,y,b,renk,hiza){
  ctx.save(); ctx.fillStyle=renk||'#37474F';
  ctx.font='700 '+(b||12)+'px Fredoka,Arial'; ctx.textAlign=hiza||'center';
  ctx.textBaseline='middle'; ctx.fillText(t,x,y); ctx.restore();
}

/* ---------- 1) DÖNME VE DOLANMA ---------- */
function cizDonmeDolanma(){
  const{c,ctx,W,H}=yeniCanvas(340,220);
  ctx.fillStyle='#0D1B3E'; ctx.fillRect(0,0,W,H);
  // Yıldızlar
  ctx.fillStyle='rgba(255,255,255,.6)';
  for(let i=0;i<40;i++){ ctx.beginPath();
    ctx.arc(Math.random()*W,Math.random()*H,Math.random()*1.3,0,7); ctx.fill(); }
  // Güneş
  const gx=W*0.22, gy=H*0.5;
  const gr=ctx.createRadialGradient(gx,gy,4,gx,gy,30);
  gr.addColorStop(0,'#FFF59D'); gr.addColorStop(1,'#F9A825');
  ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(gx,gy,26,0,7); ctx.fill();
  kalinYaz(ctx,'GÜNEŞ',gx,gy+40,12,'#FFD54F');
  // Yörünge
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.8; ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.ellipse(gx,gy,W*0.52,H*0.36,0,0,7); ctx.stroke(); ctx.setLineDash([]);
  // Dünya
  const dx=gx+W*0.52, dy=gy;
  ctx.fillStyle='#1E88E5'; ctx.beginPath(); ctx.arc(dx,dy,22,0,7); ctx.fill();
  ctx.fillStyle='#43A047';
  ctx.beginPath(); ctx.ellipse(dx-6,dy-6,9,6,0.4,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(dx+7,dy+6,7,5,-0.3,0,7); ctx.fill();
  // Eksen
  ctx.strokeStyle='#EF5350'; ctx.lineWidth=2; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(dx,dy-32); ctx.lineTo(dx,dy+32); ctx.stroke(); ctx.setLineDash([]);
  kalinYaz(ctx,'DÜNYA',dx,dy+46,12,'#90CAF9');
  // Dönme oku (kendi ekseni)
  ctx.strokeStyle='#FFD54F'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(dx,dy,30,-0.6,1.4); ctx.stroke();
  ctx.fillStyle='#FFD54F';
  ctx.beginPath(); ctx.moveTo(dx+5,dy+30); ctx.lineTo(dx+12,dy+26); ctx.lineTo(dx+11,dy+34); ctx.fill();
  yaz(ctx,'dönme · 24 saat',dx,dy-46,11.5,'#FFD54F');
  // Dolanma oku
  ctx.strokeStyle='#81C784'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(gx,gy,W*0.52*0.62,-1.5,-0.55); ctx.stroke();
  yaz(ctx,'dolanma · 365 gün 6 saat',W*0.52,H*0.12,11.5,'#A5D6A7');
  return c;
}

/* ---------- 2) GECE - GÜNDÜZ ---------- */
function cizGeceGunduz(){
  const{c,ctx,W,H}=yeniCanvas(330,190);
  ctx.fillStyle='#0D1B3E'; ctx.fillRect(0,0,W,H);
  const gx=44, gy=H/2;
  const gr=ctx.createRadialGradient(gx,gy,3,gx,gy,26);
  gr.addColorStop(0,'#FFF59D'); gr.addColorStop(1,'#F9A825');
  ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(gx,gy,22,0,7); ctx.fill();
  kalinYaz(ctx,'Güneş',gx,gy+36,11.5,'#FFD54F');
  // Işınlar
  ctx.strokeStyle='rgba(255,213,79,.55)'; ctx.lineWidth=2;
  for(let i=-2;i<=2;i++){ ctx.beginPath();
    ctx.moveTo(gx+26,gy+i*15); ctx.lineTo(W*0.56,gy+i*15); ctx.stroke(); }
  // Dünya
  const dx=W*0.70, dy=gy, r=50;
  ctx.fillStyle='#1565C0'; ctx.beginPath(); ctx.arc(dx,dy,r,0,7); ctx.fill();
  // Aydınlık yarı (Güneş'e bakan sol taraf)
  ctx.save(); ctx.beginPath(); ctx.arc(dx,dy,r,Math.PI/2,Math.PI*1.5); ctx.clip();
  ctx.fillStyle='#64B5F6'; ctx.beginPath(); ctx.arc(dx,dy,r,0,7); ctx.fill();
  ctx.restore();
  // Terminatör
  ctx.strokeStyle='#FFD54F'; ctx.lineWidth=2.5; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(dx,dy-r); ctx.lineTo(dx,dy+r); ctx.stroke(); ctx.setLineDash([]);
  kalinYaz(ctx,'GÜNDÜZ',dx-24,dy,12,'#0D47A1');
  kalinYaz(ctx,'GECE',dx+24,dy,12,'#E3F2FD');
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(dx,dy,r,0,7); ctx.stroke();
  return c;
}

/* ---------- 3) GÖLGE BOYU ---------- */
function cizGolge(){
  const{c,ctx,W,H}=yeniCanvas(340,190);
  ctx.fillStyle='#E3F2FD'; ctx.fillRect(0,0,W,H*0.70);
  ctx.fillStyle='#8D6E63'; ctx.fillRect(0,H*0.70,W,H*0.30);
  const durumlar=[
    {ad:'SABAH',gx:0.14,gy:0.22,golge:46,yon:1},
    {ad:'ÖĞLE', gx:0.50,gy:0.10,golge:14,yon:1},
    {ad:'AKŞAM',gx:0.86,gy:0.22,golge:46,yon:-1}
  ];
  durumlar.forEach((d,i)=>{
    const bx=W*(0.18+i*0.32), by=H*0.70;
    // Güneş
    ctx.fillStyle='#FDD835';
    ctx.beginPath(); ctx.arc(W*d.gx,H*d.gy,13,0,7); ctx.fill();
    // Ağaç / direk
    ctx.fillStyle='#5D4037'; ctx.fillRect(bx-3,by-42,6,42);
    ctx.fillStyle='#2E7D32';
    ctx.beginPath(); ctx.arc(bx,by-48,13,0,7); ctx.fill();
    // Gölge
    ctx.fillStyle='rgba(60,40,25,.45)';
    ctx.beginPath();
    ctx.ellipse(bx+d.yon*d.golge/2,by+4,d.golge/2,6,0,0,7); ctx.fill();
    kalinYaz(ctx,d.ad,bx,H*0.86,12.5,'#FFF');
    yaz(ctx,d.golge>30?'uzun gölge':'kısa gölge',bx,H*0.955,11,'#D7CCC8');
  });
  return c;
}

/* ---------- 4) KAYAÇ - MİNERAL - MADEN ---------- */
function cizKayacSema(){
  const{c,ctx,W,H}=yeniCanvas(340,200);
  const kutu=(x,y,g,h,renk,kenar,baslik,alt)=>{
    ctx.fillStyle=renk; ctx.strokeStyle=kenar; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.roundRect(x,y,g,h,12); ctx.fill(); ctx.stroke();
    kalinYaz(ctx,baslik,x+g/2,y+20,14,kenar);
    const kel=alt.split(' '); let s='', sat=[];
    ctx.font='11.5px Fredoka,Arial';
    kel.forEach(k=>{ const d=s?s+' '+k:k;
      if(ctx.measureText(d).width>g-16){sat.push(s);s=k;} else s=d; });
    if(s) sat.push(s);
    sat.forEach((t,i)=>yaz(ctx,t,x+g/2,y+40+i*15,11.5,'#546E7A'));
  };
  kutu(10,14,100,86,'#E8F5E9','#2E7D32','MİNERAL','doğada katı hâlde bulunur, kayaca renk ve sertlik verir');
  kutu(120,14,100,86,'#E3F2FD','#1565C0','KAYAÇ','bir ya da birden fazla mineralden oluşur');
  kutu(230,14,100,86,'#FFF3E0','#E65100','MADEN','ekonomik değeri olan kayaç ve mineraller');
  // Oklar
  ctx.strokeStyle='#90A4AE'; ctx.lineWidth=2.5;
  [[112,57,118,57],[222,57,228,57]].forEach(([x1,y1,x2,y2])=>{
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.fillStyle='#90A4AE';
    ctx.beginPath(); ctx.moveTo(x2+4,y2); ctx.lineTo(x2-3,y2-4); ctx.lineTo(x2-3,y2+4); ctx.fill();
  });
  // Örnekler
  yaz(ctx,'Örnekler',W/2,124,13,'#455A64');
  const ornekler=[['🪨','granit, mermer'],['💎','kuvars, kalsit'],['🥇','altın, bakır, bor']];
  ornekler.forEach((o,i)=>{
    const x=60+i*110;
    ctx.save(); ctx.font='24px serif'; ctx.textAlign='center'; ctx.fillText(o[0],x,156); ctx.restore();
    yaz(ctx,o[1],x,178,11.5,'#546E7A');
  });
  return c;
}

/* ---------- 5) FOSİLLEŞME AŞAMALARI ---------- */
function cizFosil(){
  const{c,ctx,W,H}=yeniCanvas(340,200);
  const adimlar=[
    {n:'1',b:'Canlı ölür',a:'Toprağa ya da su dibine düşer'},
    {n:'2',b:'Üstü örtülür',a:'Çamur ve kum kaplar, HAVA TEMASI KESİLİR'},
    {n:'3',b:'Yumuşaklar çürür',a:'Kemik, diş, boynuz kalır'},
    {n:'4',b:'Taşlaşır',a:'Milyonlarca yılda sertleşir, FOSİL olur'}
  ];
  const kw=(W-28)/4;
  // Metni kutu genişliğine göre satırlara böl
  const satirla=(metin,maxG,font)=>{
    ctx.font=font;
    const kel=metin.split(' '); const sat=[]; let s='';
    kel.forEach(k=>{ const d=s?s+' '+k:k;
      if(ctx.measureText(d).width>maxG){ if(s)sat.push(s); s=k; } else s=d; });
    if(s) sat.push(s);
    return sat;
  };
  adimlar.forEach((d,i)=>{
    const x=10+i*(kw+2.6);
    ctx.fillStyle=['#FFF3E0','#FFE0B2','#FFCC80','#FFB74D'][i];
    ctx.strokeStyle='#E65100'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(x,12,kw,176,11); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#E65100';
    ctx.beginPath(); ctx.arc(x+kw/2,32,12,0,7); ctx.fill();
    kalinYaz(ctx,d.n,x+kw/2,32,13,'#fff');
    // Başlık — sığmazsa iki satır
    const bSat=satirla(d.b,kw-10,'700 10.5px Fredoka,Arial');
    bSat.forEach((t,j)=>kalinYaz(ctx,t,x+kw/2,54+j*13,10.5,'#BF360C'));
    // Açıklama
    const aSat=satirla(d.a,kw-10,'9.5px Fredoka,Arial');
    aSat.forEach((t,j)=>yaz(ctx,t,x+kw/2,54+bSat.length*13+8+j*12,9.5,'#6D4C41'));
    if(i<3){
      ctx.fillStyle='#E65100';
      ctx.beginPath(); ctx.moveTo(x+kw+1,100); ctx.lineTo(x+kw-4,96); ctx.lineTo(x+kw-4,104); ctx.fill();
    }
  });
  return c;
}

/* ---------- 6) DÜNYA'NIN KATMANLARI — çeyrek dilimi çıkarılmış kesit ---------- */
function cizKatman(){
  const{c,ctx,W,H}=yeniCanvas(330,262);
  const cx=W*0.40, cy=H*0.42, rOut=96;

  // Dıştan içe: kabuk (ince), manto (kalın), dış çekirdek, iç çekirdek (katı merkez)
  const katmanlar=[
    {ad:'Yer kabuğu',   renk:'#8D6E63', kenar:'#4E342E', rBas:0.90, rBit:1.00},
    {ad:'Manto',        renk:'#FF7043', kenar:'#BF360C', rBas:0.55, rBit:0.90},
    {ad:'Dış çekirdek', renk:'#FFB300', kenar:'#E65100', rBas:0.26, rBit:0.55},
    {ad:'İç çekirdek',  renk:'#FFF176', kenar:'#F9A825', rBas:0.00, rBit:0.26}
  ];
  // Kesit: doğu (0°) ile güney (90°) arası dilim çıkarılmış — geri kalan 270° görünür
  const kesimBas=Math.PI/2, kesimBit=Math.PI*2;

  katmanlar.forEach(k=>{
    const rD=rOut*k.rBit, rI=rOut*k.rBas;
    ctx.beginPath();
    ctx.arc(cx,cy,rD,kesimBas,kesimBit,false);
    if(rI>0.5) ctx.arc(cx,cy,rI,kesimBit,kesimBas,true);
    else ctx.lineTo(cx,cy);
    ctx.closePath();
    ctx.fillStyle=k.renk; ctx.fill();
    ctx.strokeStyle=k.kenar; ctx.lineWidth=1.4; ctx.stroke();
  });
  // Kesim yüzeyini vurgulayan iki düz kenar
  ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=2.2;
  [kesimBas,kesimBit].forEach(a=>{
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a)*rOut, cy+Math.sin(a)*rOut); ctx.stroke();
  });
  ctx.strokeStyle='#37474F'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(cx,cy,rOut,kesimBas,kesimBit,false); ctx.stroke();

  // Etiketler — sağ tarafta düz satırlar, her biri kendi renginde nokta ile
  const etiketY=[H*0.10, H*0.10+22, H*0.10+44, H*0.10+66];
  const tx=W*0.66;
  katmanlar.forEach((k,i)=>{
    const rMid=rOut*(k.rBas+k.rBit)/2;
    // Bağlantı noktası: her katmanın üst-sağ (kesitten uzak) noktası
    const a=-Math.PI*0.15;
    const px=cx+Math.cos(a)*rMid, py=cy+Math.sin(a)*rMid;
    ctx.strokeStyle='#B0BEC5'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(tx-14,etiketY[i]); ctx.stroke();
    ctx.fillStyle=k.kenar;
    ctx.beginPath(); ctx.arc(px,py,2.8,0,7); ctx.fill();
    ctx.fillStyle=k.kenar;
    ctx.beginPath(); ctx.arc(tx-10,etiketY[i],3.2,0,7); ctx.fill();
    kalinYaz(ctx,k.ad,tx,etiketY[i],12,'#263238','left');
  });

  // Yer kabuğunun ince olduğunu belirten not (canvas altında, taşmayan konumda)
  yaz(ctx,'Yer kabuğu çok incedir!',cx,H-10,10.5,'#5D4037');

  return c;
}

/* ---------- SESLENDİRME ---------- */
function bolumuOku(){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const el=document.getElementById('icerik');
  const metin=el.innerText.replace(/[🌍🌓🪨🦕📌⚠️🧮🗺️🔍🧊🇹🇷🎯✅❌▸]/g,'').replace(/\s+/g,' ').trim();
  const u=new SpeechSynthesisUtterance(metin);
  u.lang='tr-TR'; u.rate=.92; u.pitch=1;
  speechSynthesis.speak(u);
}

/* ---------- ARAYÜZ ---------- */
let aktif=BOLUMLER[0].id;
function sekmeleriCiz(){
  const k=document.getElementById('sekmeler'); k.innerHTML='';
  BOLUMLER.forEach(b=>{
    const d=document.createElement('button');
    d.className='sekme'+(b.id===aktif?' aktif':'');
    d.textContent=b.ad;
    d.onclick=()=>{ aktif=b.id;
      if('speechSynthesis' in window) speechSynthesis.cancel();
      sekmeleriCiz(); icerikCiz();
      if(window.IO) IO.olay('fen-konu-anlatim',{bolum:b.id}); };
    k.appendChild(d);
  });
}
function icerikCiz(){
  const b=BOLUMLER.find(x=>x.id===aktif);
  document.getElementById('icerik').innerHTML=b.icerik();
  // Görselleri yerleştir
  const yerlesim={
    'g-hareket':cizDonmeDolanma,'g-gece':cizGeceGunduz,'g-golge':cizGolge,
    'g-kayac':cizKayacSema,'g-fosil':cizFosil,'g-katman':cizKatman
  };
  Object.entries(yerlesim).forEach(([id,fn])=>{
    const el=document.getElementById(id);
    if(el) el.appendChild(fn());
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
sekmeleriCiz(); icerikCiz();
</script>
