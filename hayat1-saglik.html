<script>
function metinKarti(t,b){
  const{c,ctx,W,H}=sahne(148,96);
  ctx.save(); ctx.fillStyle='#37474F'; ctx.font='600 '+(b||15)+'px Fredoka,Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const kel=t.split(' '); const sat=[]; let s='';
  kel.forEach(k=>{ const d=s?s+' '+k:k;
    if(ctx.measureText(d).width>130){ sat.push(s); s=k; } else s=d; });
  if(s) sat.push(s);
  const bas=H/2-(sat.length-1)*9.5;
  sat.forEach((x,i)=>ctx.fillText(x,W/2,bas+i*19));
  ctx.restore(); return c;
}
function emojiKarti(ch){
  const{c,ctx,W,H}=sahne(148,100); emoji(ctx,ch,W/2,H/2,52); return c;
}
function sayiKarti(t){
  const{c,ctx,W,H}=sahne(148,92);
  ctx.save(); ctx.fillStyle='#C62828'; ctx.font='700 40px Fredoka,Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t,W/2,H/2); ctx.restore(); return c;
}

/* ============================================================
   KİŞİSEL ALAN ÇEMBERİ — kitabın ana metaforu
   "Kişisel alanımızı çevremizdeki görünmez bir çember gibi
    düşünebiliriz. Bu çemberin içine güvendiğimiz kişileri alırız."
   ============================================================ */
function cemberSahne(durum){
  const{c,ctx,W,H}=sahne(230,164);
  const cx=W*0.42, cy=H*0.47, r=H*0.31;
  // Görünmez çember — kesikli
  ctx.save();
  ctx.setLineDash([7,5]);
  ctx.strokeStyle= durum==='ihlal' ? '#E53935' : '#43A047';
  ctx.lineWidth=3.5;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle= durum==='ihlal' ? 'rgba(229,57,53,.08)' : 'rgba(67,160,71,.08)';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // Ortadaki çocuk
  emoji(ctx,'🧒',cx,cy,40);
  // Diğer kişi
  if(durum==='ihlal'){
    emoji(ctx,'🧑',cx+r*0.55,cy,34);          // çemberin İÇİNDE — çok yakın
    ctx.save(); ctx.fillStyle='#C62828'; ctx.font='700 14px Fredoka,Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('çok yakın!',W*0.50,H*0.90); ctx.restore();
  }else if(durum==='uygun'){
    emoji(ctx,'🧑',cx+r*1.85,cy,34);          // çemberin DIŞINDA — uygun mesafe
    ctx.save(); ctx.fillStyle='#2E7D32'; ctx.font='700 14px Fredoka,Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('uygun mesafe',W*0.56,H*0.90); ctx.restore();
  }
  // Etiket
  ctx.save(); ctx.fillStyle='#546E7A'; ctx.font='600 12px Fredoka,Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('kişisel alan',cx,cy-r-12); ctx.restore();
  return c;
}

/* ===== TRAFİK SAHNELERİ ===== */
function trafikSahne(ad){
  const{c,ctx,W,H}=sahne(230,140);

  if(ad==='yaya geçidi'){
    ctx.fillStyle='#BFE3F5'; ctx.fillRect(0,0,W,H*0.34);
    ctx.fillStyle='#8BC34A'; ctx.fillRect(0,H*0.34,W,H*0.12);
    ctx.fillStyle='#616161'; ctx.fillRect(0,H*0.46,W,H*0.42);
    ctx.fillStyle='#8BC34A'; ctx.fillRect(0,H*0.88,W,H*0.12);
    // Zebra çizgileri
    ctx.fillStyle='#FFFFFF';
    for(let i=0;i<5;i++) ctx.fillRect(W*0.30+i*W*0.075,H*0.46,W*0.045,H*0.42);
    // Yaya levhası
    ctx.fillStyle='#90A4AE'; ctx.fillRect(W*0.80,H*0.30,3,H*0.30);
    ctx.fillStyle='#1565C0'; ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(W*0.73,H*0.14,W*0.17,H*0.17,4); ctx.fill(); ctx.stroke();
    emoji(ctx,'🚶',W*0.815,H*0.225,15);
    emoji(ctx,'🧒',W*0.40,H*0.66,26);
  }
  else if(ad==='trafik ışığı'){
    ctx.fillStyle='#E8F4FA'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#455A64';
    ctx.beginPath(); ctx.roundRect(W*0.40,H*0.10,W*0.20,H*0.66,8); ctx.fill();
    ctx.fillStyle='#90A4AE'; ctx.fillRect(W*0.475,H*0.76,W*0.05,H*0.18);
    [['#E53935',0.22],['#FFC107',0.42],['#4CAF50',0.62]].forEach(([renk,y])=>{
      ctx.fillStyle=renk;
      ctx.beginPath(); ctx.arc(W*0.50,H*y,H*0.075,0,Math.PI*2); ctx.fill();
    });
  }
  else if(ad==='araç içi'){
    ctx.fillStyle='#CFD8DC'; ctx.fillRect(0,0,W,H);
    // Koltuklar
    ctx.fillStyle='#546E7A';
    ctx.beginPath(); ctx.roundRect(W*0.10,H*0.30,W*0.32,H*0.50,7); ctx.fill();
    ctx.beginPath(); ctx.roundRect(W*0.55,H*0.30,W*0.32,H*0.50,7); ctx.fill();
    ctx.save(); ctx.fillStyle='#37474F'; ctx.font='600 11px Fredoka,Arial';
    ctx.textAlign='center';
    ctx.fillText('ön koltuk',W*0.26,H*0.92);
    ctx.fillText('arka koltuk',W*0.71,H*0.92); ctx.restore();
    emoji(ctx,'🧒',W*0.71,H*0.50,30);
    // Emniyet kemeri — omuzdan çapraz + toka
    ctx.strokeStyle='#212121'; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(W*0.605,H*0.355); ctx.lineTo(W*0.795,H*0.665); ctx.stroke();
    ctx.strokeStyle='#616161'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(W*0.605,H*0.355); ctx.lineTo(W*0.795,H*0.665); ctx.stroke();
    ctx.fillStyle='#C62828'; ctx.strokeStyle='#8E0000'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(W*0.775,H*0.63,W*0.055,H*0.075,2); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.fillStyle='#2E7D32'; ctx.font='700 11px Fredoka,Arial';
    ctx.textAlign='center'; ctx.fillText('kemer takılı ✓',W*0.71,H*0.18); ctx.restore();
    // Direksiyon
    ctx.strokeStyle='#37474F'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(W*0.26,H*0.22,H*0.10,0,Math.PI*2); ctx.stroke();
  }
  else if(ad==='üst geçit'){
    ctx.fillStyle='#BFE3F5'; ctx.fillRect(0,0,W,H*0.62);
    ctx.fillStyle='#616161'; ctx.fillRect(0,H*0.62,W,H*0.26);
    ctx.fillStyle='#8BC34A'; ctx.fillRect(0,H*0.88,W,H*0.12);
    ctx.strokeStyle='#FFEB3B'; ctx.lineWidth=2.5; ctx.setLineDash([9,7]);
    ctx.beginPath(); ctx.moveTo(0,H*0.75); ctx.lineTo(W,H*0.75); ctx.stroke();
    ctx.setLineDash([]);
    // Köprü
    ctx.fillStyle='#B0BEC5';
    ctx.fillRect(W*0.14,H*0.30,W*0.72,H*0.05);
    ctx.fillRect(W*0.14,H*0.35,W*0.04,H*0.27);
    ctx.fillRect(W*0.82,H*0.35,W*0.04,H*0.27);
    ctx.strokeStyle='#90A4AE'; ctx.lineWidth=2;
    for(let i=0;i<7;i++){ ctx.beginPath();
      ctx.moveTo(W*(0.18+i*0.105),H*0.30); ctx.lineTo(W*(0.18+i*0.105),H*0.20); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(W*0.16,H*0.20); ctx.lineTo(W*0.84,H*0.20); ctx.stroke();
    emoji(ctx,'🧒',W*0.50,H*0.245,20);
  }
  return c;
}

/* ===== 3. KİŞİSEL ALAN — KAVRAM ===== */
function etkKisiselAlanKavram(){
  const tip=rnd(0,1);
  if(tip===0){
    const ihlalMi=rnd(0,1)===0;
    const g=cemberSahne(ihlalMi?'ihlal':'uygun');
    g.style.width='220px'; g.style.height='157px';
    return{
      yonerge:'Bu resimde kişisel alana saygı gösteriliyor mu?',
      secenek:['Evet, uygun mesafede duruyor','Hayır, çok yaklaşmış'],
      dogru:ihlalMi?'Hayır, çok yaklaşmış':'Evet, uygun mesafede duruyor',
      ustGorsel:g, ciz:t=>metinKarti(t,14),
      ipucu:ihlalMi
        ? 'Kişisel alan, çevremizdeki görünmez bir çember gibidir. İzinsiz bu çembere girmek rahatsız eder.'
        : 'Konuşurken aramızda uygun bir mesafe bırakırız. Bu herkesi rahat ettirir.'
    };
  }
  const sorular=[
    {s:'Kişisel alan ne demektir?',c:'Kendimi rahat ve güvende hissettiğim alan',
     y:['Oyun oynadığım bahçe','Oturduğum sıra'],
     e:'Kişisel alanımız, kendimizi rahat ve güvende hissettiğimiz alandır. Çevremizdeki görünmez bir çember gibi düşünebiliriz.'},
    {s:'Kişisel alanımızın içine kimleri alırız?',c:'Güvendiğimiz kişileri',
     y:['Herkesi','Hiç kimseyi'],
     e:'Bu çemberin içine güvendiğimiz kişileri alırız. Kimi alacağımıza biz karar veririz.'},
    {s:'Herkesin kişisel alanı var mıdır?',c:'Evet, herkesin vardır',

     e:'Herkesin kişisel alanı vardır. Başkalarının alanına da saygı göstermeliyiz.'}
  ];
  const it=pick(sorular);
  return{
    yonerge:it.s, secenek:shuffle([it.c,...it.y]), dogru:it.c,
    ciz:t=>metinKarti(t,14), ipucu:it.e
  };
}

/* ===== 6. TRAFİK — YOLCU ===== */
function etkTrafikYolcu(){
  const tip=rnd(0,1);
  if(tip===0){

  ];
  const it=pick(renkler);
  const g=trafikSahne('trafik ışığı'); g.style.width='180px'; g.style.height='110px';
  return{
    yonerge:'Trafik ışığında '+it.ad.toLocaleUpperCase('tr')+' yandığında ne yaparız?',
    secenek:shuffle([it.ne,...shuffle(renkler.filter(x=>x.ad!==it.ad)).map(x=>x.ne)]),

}
