<script>
/* ---------- ÇİZİM YARDIMCILARI ---------- */
function yeniCanvas(g,h){
  const c=document.createElement('canvas');
  const dpr=Math.min(devicePixelRatio||1,2);
  c.width=g*dpr; c.height=h*dpr;
  c.style.width=g+'px'; c.style.height=h+'px';
  const x=c.getContext('2d'); x.scale(dpr,dpr);
  x.fillStyle='#FFFDF8'; x.fillRect(0,0,g,h);
  return {c,ctx:x,W:g,H:h};
}
function yaz(ctx,t,x,y,b,renk,hiza){
  ctx.save(); ctx.fillStyle=renk||'#37474F';
  ctx.font=(b||12)+'px Fredoka,Arial'; ctx.textAlign=hiza||'center';
  ctx.textBaseline='middle'; ctx.fillText(t,x,y); ctx.restore();
}
function kalinYaz(ctx,t,x,y,b,renk,hiza){
  ctx.save(); ctx.fillStyle=renk||'#37474F';
  ctx.font='700 '+(b||12)+'px Fredoka,Arial'; ctx.textAlign=hiza||'center';
  ctx.textBaseline='middle'; ctx.fillText(t,x,y); ctx.restore();
}

/* ---------- 1) BASAMAK VE BÖLÜK TABLOSU ---------- */
function cizBasamakTablo(){
  const{c,ctx,W,H}=yeniCanvas(340,168);
  const sayi='548392';
  const basliklar=['Yüz\nBinler','On\nBinler','Binler','Yüzler','Onlar','Birler'];
  const kw=54, x0=(W-kw*6)/2, y0=44;
  // Bölük fonları
  ctx.fillStyle='#EDE7F6'; ctx.fillRect(x0,y0,kw*3,58);         // binler bölüğü
  ctx.fillStyle='#F3E5F5'; ctx.fillRect(x0+kw*3,y0,kw*3,58);    // birler bölüğü
  for(let i=0;i<6;i++){
    const x=x0+i*kw;
    ctx.strokeStyle='#CE93D8'; ctx.lineWidth=1.6;
    ctx.strokeRect(x,y0,kw,58);
    const sat=basliklar[i].split('\n');
    sat.forEach((s,j)=>yaz(ctx,s,x+kw/2,y0-24+j*12,10.5,'#6A1B9A'));
    kalinYaz(ctx,sayi[i],x+kw/2,y0+29,24,'#4A148C');
  }
  // Bölük etiketleri altta
  kalinYaz(ctx,'BİNLER BÖLÜĞÜ',x0+kw*1.5,y0+80,12,'#8E24AA');
  kalinYaz(ctx,'BİRLER BÖLÜĞÜ',x0+kw*4.5,y0+80,12,'#AB47BC');
  // Bölük ayracı
  ctx.strokeStyle='#6A1B9A'; ctx.lineWidth=2.5; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(x0+kw*3,y0-6); ctx.lineTo(x0+kw*3,y0+64); ctx.stroke();
  ctx.setLineDash([]);
  yaz(ctx,'548 392 → "beş yüz kırk sekiz bin üç yüz doksan iki"',W/2,y0+108,11.5,'#546E7A');
  return c;
}

/* ---------- 2) BASAMAK DEĞERİ vs SAYI DEĞERİ ---------- */
function cizBasamakSayiDegeri(){
  const{c,ctx,W,H}=yeniCanvas(320,150);
  const sayi='3254', basamaklar=['Binler','Yüzler','Onlar','Birler'];
  const sayiDeg=[3,2,5,4], basDeg=[3000,200,50,4];
  const kw=64, x0=(W-kw*4)/2, y0=30;
  for(let i=0;i<4;i++){
    const x=x0+i*kw, vurgu=(i===1);
    ctx.fillStyle=vurgu?'#FFF3E0':'#F3E5F5';
    ctx.strokeStyle=vurgu?'#FB8C00':'#CE93D8'; ctx.lineWidth=vurgu?2.5:1.6;
    ctx.beginPath(); ctx.roundRect(x+4,y0,kw-8,42,8); ctx.fill(); ctx.stroke();
    kalinYaz(ctx,sayi[i],x+kw/2,y0+21,22,vurgu?'#E65100':'#4A148C');
    yaz(ctx,basamaklar[i],x+kw/2,y0-12,10.5,'#78909C');
  }
  yaz(ctx,'Yüzler basamağındaki RAKAM:',W/2,y0+66,12,'#37474F');
  kalinYaz(ctx,'2  (sayı değeri)',W/2,y0+86,14,'#1565C0');
  yaz(ctx,'Bu rakamın o basamaktaki DEĞERİ:',W/2,y0+110,12,'#37474F');
  kalinYaz(ctx,'200  (basamak değeri)',W/2,y0+130,14,'#E65100');
  return c;
}

/* ---------- 3) ABAKÜS ---------- */
function cizAbakus(){
  const{c,ctx,W,H}=yeniCanvas(320,178);
  const boncuklar=[3,0,4,1,5,2]; // Yüzbinler..Birler
  const basliklar=['YB','OB','B','Y','O','Bir'];
  const cw=48, x0=(W-cw*6)/2, tepe=20, taban=130;
  ctx.strokeStyle='#8D6E63'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x0-10,taban); ctx.lineTo(x0+cw*6+10,taban); ctx.stroke();
  for(let i=0;i<6;i++){
    const x=x0+i*cw+cw/2;
    ctx.strokeStyle='#A1887F'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(x,tepe); ctx.lineTo(x,taban); ctx.stroke();
    for(let b=0;b<boncuklar[i];b++){
      ctx.fillStyle=i<3?'#7B1FA2':'#AB47BC';
      ctx.beginPath(); ctx.arc(x,taban-16-b*17,9,0,7); ctx.fill();
      ctx.strokeStyle='#4A148C'; ctx.lineWidth=1.2; ctx.stroke();
    }
    yaz(ctx,basliklar[i],x,taban+14,11,'#6A1B9A');
  }
  yaz(ctx,'304 152',W/2,H-14,14,'#4A148C');
  return c;
}

/* ---------- 4) TABAN BLOKLARI ---------- */
function cizTabanBlok(){
  const{c,ctx,W,H}=yeniCanvas(320,140);
  // binlik (küp gibi büyük kare), yüzlük, onluk, birlik
  const konum=[
    {x:14, ad:'1 BİNLİK', deg:'1000'},
    {x:120,ad:'1 YÜZLÜK', deg:'100'},
    {x:210,ad:'1 ONLUK',  deg:'10'},
    {x:280,ad:'1 BİRLİK', deg:'1'}
  ];
  // Binlik: büyük kare ızgara 10x10 küçük kareden oluşur (basitleştirilmiş)
  ctx.fillStyle='#7B1FA2'; ctx.strokeStyle='#4A148C'; ctx.lineWidth=1.5;
  ctx.fillRect(14,20,74,74); ctx.strokeRect(14,20,74,74);
  ctx.strokeStyle='rgba(255,255,255,.4)';
  for(let i=1;i<10;i++){
    ctx.beginPath(); ctx.moveTo(14+i*7.4,20); ctx.lineTo(14+i*7.4,94); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(14,20+i*7.4); ctx.lineTo(88,20+i*7.4); ctx.stroke();
  }
  // Yüzlük: 10x10 kare ızgara (küçük)
  ctx.fillStyle='#AB47BC'; ctx.strokeStyle='#6A1B9A'; ctx.lineWidth=1.2;
  ctx.fillRect(120,45,42,42); ctx.strokeRect(120,45,42,42);
  ctx.strokeStyle='rgba(255,255,255,.5)';
  for(let i=1;i<10;i++){
    ctx.beginPath(); ctx.moveTo(120+i*4.2,45); ctx.lineTo(120+i*4.2,87); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(120,45+i*4.2); ctx.lineTo(162,45+i*4.2); ctx.stroke();
  }
  // Onluk: dikey çubuk
  ctx.fillStyle='#CE93D8'; ctx.strokeStyle='#8E24AA'; ctx.lineWidth=1.2;
  ctx.fillRect(210,45,10,42); ctx.strokeRect(210,45,10,42);
  for(let i=1;i<10;i++){ ctx.strokeStyle='rgba(255,255,255,.6)';
    ctx.beginPath(); ctx.moveTo(210,45+i*4.2); ctx.lineTo(220,45+i*4.2); ctx.stroke(); }
  // Birlik: küçük kare
  ctx.fillStyle='#F3E5F5'; ctx.strokeStyle='#8E24AA'; ctx.lineWidth=1.5;
  ctx.fillRect(278,75,12,12); ctx.strokeRect(278,75,12,12);

  const merkezX={ '1 BİNLİK':51, '1 YÜZLÜK':141, '1 ONLUK':215, '1 BİRLİK':284 };
  konum.forEach(k=>{
    const mx=merkezX[k.ad];
    kalinYaz(ctx,k.ad,mx,115,10,'#4A148C');
    yaz(ctx,'= '+k.deg,mx,129,10,'#78909C');
  });
  return c;
}

/* ---------- 5) SAYI DOĞRUSUNDA YUVARLAMA ---------- */
function cizYuvarlama(sayi,birim,asagi,yukari){
  const{c,ctx,W,H}=yeniCanvas(300,110);
  const sol=30, sag=W-30, y=H*0.55;
  ctx.strokeStyle='#8D6E63'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(sol-10,y); ctx.lineTo(sag+10,y); ctx.stroke();
  [[sol-10,-1],[sag+10,1]].forEach(([x,d])=>{
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-d*7,y-4);
    ctx.moveTo(x,y); ctx.lineTo(x-d*7,y+4); ctx.stroke();
  });
  const oran=(sayi-asagi)/(yukari-asagi);
  const px=sol+(sag-sol)*oran;
  [[sol,asagi],[sag,yukari]].forEach(([x,v])=>{
    ctx.strokeStyle='#6A1B9A'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(x,y-8); ctx.lineTo(x,y+8); ctx.stroke();
    kalinYaz(ctx,String(v),x,y+24,13,'#4A148C');
  });
  // Sayı noktası
  ctx.fillStyle='#E65100';
  ctx.beginPath(); ctx.arc(px,y,6,0,7); ctx.fill();
  ctx.strokeStyle='#BF360C'; ctx.lineWidth=1.5; ctx.stroke();
  kalinYaz(ctx,String(sayi),px,y-20,14,'#E65100');
  // En yakın olana ok
  const yakinX = oran<0.5 ? sol : sag;
  ctx.strokeStyle='#2E7D32'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(px,y+34); ctx.lineTo(yakinX,y+34); ctx.stroke();
  const okYon = yakinX>px?1:-1;
  ctx.fillStyle='#2E7D32';
  ctx.beginPath(); ctx.moveTo(yakinX,y+34); ctx.lineTo(yakinX-okYon*8,y+30); ctx.lineTo(yakinX-okYon*8,y+38); ctx.fill();
  return c;
}

/* ---------- 6) ÖRÜNTÜ ---------- */
function cizOruntu(){
  const{c,ctx,W,H}=yeniCanvas(300,78);
  const dizi=[3,7,11,15,19,'?'];
  const kw=(W-16)/dizi.length;
  dizi.forEach((v,i)=>{
    const x=8+i*kw, bos=v==='?';
    ctx.fillStyle=bos?'#FFF3E0':'#F3E5F5';
    ctx.strokeStyle=bos?'#FB8C00':'#AB47BC'; ctx.lineWidth=bos?2.8:1.8;
    ctx.beginPath(); ctx.roundRect(x+3,14,kw-8,44,10); ctx.fill(); ctx.stroke();
    kalinYaz(ctx,String(v),x+kw/2-2,36,17,bos?'#E65100':'#4A148C');
    if(i<dizi.length-1){
      ctx.save(); ctx.fillStyle='#8E24AA'; ctx.font='600 9px Fredoka,Arial';
      ctx.textAlign='center'; ctx.fillText('+4',x+kw-2,10); ctx.restore();
    }
  });
  return c;
}

/* ---------- SESLENDİRME ---------- */
function bolumuOku(){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const el=document.getElementById('icerik');
  const metin=el.innerText.replace(/[🔢💠📏📊📌⚠️🧮▸🔁]/g,'').replace(/\s+/g,' ').trim();
  const u=new SpeechSynthesisUtterance(metin);
  u.lang='tr-TR'; u.rate=.92; u.pitch=1;
  speechSynthesis.speak(u);
}

/* ---------- ARAYÜZ ---------- */
let aktif=BOLUMLER[0].id;
function sekmeleriCiz(){
  const k=document.getElementById('sekmeler'); k.innerHTML='';
  BOLUMLER.forEach(b=>{
    const d=document.createElement('button');
    d.className='sekme'+(b.id===aktif?' aktif':'');
    d.textContent=b.ad;
    d.onclick=()=>{ aktif=b.id;
      if('speechSynthesis' in window) speechSynthesis.cancel();
      sekmeleriCiz(); icerikCiz();
      if(window.IO) IO.olay('mat-konu-anlatim',{bolum:b.id}); };
    k.appendChild(d);
  });
}
function icerikCiz(){
  const b=BOLUMLER.find(x=>x.id===aktif);
  document.getElementById('icerik').innerHTML=b.icerik();
  const yerlesim={
    'g-basamak':cizBasamakTablo,
    'g-deger':cizBasamakSayiDegeri,
    'g-abakus':cizAbakus,
    'g-blok':cizTabanBlok,
    'g-yuvarlama1':()=>cizYuvarlama(7395,10,7390,7400),
    'g-yuvarlama2':()=>cizYuvarlama(7395,100,7300,7400),
    'g-oruntu':cizOruntu
  };
  Object.entries(yerlesim).forEach(([id,fn])=>{
    const el=document.getElementById(id);
    if(el) el.appendChild(fn());
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
sekmeleriCiz(); icerikCiz();
</script>
