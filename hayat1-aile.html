<script>
function metinKarti(t,b){
  const{c,ctx,W,H}=sahne(148,96);
  ctx.save(); ctx.fillStyle='#37474F'; ctx.font='600 '+(b||15)+'px Fredoka,Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const kel=t.split(' '); const sat=[]; let s='';
  kel.forEach(k=>{ const d=s?s+' '+k:k;
    if(ctx.measureText(d).width>130){ sat.push(s); s=k; } else s=d; });
  if(s) sat.push(s);
  const bas=H/2-(sat.length-1)*9.5;
  sat.forEach((x,i)=>ctx.fillText(x,W/2,bas+i*19));
  ctx.restore(); return c;
}
function emojiKarti(ch){
  const{c,ctx,W,H}=sahne(148,100); emoji(ctx,ch,W/2,H/2,50); return c;
}

/* ============================================================
   AİLE ŞEMASI
   Kitap çekirdek ve geniş aileyi tanımlıyor. Bu kavramlar
   öğretiliyor ama çocuğa "senin ailen hangisi" diye
   SORULMUYOR — her aile farklıdır.
   ============================================================ */
function aileSahne(tip){
  const{c,ctx,W,H}=sahne(240,148);
  ctx.fillStyle='#FFF8F0'; ctx.fillRect(0,0,W,H);
  // Ev silueti
  ctx.fillStyle='#FFE0B2'; ctx.strokeStyle='#E8A33D'; ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(W*0.06,H*0.30); ctx.lineTo(W*0.50,H*0.06); ctx.lineTo(W*0.94,H*0.30);
  ctx.lineTo(W*0.94,H*0.80); ctx.lineTo(W*0.06,H*0.80); ctx.closePath();
  ctx.fill(); ctx.stroke();

  const kisiler = tip==='çekirdek'
    ? ['👩','👨','🧒','👧']
    : ['👵','👴','👩','👨','🧒','👧','👶'];
  const sut=Math.min(4,kisiler.length);
  const sat=Math.ceil(kisiler.length/sut);
  const boyut=tip==='çekirdek'?34:27;
  kisiler.forEach((k,i)=>{
    const s2=Math.min(sut,kisiler.length-Math.floor(i/sut)*sut);
    const x=W/2+((i%sut)-(s2-1)/2)*(W/(sut+0.7));
    const y=H*0.50+(Math.floor(i/sut)-(sat-1)/2)*(boyut*1.15);
    emoji(ctx,k,x,y,boyut);
  });
  ctx.save(); ctx.fillStyle='#8D6E52'; ctx.font='700 13px Fredoka,Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(tip==='çekirdek'?'çekirdek aile':'geniş aile',W/2,H*0.91);
  ctx.restore();
  return c;
}

/* ===== SOFRA SAHNESİ ===== */
function sofraSahne(){
  const{c,ctx,W,H}=sahne(240,132);
  ctx.fillStyle='#FFF6E8'; ctx.fillRect(0,0,W,H*0.55);
  ctx.fillStyle='#D8C3A5'; ctx.fillRect(0,H*0.55,W,H*0.45);
  // Masa
  ctx.fillStyle='#C68642'; ctx.strokeStyle='#7A4B1C'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.ellipse(W/2,H*0.66,W*0.40,H*0.14,0,0,Math.PI*2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='#8D5524'; ctx.fillRect(W*0.47,H*0.78,W*0.06,H*0.16);
  // Tabaklar ve çatal kaşık
  [0.30,0.50,0.70].forEach(x=>{
    ctx.fillStyle='#fff'; ctx.strokeStyle='#B0BEC5'; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.ellipse(W*x,H*0.64,W*0.058,H*0.028,0,0,Math.PI*2);
    ctx.fill(); ctx.stroke();
    emoji(ctx,'🍽️',W*x,H*0.64,13);
  });
  // Aile bireyleri (kim oldukları belirtilmiyor — her aile farklı)
  emoji(ctx,'🧒',W*0.22,H*0.40,28);
  emoji(ctx,'🧑',W*0.50,H*0.36,28);
  emoji(ctx,'🧓',W*0.78,H*0.40,28);
  return c;
}

/* ===== 1. AİLE KAVRAMI ===== */
function etkAileKavram(){
  const tip=rnd(0,1);
  if(tip===0){
    const cekirdekMi=rnd(0,1)===0;
    const g=aileSahne(cekirdekMi?'çekirdek':'geniş');
    g.style.width='230px'; g.style.height='142px';
    return{
      yonerge:'Bu resimde hangi aile türü gösteriliyor?',
      secenek:shuffle(['çekirdek aile','geniş aile']),
      dogru:cekirdekMi?'çekirdek aile':'geniş aile',
      ustGorsel:g, ciz:t=>metinKarti(t,17),
      ipucu:cekirdekMi
        ? 'ÇEKİRDEK AİLE anne, baba ve çocuklardan oluşur.'
        : 'GENİŞ AİLE, anne baba ve çocukların yanında başka aile bireylerinin de bulunduğu büyük ailedir.'
    };
  }
  const sorular=[
    {s:'Çekirdek aile kimlerden oluşur?',c:'Anne, baba ve çocuklar',
     y:['Sadece çocuklar','Bütün akrabalar'],
     e:'Çekirdek aile; anne, baba ve çocuklardan oluşur.'},
    {s:'Geniş aile nedir?',c:'Başka aile bireylerinin de bulunduğu büyük aile',
     y:['Sadece anne ve baba','Sadece iki kişi'],
     e:'Geniş aile; anne, baba ve çocuklar dışında başka aile bireylerinin de bulunduğu büyük ailedir.'},
    {s:'Bütün aileler birbirinin aynısı mıdır?',c:'Hayır, her aile farklıdır',
     y:['Evet, hepsi aynıdır','Sadece iki çeşit vardır'],
     e:'Her aile birbirinden farklıdır. Kalabalık ya da az kişili olabilir; hepsi birer ailedir.'},
    {s:'Ailemizde kendimizi nasıl hissederiz?',c:'Güvende ve güçlü',
     y:['Yalnız','Korkmuş'],
     e:'Aile olmak önemlidir. Çünkü ailemizde kendimizi güvende ve güçlü hissederiz.'},
    {s:'Aileyi bir arada tutan şey nedir?',c:'Sevgi, saygı ve anlayış',
     y:['Evin büyüklüğü','Kişi sayısı'],
     e:'Ailemizi bir arada tutan değerler vardır: sevgi, şefkat, fedakârlık, anlayışlı olmak, birlik ve beraberlik.'}
  ];
  const it=pick(sorular);
  return{
    yonerge:it.s, secenek:shuffle([it.c,...it.y]), dogru:it.c,
    ciz:t=>metinKarti(t,14), ipucu:it.e
  };
}

  {ifade:'İyi geceler', ne:'Gece uyumadan önce söyleriz.'},
  {ifade:'Geçmiş olsun',ne:'Hasta olan birine söyleriz.'}
];

      yonerge:it.ne+' Hangi sözü söyleriz?',
      secenek:shuffle([it.ifade,...w.slice(0,2)]), dogru:it.ifade,

    };
  }
  const durumlar=[
    {d:'Yemek bittiğinde yemeği hazırlayana ne dersin?',c:'Elinize sağlık',
     y:['Günaydın','Geçmiş olsun'],
     e:'Yemeği hazırlayan kişiye "Elinize sağlık." deriz.'},
    {d:'Birinden bir şey isterken ne dersin?',c:'Lütfen',
     y:['Hemen ver','Tamam'],
     e:'Bir şey isterken "Lütfen" demek nezakettir.'},
    {d:'Sana yardım eden birine ne dersin?',c:'Teşekkür ederim',
     y:['Tamam','Hadi'],
     e:'İyilik yapan birine "Teşekkür ederim." deriz.'},
    {d:'Yanlışlıkla birine çarptın. Ne dersin?',c:'Özür dilerim',
     y:['Sen dikkat et','Hiçbir şey'],
     e:'Bir yanlış yaptığımızda "Özür dilerim." deriz. Bu, özrü bilen kişinin gücüdür.'},

     y:['Afiyet olsun','Günaydın'],

  ];
  const it2=pick(durumlar);
  return{
    yonerge:it2.d, secenek:shuffle([it2.c,...it2.y]), dogru:it2.c,
    ciz:t=>metinKarti(t,16), ipucu:it2.e
  };
}

}
