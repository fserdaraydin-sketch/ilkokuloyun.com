<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfabeyi Öğren - İlkokulOyun.com</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 700px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #FF6B6B;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .progress-section {
            margin-bottom: 20px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #DDD;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF6B6B 0%, #FF8E72 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .letter-display {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            background: #F5F5F5;
            border-radius: 15px;
        }

        .letter-name {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .current-letter {
            font-size: 18px;
            color: #4ECDC4;
            font-weight: bold;
        }

        .target-letter {
            font-size: 18px;
            color: #FF6B6B;
            font-weight: bold;
            margin-top: 5px;
        }

        .score {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-bottom: 20px;
            background: #F5F5F5;
            padding: 15px;
            border-radius: 10px;
        }

        .score-item h3 {
            color: #FF6B6B;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .score-item p {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }

        .instruction {
            text-align: center;
            background: #FFF3E0;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #E65100;
            font-weight: bold;
            font-size: 14px;
        }

        #canvas {
            display: block;
            border: 3px solid #FF6B6B;
            border-radius: 10px;
            background: linear-gradient(135deg, #FFF9E6 0%, #FFF3E0 100%);
            cursor: crosshair;
            width: 100%;
            max-width: 600px;
            height: 350px;
            margin: 0 auto 20px;
            touch-action: none;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn-primary {
            background: #FF6B6B;
            color: white;
        }

        .btn-primary:hover {
            background: #FF5252;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #DDD;
            color: #333;
        }

        .btn-secondary:hover {
            background: #CCC;
        }

        .back-button {
            display: block;
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #5568d3;
        }

        .completion-message {
            text-align: center;
            padding: 15px;
            background: #C8E6C9;
            color: #2E7D32;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 10px;
            display: none;
        }

        .completion-message.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 15px;
            }

            .header h1 {
                font-size: 24px;
            }

            #canvas {
                height: 280px;
            }

            .score {
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>📖 Alfabeyi Öğren!</h1>
            <p>Harflerin üzerinden parmağınla geçin</p>
        </div>

        <div class="progress-section">
            <div class="progress-text">
                <span id="progressLabel">İlerleme</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="score">
            <div class="score-item">
                <h3>Tamamlanan</h3>
                <p id="lettersDone">0</p>
            </div>
            <div class="score-item">
                <h3>Sırada</h3>
                <p id="currentLetterNum">1 / 29</p>
            </div>
            <div class="score-item">
                <h3>Puan</h3>
                <p id="score">0</p>
            </div>
        </div>

        <div class="letter-display">
            <div class="letter-name">Parmakla takip et</div>
            <div class="current-letter" id="currentLetter">A</div>
            <div class="target-letter" id="targetLetter">a</div>
        </div>

        <div class="instruction" id="instruction">
            👇 Büyük harfin üzerinden parmağınla geçin!
        </div>

        <div class="completion-message" id="completionMsg">
            ✅ Tebrikler! Sonraki harfe geçiyoruz...
        </div>

        <canvas id="canvas"></canvas>

        <div class="controls">
            <button class="btn btn-secondary" onclick="resetLetter()">🔄 Yeniden Dene</button>
            <button class="btn btn-primary" onclick="skipLetter()">⏭️ Atla</button>
        </div>

        <button class="back-button" onclick="history.back()">← Geri Dön</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Türkçe alfabesi
        const alphabet = ['A', 'B', 'C', 'Ç', 'D', 'E', 'F', 'G', 'Ğ', 'H', 
                         'I', 'İ', 'J', 'K', 'L', 'M', 'N', 'O', 'Ö', 'P', 
                         'R', 'S', 'Ş', 'T', 'U', 'Ü', 'V', 'Y', 'Z'];

        let currentLetterIndex = 0;
        let score = 0;
        let lettersDone = 0;
        let touchCoverage = 0;
        let isDrawing = false;
        let coveredPixels = new Set();

        // Canvas boyutunu ayarla
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            drawLetter();
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function drawLetter() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            coveredPixels.clear();

            const letter = alphabet[currentLetterIndex];
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Büyük harf çiz (çizgili outline)
            ctx.font = 'bold 200px Arial';
            ctx.fillStyle = 'rgba(78, 205, 196, 0.1)';
            ctx.strokeStyle = '#4ECDC4';
            ctx.lineWidth = 4;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Dolgulu
            ctx.fillText(letter, centerX, centerY);
            // Outline
            ctx.strokeText(letter, centerX, centerY);

            // Talimat
            ctx.font = 'bold 24px Arial';
            ctx.fillStyle = '#FF6B6B';
            ctx.fillText('Harfin üzerinden geç!', centerX, canvas.height - 30);

            updateDisplay();
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            let x, y;
            if (e.touches) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            } else {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }
            return { x, y };
        }

        function startDrawing(e) {
            isDrawing = true;
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const pos = getMousePos(e);
            const imageData = ctx.getImageData(pos.x - 5, pos.y - 5, 10, 10);
            const data = imageData.data;

            // Harf piksellerine dokunup dokunmadığını kontrol et
            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] > 100) { // Alpha channel > 100
                    coveredPixels.add(`${pos.x},${pos.y}`);
                }
            }

            // Çizimi göster
            ctx.fillStyle = 'rgba(255, 107, 107, 0.3)';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
            ctx.fill();

            updateProgress();

            // 60% tamamlandı mı?
            if (touchCoverage > 60) {
                completeLetterWithAnimation();
            }
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function updateProgress() {
            // Harf alanını yaklaşık hesapla
            const estimatedLetterPixels = 8000; // Yaklaşık
            touchCoverage = Math.min(100, Math.round((coveredPixels.size / estimatedLetterPixels) * 100));
        }

        function updateDisplay() {
            const letter = alphabet[currentLetterIndex];
            const smallLetter = letter.toLowerCase();

            document.getElementById('currentLetter').textContent = letter;
            document.getElementById('targetLetter').textContent = smallLetter;
            document.getElementById('currentLetterNum').textContent = `${currentLetterIndex + 1} / ${alphabet.length}`;
            document.getElementById('lettersDone').textContent = lettersDone;
            document.getElementById('score').textContent = score;

            // Progress bar
            const progress = ((currentLetterIndex) / alphabet.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressPercent').textContent = Math.round(progress) + '%';
            document.getElementById('progressLabel').textContent = `${lettersDone} tamamlandı`;
        }

        function completeLetterWithAnimation() {
            if (touchCoverage < 60) return;

            isDrawing = false;
            const msg = document.getElementById('completionMsg');
            msg.classList.add('show');

            score += 50 + Math.round(touchCoverage);
            lettersDone++;

            setTimeout(() => {
                msg.classList.remove('show');
                nextLetter();
            }, 1200);
        }

        function nextLetter() {
            if (currentLetterIndex < alphabet.length - 1) {
                currentLetterIndex++;
                coveredPixels.clear();
                touchCoverage = 0;
                drawLetter();

                // Seslendirme (opsiyonel)
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(alphabet[currentLetterIndex]);
                    utterance.lang = 'tr-TR';
                    speechSynthesis.speak(utterance);
                }
            } else {
                alert('🎉 Tebrikler! Alfabeyi tamamladın!\n\nToplam Puan: ' + score);
                resetGame();
            }
        }

        function resetLetter() {
            coveredPixels.clear();
            touchCoverage = 0;
            drawLetter();
            document.getElementById('instruction').textContent = '👇 Büyük harfin üzerinden parmağınla geçin!';
        }

        function skipLetter() {
            score += 25;
            lettersDone++;
            nextLetter();
        }

        function resetGame() {
            currentLetterIndex = 0;
            score = 0;
            lettersDone = 0;
            touchCoverage = 0;
            coveredPixels.clear();
            drawLetter();
        }

        // Event listeners
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        // Başlat
        drawLetter();
    </script>
</body>
</html>
