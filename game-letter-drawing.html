<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harf Çiz - İlkokulOyun.com</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #FF6B6B;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn-primary {
            background: #FF6B6B;
            color: white;
        }

        .btn-primary:hover {
            background: #FF5252;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #DDD;
            color: #333;
        }

        .btn-secondary:hover {
            background: #CCC;
            transform: translateY(-2px);
        }

        #canvas {
            display: block;
            border: 3px solid #FF6B6B;
            border-radius: 10px;
            background: white;
            cursor: crosshair;
            width: 100%;
            max-width: 500px;
            height: 400px;
            margin: 0 auto 20px;
            touch-action: none;
        }

        .info {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .score {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-bottom: 20px;
            background: #F5F5F5;
            padding: 15px;
            border-radius: 10px;
        }

        .score-item h3 {
            color: #FF6B6B;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .score-item p {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .back-button {
            display: block;
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 15px;
            }

            .header h1 {
                font-size: 24px;
            }

            #canvas {
                height: 300px;
            }

            .controls {
                gap: 8px;
            }

            .btn {
                font-size: 12px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>✍️ Harf Çiz!</h1>
            <p>Parmağınla ekrana harfler çizin</p>
        </div>

        <div class="score">
            <div class="score-item">
                <h3>Çizilmiş Harfler</h3>
                <p id="letterCount">0</p>
            </div>
            <div class="score-item">
                <h3>Puan</h3>
                <p id="score">0</p>
            </div>
        </div>

        <div class="info" id="instruction">
            👇 Ekrana harf çizmek için dokunun ve sürükleyin
        </div>

        <canvas id="canvas"></canvas>

        <div class="controls">
            <button class="btn btn-secondary" onclick="clearCanvas()">🗑️ Temizle</button>
            <button class="btn btn-primary" onclick="saveDrawing()">💾 Kaydet</button>
        </div>

        <button class="back-button" onclick="history.back()">← Geri Dön</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Canvas boyutunu ayarla
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            drawGrid();
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Renk ve çizgi ayarları
        ctx.strokeStyle = '#FF6B6B';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        let isDrawing = false;
        let letterCount = 0;
        let score = 0;

        // Grid çiz (rehber için)
        function drawGrid() {
            ctx.strokeStyle = '#F0F0F0';
            ctx.lineWidth = 1;
            const gridSize = 20;
            for (let i = 0; i < canvas.width; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
        }

        // Mouse/Touch başladı
        function startDrawing(e) {
            isDrawing = true;
            const pos = getMousePos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        // Mouse/Touch hareket
        function draw(e) {
            if (!isDrawing) return;
            
            e.preventDefault();
            const pos = getMousePos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        // Mouse/Touch bitirme
        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            ctx.closePath();
            letterCount++;
            score += 10;
            updateScore();
        }

        // Pozisyon hesapla (mouse ve touch)
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            let x, y;

            if (e.touches) {
                // Touch event
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            } else {
                // Mouse event
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }

            return { x, y };
        }

        // Event listeners
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // Touch events
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        // Skorları güncelle
        function updateScore() {
            document.getElementById('letterCount').textContent = letterCount;
            document.getElementById('score').textContent = score;
        }

        // Canvas'ı temizle
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
        }

        // Çizimi kaydet (PNG indir)
        function saveDrawing() {
            const link = document.createElement('a');
            link.download = `harf-${new Date().getTime()}.png`;
            link.href = canvas.toDataURL();
            link.click();
            alert(`✅ Çizim kaydedildi!\n📊 Puan: ${score}`);
        }

        // Başlat
        drawGrid();
    </script>
</body>
</html>
