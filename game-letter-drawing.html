<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfabeyi Öğren - İlkokulOyun.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Fredoka', 'Arial', sans-serif;
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 720px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 30px;
            font-weight: 700;
            background: linear-gradient(135deg, #11998e, #185a9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .header p {
            color: #9E9E9E;
            font-size: 15px;
            font-weight: 500;
        }

        /* İLERLEME */
        .progress-section {
            margin-bottom: 14px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 14px;
            background: #ECEFF1;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #43cea2, #11998e);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 10px;
        }

        /* HARF KARTI */
        .letter-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: linear-gradient(135deg, #e0f7f4 0%, #e8f5f9 100%);
            border-radius: 16px;
            padding: 12px 18px;
            margin-bottom: 14px;
            border: 2px solid #b2dfdb;
        }

        .letter-type {
            font-size: 14px;
            font-weight: 600;
            color: #00897b;
        }

        .letter-big {
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
        }

        .letter-big.upper { color: #11998e; }
        .letter-big.lower { color: #e91e63; }

        .speak-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #43cea2, #11998e);
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(17, 153, 142, 0.3);
        }

        .speak-btn:hover { transform: scale(1.1); }
        .speak-btn:active { transform: scale(0.95); }

        .message {
            text-align: center;
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 12px;
            min-height: 28px;
            transition: all 0.3s ease;
        }

        .message.success {
            color: #2ecc71;
            animation: pop 0.4s ease;
        }

        .message.fail {
            color: #ff7043;
            animation: shake 0.4s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .game-area {
            position: relative;
            background: white;
            border-radius: 20px;
            width: 100%;
            height: 380px;
            margin-bottom: 16px;
            overflow: hidden;
            touch-action: none;
            box-shadow: inset 0 2px 12px rgba(0,0,0,0.06);
            border: 3px solid #E0F2F1;
        }

        #canvas {
            display: block;
            cursor: crosshair;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        /* DOLDURMA GÖSTERGESİ */
        .fill-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .fill-label {
            font-size: 13px;
            font-weight: 600;
            color: #999;
            flex-shrink: 0;
        }

        .fill-bar {
            flex: 1;
            height: 16px;
            background: #ECEFF1;
            border-radius: 10px;
            overflow: hidden;
        }

        .fill-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd54f, #43cea2);
            width: 0%;
            transition: width 0.15s ease;
            border-radius: 10px;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat {
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f2f8 100%);
            border-radius: 14px;
            padding: 10px 22px;
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: #999;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #11998e;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .btn:active { transform: scale(0.96); }

        .btn-reset {
            background: #F1F3F5;
            color: #555;
        }

        .btn-reset:hover { background: #E4E7EB; }

        .btn-next {
            background: linear-gradient(135deg, #43cea2, #11998e);
            color: white;
            box-shadow: 0 4px 14px rgba(17, 153, 142, 0.35);
        }

        .btn-next:hover {
            box-shadow: 0 6px 18px rgba(17, 153, 142, 0.5);
            transform: translateY(-2px);
        }

        .back-btn {
            width: 100%;
            padding: 13px;
            background: transparent;
            color: #999;
            border: 2px solid #E0E0E0;
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            border-color: #11998e;
            color: #11998e;
        }

        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            top: -20px;
            z-index: 999;
            animation: fall linear forwards;
            border-radius: 3px;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0.3;
            }
        }

        @media (max-width: 600px) {
            .container { padding: 16px; }
            .game-area { height: 300px; }
            .header h1 { font-size: 24px; }
            .letter-big { font-size: 34px; }
        }
    </style>
  <script defer src="analytics.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📖 Alfabeyi Öğren</h1>
            <p>Harfin üzerinden parmağınla geç</p>
        </div>

        <div class="progress-section">
            <div class="progress-text">
                <span id="progressLabel">0 harf tamamlandı</span>
                <span id="progressCount">1 / 58</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="letter-card">
            <span class="letter-type" id="letterType">📘 Büyük Harf</span>
            <span class="letter-big upper" id="letterBig">A</span>
            <button class="speak-btn" onclick="speakLetter()" title="Sesli dinle">🔊</button>
        </div>

        <div class="message" id="message"></div>

        <div class="game-area" id="gameArea">
            <canvas id="canvas"></canvas>
        </div>

        <div class="fill-indicator">
            <span class="fill-label">Boyama:</span>
            <div class="fill-bar">
                <div class="fill-fill" id="fillFill"></div>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-label">PUAN</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">TAMAMLANAN</div>
                <div class="stat-value" id="done">0</div>
            </div>
        </div>

        <div class="buttons">
            <button class="btn btn-reset" onclick="resetLetter()">🔄 Yeniden Dene</button>
            <button class="btn btn-next" onclick="skipLetter()">⏭️ Atla</button>
        </div>

        <button class="back-btn" onclick="history.back()">← Geri Dön</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const gameArea = document.getElementById('gameArea');
        const messageEl = document.getElementById('message');

        // Türkçe alfabesi (29 harf)
        const alphabet = ['A', 'B', 'C', 'Ç', 'D', 'E', 'F', 'G', 'Ğ', 'H', 
                         'I', 'İ', 'J', 'K', 'L', 'M', 'N', 'O', 'Ö', 'P', 
                         'R', 'S', 'Ş', 'T', 'U', 'Ü', 'V', 'Y', 'Z'];

        // 58 adım: A, a, B, b, ...
        const steps = [];
        alphabet.forEach(letter => {
            steps.push({ letter, isUpper: true });
            steps.push({ letter, isUpper: false });
        });

        let currentStep = 0;
        let score = 0;
        let lettersDone = 0;
        let isDrawing = false;
        let completed = false;

        // Doğruluk sistemi: harf hücreleri gerçek olarak hesaplanır
        const GRID = 8;              // hücre boyutu (px)
        const THRESHOLD = 55;        // tamamlanma yüzdesi
        let letterCells = new Set(); // harfin kapladığı hücreler
        let coveredCells = new Set();// boyanan harf hücreleri

        function resizeCanvas() {
            const rect = gameArea.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            drawLetter();
        }

        window.addEventListener('resize', resizeCanvas);

        function drawLetter() {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            coveredCells.clear();
            completed = false;

            const step = steps[currentStep];
            const displayLetter = step.isUpper ? step.letter : step.letter.toLowerCase();
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            const fontSize = step.isUpper ? 230 : 190;
            const fillColor = step.isUpper ? '#B2DFDB' : '#F8BBD0';
            const lineColor = step.isUpper ? '#11998e' : '#e91e63';

            ctx.font = `700 ${fontSize}px Fredoka, Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.fillStyle = fillColor;
            ctx.fillText(displayLetter, centerX, centerY);
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 5;
            ctx.strokeText(displayLetter, centerX, centerY);

            // Harf hücrelerini gerçek piksellerden hesapla
            computeLetterCells(fillColor, lineColor);

            updateDisplay();
            updateFillBar(0);
        }

        // Harfin kapladığı hücreleri tara (beyaz olmayan pikseller)
        function computeLetterCells() {
            letterCells.clear();
            const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = img.data;
            for (let y = 0; y < canvas.height; y += 3) {
                for (let x = 0; x < canvas.width; x += 3) {
                    const i = (y * canvas.width + x) * 4;
                    // Beyaz değilse harf pikseli
                    if (d[i] < 245 || d[i + 1] < 245 || d[i + 2] < 245) {
                        letterCells.add(Math.floor(x / GRID) + ',' + Math.floor(y / GRID));
                    }
                }
            }
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches) {
                return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                };
            }
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        canvas.addEventListener('touchend', stopDrawing);

        function startDrawing(e) {
            e.preventDefault();
            if (completed) return;
            isDrawing = true;
            messageEl.textContent = '';
        }

        function draw(e) {
            if (!isDrawing || completed) return;
            e.preventDefault();

            const pos = getPos(e);
            const gx = Math.floor(pos.x / GRID);
            const gy = Math.floor(pos.y / GRID);

            // Parmak çevresindeki hücreleri kontrol et (±1 hücre tolerans)
            for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -1; dy <= 1; dy++) {
                    const key = (gx + dx) + ',' + (gy + dy);
                    if (letterCells.has(key)) {
                        coveredCells.add(key);
                    }
                }
            }

            // Boyama izi
            ctx.fillStyle = 'rgba(255, 152, 0, 0.45)';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 12, 0, Math.PI * 2);
            ctx.fill();

            const coverage = getCoverage();
            updateFillBar(coverage);

            if (coverage >= THRESHOLD) {
                completeLetter(coverage);
            }
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function getCoverage() {
            if (letterCells.size === 0) return 0;
            return Math.round((coveredCells.size / letterCells.size) * 100);
        }

        function updateFillBar(coverage) {
            // Doldurma çubuğu: eşiğe göre ölçekle (eşik = %100 dolu görünür)
            const visual = Math.min(100, Math.round((coverage / THRESHOLD) * 100));
            document.getElementById('fillFill').style.width = visual + '%';
        }

        function completeLetter(coverage) {
            completed = true;
            isDrawing = false;

            const step = steps[currentStep];
            const displayLetter = step.isUpper ? step.letter : step.letter.toLowerCase();

            score += 50 + coverage;
            lettersDone++;
            document.getElementById('score').textContent = score;
            document.getElementById('done').textContent = lettersDone;

            showMessage('🌟 "' + displayLetter + '" tamamlandı!', 'success');
            if(window.IO) IO.asamaTamam(displayLetter, currentStep+1);
            launchConfetti(12);

            setTimeout(nextLetter, 1100);
        }

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
        }

        function speakLetter() {
            if (!('speechSynthesis' in window)) return;
            const step = steps[currentStep];
            const text = step.isUpper
                ? 'Büyük ' + step.letter
                : 'Küçük ' + step.letter.toLowerCase();
            speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'tr-TR';
            utter.rate = 0.85;
            speechSynthesis.speak(utter);
        }

        function updateDisplay() {
            const step = steps[currentStep];
            const displayLetter = step.isUpper ? step.letter : step.letter.toLowerCase();

            const big = document.getElementById('letterBig');
            big.textContent = displayLetter;
            big.className = 'letter-big ' + (step.isUpper ? 'upper' : 'lower');
            document.getElementById('letterType').textContent = step.isUpper ? '📘 Büyük Harf' : '📗 Küçük Harf';
            document.getElementById('progressCount').textContent = (currentStep + 1) + ' / ' + steps.length;
            document.getElementById('progressLabel').textContent = lettersDone + ' harf tamamlandı';
            document.getElementById('progressFill').style.width = ((currentStep / steps.length) * 100) + '%';
        }

        function nextLetter() {
            if (currentStep < steps.length - 1) {
                currentStep++;
                if(window.IO) IO.asama(steps[currentStep].letter, currentStep+1);
                messageEl.textContent = '';
                drawLetter();
                speakLetter();
            } else {
                launchConfetti(40);
                setTimeout(() => {
                    if(window.IO) IO.oyunBitti(score);
                    alert('🎉 TEBRİKLER!\n\nTüm alfabeyi tamamladın!\n\nToplam Puan: ' + score + ' 🏆');
                    location.reload();
                }, 500);
            }
        }

        function resetLetter() {
            messageEl.textContent = '';
            drawLetter();
        }

        function skipLetter() {
            // Atlanan harf tamamlanmış sayılmaz, puan verilmez
            messageEl.textContent = '';
            nextLetter();
        }

        function launchConfetti(count) {
            const colors = ['#43cea2', '#11998e', '#e91e63', '#FFD54F', '#4FC3F7'];
            for (let i = 0; i < count; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.animationDuration = (1.2 + Math.random() * 1.3) + 's';
                c.style.animationDelay = Math.random() * 0.3 + 's';
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 3000);
            }
        }

        // Başlat (fontun yüklenmesini bekle, sonra harfi çiz)
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(resizeCanvas);
        }
        resizeCanvas();
    </script>
</body>
</html>
