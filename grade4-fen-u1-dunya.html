function genTerim(){
  const tip=rnd(0,3);

  // TİP 1: Terimin tanımı
  if(tip===0){
    const it=pick(TERIM);
    const w=distractors(it.tanim,()=>pick(TERIM).tanim);
    return{
      text:`"${it.ad}" ne demektir?`,
      numberDisplay:it.ad,
      answer:it.tanim,
      options:shuffle([it.tanim,...w]),
      explain:`${it.ad}: ${it.tanim}.\n${it.ornek}\n\n💡 Terimleri öğrenirken tanımını ve bir örneğini birlikte aklında tut.`
    };
  }

  // TİP 2: Tanımdan terimi bul
  if(tip===1){
    const it=pick(TERIM);
    const w=distractors(it.ad,()=>pick(TERIM).ad);
    return{
      text:'Aşağıda tanımı verilen terim hangisidir?',
      readDisplay:it.tanim,
      answer:it.ad,
      options:shuffle([it.ad,...w]),
      explain:`${it.ad}: ${it.tanim}.\n${it.ornek}`
    };
  }

  // TİP 3: Boşluk doldurma
  if(tip===2){
    const it=pick(BOSLUK);
    const havuz=BOSLUK.filter(x=>x.d!==it.d).map(x=>x.d);
    const w=distractors(it.d,()=>pick(havuz));
    return{
      text:'Aşağıdaki cümlede boş bırakılan yere hangisi gelmelidir?',
      readDisplay:it.c,
      answer:it.d,
      options:shuffle([it.d,...w]),
      explain:`Doğru cümle:\n${it.c.replace('______',it.d.toUpperCase())}\n\n💡 Boşluk doldururken cümleyi her şıkla tek tek okuyup dene.`
    };
  }

  // TİP 4: Çift boşluk (I ve II)
  const it=pick(CIFT);
  const fmt2=a=>'I → '+a[0]+'  |  II → '+a[1];
  return{
    text:'Aşağıdaki cümlelerde I ve II ile gösterilen yerlere hangileri gelmelidir?',
    readDisplay:it.c,
    answer:fmt2(it.d),
    options:shuffle([fmt2(it.d),...it.y.map(fmt2)]),
    explain:`Doğru eşleşme:\nI → ${it.d[0]}\nII → ${it.d[1]}\n\n💡 Bu soru tipinde önce EMİN olduğun boşluğu bul, o boşluğa uymayan şıkları ele. Kalan şıklar arasından ikinciyi seç.`
  };
}

function drawGolge(vakit){
  const{c,ctx,W,H}=newCanvas(1,.6,400);
  const zemin=H-34;
  // gökyüzü
  ctx.fillStyle='#E3F2FD';ctx.fillRect(0,0,W,zemin);
  ctx.fillStyle='#C8E6C9';ctx.fillRect(0,zemin,W,H-zemin);

  // Güneş konumu: sabah solda alçak, öğle tepede, akşam sağda alçak
  const pos={sabah:{x:W*0.16,y:zemin-60},ogle:{x:W*0.5,y:44},aksam:{x:W*0.84,y:zemin-60}}[vakit];
  ctx.fillStyle='#FDD835';ctx.beginPath();ctx.arc(pos.x,pos.y,22,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#F9A825';ctx.lineWidth=2.5;
  for(let i=0;i<8;i++){const a=i*Math.PI/4;
    ctx.beginPath();
    ctx.moveTo(pos.x+Math.cos(a)*27,pos.y+Math.sin(a)*27);
    ctx.lineTo(pos.x+Math.cos(a)*35,pos.y+Math.sin(a)*35);ctx.stroke();}

  // Çubuk (cisim)
  const cx=W*0.5, boy=78;
  ctx.strokeStyle='#5D4037';ctx.lineWidth=9;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx,zemin);ctx.lineTo(cx,zemin-boy);ctx.stroke();

  // Gölge: Güneş'in ters yönünde, yüksekliğe göre uzunluk
  const dx=cx-pos.x, dy=zemin-pos.y;
  const uzunluk=boy*(dx===0?0.22:Math.abs(dx)/dy)*1.15;
  const yon=dx===0?1:Math.sign(dx);
  ctx.strokeStyle='rgba(70,70,70,.55)';ctx.lineWidth=13;
  ctx.beginPath();ctx.moveTo(cx,zemin);ctx.lineTo(cx+yon*uzunluk,zemin);ctx.stroke();

  ctx.fillStyle='#37474F';ctx.font='700 13px Fredoka,Arial';ctx.textAlign='center';
  ctx.fillText({sabah:'SABAH',ogle:'ÖĞLE',aksam:'AKŞAM'}[vakit],W/2,H-10);
  return c;
}

const FOSIL_SIRA=[

];
function genFosil(){
  if(rnd(0,3)===0){
    // Fosilleşme aşamalarını sırala
    const dogru=FOSIL_SIRA.map((x,i)=>(i+1)+'. '+x).join('\n');
    const opts=new Set([FOSIL_SIRA.join(' → ')]);
    let g=0;
    while(opts.size<4&&g++<60) opts.add(shuffle([...FOSIL_SIRA]).join(' → '));
    return{
      text:'Fosilleşmenin aşamaları karışık olarak verilmiştir.\n\nDoğru sıralama hangisidir?',
      answer:FOSIL_SIRA.join(' → '),
      options:shuffle([...opts]),
      explain:`Doğru sıra:\n${dogru}\n\n💡 Önce gömülme, sonra üzerinin örtülmesi, sonra taşlaşma, en son yeryüzüne çıkma.`
    };
  }
  const it=pick(FOSIL_S);
  return{text:it.s,answer:it.c,options:shuffle([it.c,...it.y]),
    explain:`${it.e}\n\n💡 Fosil bilimi = PALEONTOLOJİ (arkeoloji değil!)`};

   {t:'Üzerinde yaşadığımız katmandır.',d:true,n:'Kara ve denizler yer kabuğu üzerindedir.'}
 ]}
];
const ROMAN=['I','II','III','IV'];
function genCoklu(){
  const it=pick(COKLU);
  const secim=shuffle([...it.bilgiler]).slice(0,3);
  const dogruIdx=secim.map((b,i)=>b.d?ROMAN[i]:null).filter(Boolean);
  const cevap=dogruIdx.length===0?'Hiçbiri':
              dogruIdx.length===3?'I, II ve III':
              dogruIdx.length===1?'Yalnız '+dogruIdx[0]:
              dogruIdx.join(' ve ');
  const tumSecenekler=['Yalnız I','Yalnız II','Yalnız III','I ve II','I ve III','II ve III','I, II ve III','Hiçbiri'];
  const w=shuffle(tumSecenekler.filter(x=>x!==cevap)).slice(0,3);
  return{
    text:`${it.konu} ile ilgili bazı bilgiler verilmiştir.\n\nVerilen bilgilerden hangileri DOĞRUDUR?`,
    readDisplay:secim.map((b,i)=>ROMAN[i]+'. '+b.t).join('\n'),
    answer:cevap,
    options:shuffle([cevap,...w]),
    explain:secim.map((b,i)=>`${ROMAN[i]}. ${b.d?'✓ DOĞRU':'✗ YANLIŞ'} — ${b.n}`).join('\n')+
      `\n\nCevap: ${cevap}\n\n💡 Bu soru tipinde her bilgiyi TEK TEK değerlendir, sonra doğru olanları birleştir.`
  };
}
