 {c:'Kışın havalar iyice soğudu.',w:'soğudu',m:false,g:'Isı düştü',x:'Burada "soğumak" gerçek anlamıyla kullanılmış.'},
 {c:'Onun eli açıktır, herkese yardım eder.',w:'eli açık',m:true, g:'Avucu açılmış',x:'Burada cömert olmak anlatılıyor.'},
 {c:'Pencereyi açık bıraktım, hava girsin.',w:'açık',m:false,g:'Kapalı olmayan',x:'Burada "açık" gerçek anlamıyla kullanılmış.'},
 {c:'Sözlerim boşa gitti, kimse dinlemedi.',w:'boşa',m:true, g:'İçi dolu olmayan',x:'Burada işe yaramamak anlatılıyor.'},

const cap=s=>s.charAt(0).toLocaleUpperCase('tr-TR')+s.slice(1);

// ===== AŞAMA 1: EŞ ANLAMLI =====
function genEs(){
  const [a,b]=pick(ES);
  const askFirst=rnd(0,1)===0;
  const soru=askFirst?a:b, cevap=askFirst?b:a;
  const pool=ES.flat().filter(w=>w!==a&&w!==b);
  const w=distractors(cevap,()=>pick(pool));
  return{
    text:`"${cap(soru)}" kelimesinin EŞ ANLAMLISI aşağıdakilerden hangisidir?`,
    numberDisplay:cap(soru),
    answer:cevap,
    options:shuffle([cevap,...w]),
    explain:`"${cap(soru)}" ve "${cevap}" aynı anlama gelir.\n\n💡 Eş anlamlı kelimeler yazılışları farklı, anlamları aynıdır.\nBiri yerine diğeri kullanılabilir: "${cap(soru)} geldi." = "${cap(cevap)} geldi."`
  };
}

// ===== AŞAMA 2: ZIT ANLAMLI =====
function genZit(){
  const [a,b]=pick(ZIT);
  const askFirst=rnd(0,1)===0;
  const soru=askFirst?a:b, cevap=askFirst?b:a;
  const pool=ZIT.flat().filter(w=>w!==a&&w!==b);
  const w=distractors(cevap,()=>pick(pool));
  return{
    text:`"${cap(soru)}" kelimesinin ZIT ANLAMLISI aşağıdakilerden hangisidir?`,
    numberDisplay:cap(soru),
    answer:cevap,
    options:shuffle([cevap,...w]),
    explain:`"${cap(soru)}" kelimesinin karşıtı "${cevap}"dır.\n\n💡 Zıt anlamlı kelimeler birbirinin tam tersini anlatır.\nBiri varsa diğeri olamaz: bir şey hem ${a} hem ${b} olamaz.`
  };
}

// ===== AŞAMA 3: EŞ SESLİ (SESTEŞ) =====
function genSestes(){
  const item=pick(SESTES);
  const kind=rnd(0,1);
  if(kind===0){
    // Verilen anlamlardan hangisi bu kelimeye ait DEĞİL? -> basitleştir: kelimeyi bul
    const w=distractors(item.k,()=>pick(SESTES).k);
    const iki=item.a.slice(0,2);
    return{
      text:'Aşağıdaki iki anlama da gelen EŞ SESLİ kelime hangisidir?',
      readDisplay:'1) '+iki[0]+'\n2) '+iki[1],
      answer:item.k,
      options:shuffle([item.k,...w]),
      explain:`"${cap(item.k)}" kelimesi yazılışı ve okunuşu aynı, anlamları farklı bir kelimedir:\n• ${iki[0]}\n• ${iki[1]}\n\n💡 Eş sesli (sesteş) kelimeler aynı yazılır ama cümledeki anlamları farklıdır.`
    };
  }
  // Doğru anlam eşleştirme
  const dogru=pick(item.a);
  const digerler=SESTES.filter(s=>s.k!==item.k).flatMap(s=>s.a);
  const w=distractors(dogru,()=>pick(digerler));
  return{
    text:`"${cap(item.k)}" kelimesinin anlamlarından biri aşağıdakilerden hangisidir?`,
    numberDisplay:cap(item.k),
    answer:dogru,
    options:shuffle([dogru,...w]),
    explain:`"${cap(item.k)}" eş sesli bir kelimedir. Anlamları:\n`+item.a.map(a=>'• '+a).join('\n')+`\n\n💡 Hangi anlamda kullanıldığını CÜMLEDEN anlarız.`
  };
}

// ===== AŞAMA 4: GERÇEK VE MECAZ ANLAM =====
function genMecaz(){
  const item=pick(MECAZ);
  const ans=item.m?'Mecaz anlam':'Gerçek anlam';
  return{
    text:`Aşağıdaki cümlede altı çizili kelime hangi anlamda kullanılmıştır?`,
    readDisplay:item.c.replace(item.w,'⟨'+item.w+'⟩'),
    answer:ans,
    options:shuffle(['Gerçek anlam','Mecaz anlam']),
    explain:`${item.x}\n\nKelimenin gerçek anlamı: ${item.g}\n\n💡 GERÇEK anlam: kelimenin sözlükteki ilk, bilinen anlamı.\n💡 MECAZ anlam: benzetme yoluyla kazandığı yeni anlam.`
  };
}

// ===== AŞAMA 5: KELİME IZGARASI (GÖRSEL) =====
function genGrid(){
  const rows=4, cols=3;
  const tip=rnd(0,1)===0?'es':'zit';
  const kaynak=tip==='es'?ES:ZIT;
  const etiket=tip==='es'?'EŞ ANLAMLI':'ZIT ANLAMLI';

  // Her satırda 1 doğru çift + 2 rastgele (ilişkisiz) çift
  const grid=[], dogruSutun=[];
  const kullanilan=new Set();
  for(let r=0;r<rows;r++){
    const hedef=[];
    let ok; do{ ok=pick(kaynak); }while(kullanilan.has(ok[0]));
    kullanilan.add(ok[0]);
    const dogruIdx=rnd(0,cols-1);
    dogruSutun.push(dogruIdx);
    for(let c=0;c<cols;c++){
      if(c===dogruIdx){ hedef.push(ok[0]+' - '+ok[1]); }
      else{
        // ilişkisiz çift: iki farklı çiftten birer kelime
        let p1,p2,g=0;
        do{ p1=pick(kaynak); p2=pick(kaynak); }while(p1===p2&&g++<30);
        hedef.push(p1[0]+' - '+p2[1]);
      }
    }
    grid.push(hedef);
  }

  // Şıklar: desen dizileri (görsel)
  const key=dogruSutun.join('');
  const wrongKeys=distractors(key,()=>Array.from({length:rows},()=>rnd(0,cols-1)).join(''));

  return{
    text:`Zeynep bir kelime oyunu oynuyor. Her satırda ${etiket} sözcüklerin bulunduğu kutuya basarak ilerliyor.\n\nDoğru kutulara bastığında hangi desen oluşur?`,
    visual:()=>drawWordGrid(grid,rows,cols),
    answer:key,
    options:shuffle([key,...wrongKeys]),
    optionVisuals:(k)=>drawPattern(k,rows,cols),
    explain:'Doğru '+etiket.toLowerCase()+' çiftler:\n'+
      dogruSutun.map((c,r)=>`${r+1}. satır → ${c+1}. kutu: ${grid[r][c]}`).join('\n')+
      '\n\n💡 Her satırda önce doğru çifti bul, sonra kaçıncı kutuda olduğunu işaretle.'
  };
}

function drawWordGrid(grid,rows,cols){
  const{c,ctx,W,H}=newCanvas(1,.62,440);
  const cw=(W-16)/cols, ch=(H-16)/rows;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let r=0;r<rows;r++)for(let i=0;i<cols;i++){
    const x=8+i*cw, y=8+r*ch;
    ctx.fillStyle=(r+i)%2===0?'#FFE0B2':'#FFCC80';
    ctx.fillRect(x,y,cw-3,ch-3);
    ctx.strokeStyle='#E65100';ctx.lineWidth=1.6;
    ctx.strokeRect(x,y,cw-3,ch-3);
    ctx.fillStyle='#5D4037';
    ctx.font='600 '+Math.max(9,Math.min(12,cw/9))+'px Fredoka,Arial';
    ctx.fillText(grid[r][i],x+(cw-3)/2,y+(ch-3)/2);
  }
  // satır okları
  ctx.fillStyle='#E65100';ctx.font='700 10px Fredoka,Arial';ctx.textAlign='left';
  for(let r=0;r<rows;r++) ctx.fillText('▶',1,8+r*ch+ch/2);
  return c;
}

function drawPattern(key,rows,cols){
  const c=document.createElement('canvas');
  const S=Math.min(84,(window.innerWidth-120)/2);
  c.width=S;c.height=S*rows/cols*0.92;
  c.style.width='100%';c.style.height='auto';
  const ctx=c.getContext('2d');
  const cw=c.width/cols, ch=c.height/rows;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  for(let r=0;r<rows;r++)for(let i=0;i<cols;i++){
    ctx.fillStyle=(+key[r]===i)?'#F9A825':'#FFE0B2';
    ctx.fillRect(i*cw,r*ch,cw-1.5,ch-1.5);
  }
  return c;
}

function genTerimAnlam(){
  const it=pick(TERIM_C);
  return{
    text:'Aşağıdaki cümlede altı çizili kelime hangi anlamda kullanılmıştır?',
    readDisplay:it.c.replace(new RegExp(it.w,'i'),'⟨'+it.w+'⟩'),
    answer:it.t+' anlam',
    options:shuffle(['Gerçek anlam','Mecaz anlam','Terim anlam']),
    explain:`${it.a}\n\n💡 GERÇEK anlam: sözlükteki ilk, bilinen anlam\n💡 MECAZ anlam: benzetme yoluyla kazanılan yeni anlam\n💡 TERİM anlam: bir bilim, sanat ya da meslek dalına ait özel anlam`
  };
}

  {name:'Terim Anlam',gen:genTerimAnlam},
