<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nerede? - 1. Sınıf Matematik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="grade1-style.css">
<script defer src="analytics.js"></script>
</head>
<body>
<div class="kutu">
  <div class="baslik">
    <h1>🧭 Nerede?</h1>
    <p>1. Tema · Uzamsal İlişkiler</p>
  </div>

  <div class="ilerleme"><div class="ilerleme-dolu" id="ilerlemeDolu"></div></div>
  <div class="yildizlar" id="yildizlar"></div>

  <div class="yonerge">
    <span class="yonerge-metin" id="yonergeMetin">Hazırlanıyor...</span>
    <button class="btn-ses" id="sesBtn" onclick="sesDegistir()" aria-label="Sesi aç kapat">🔊</button>
  </div>

  <div class="soru-gorsel" id="soruGorsel"></div>
  <div class="secenekler" id="secenekler"></div>
  <div class="geri" id="geri"></div>

  <button class="btn-devam" id="devamBtn" onclick="tekrarDinle()">🔊 Tekrar Dinle</button>
  <button class="btn-geri" onclick="history.back()">← Geri Dön</button>
</div>

<script src="grade1-engine.js"></script>
<script>
// Küçük nesneler — emoji (tek başına net görünür)
const NESNELER=[
  {n:'⚽',ad:'Top'},{n:'🐱',ad:'Kedi'},{n:'🍎',ad:'Elma'},
  {n:'🧸',ad:'Ayı'},{n:'🐦',ad:'Kuş'},{n:'🎈',ad:'Balon'},
  {n:'🐰',ad:'Tavşan'},{n:'⭐',ad:'Yıldız'}
];

// Referans nesneler CANVAS ile çizilir — emoji üst üste binince
// "içinde" ile "önünde" ayırt edilemiyordu.
const MASA={rad:'masa',nin:'masanın',e:'masaya',den:'masadan'};
const KUTU={rad:'kutu',nin:'kutunun',e:'kutuya',den:'kutudan'};

// Perspektifli zemin — derinlik hissi verir, önünde/arkasında ayrımını sağlar
function cizZemin(ctx,W,H){
  ctx.fillStyle='#F3EDE0';
  ctx.beginPath();
  ctx.moveTo(W*0.26,H*0.42); ctx.lineTo(W*0.74,H*0.42);
  ctx.lineTo(W-4,H-8);       ctx.lineTo(4,H-8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#E0D5C0'; ctx.lineWidth=2; ctx.stroke();
}
// Gölge nesnenin TAM ALTINA çizilir (emojiyle çakışmaz)
function golge(ctx,x,yMerkez,boyut){
  ctx.fillStyle='rgba(120,100,70,.13)';
  ctx.beginPath();
  ctx.ellipse(x,yMerkez+boyut*0.44,boyut*0.38,boyut*0.12,0,0,Math.PI*2);
  ctx.fill();
}

// Masa: perspektifli tabla + iki ayak
function cizMasa(ctx,mx,my,gen){
  const yari=gen/2, derin=gen*0.22, kalin=8;
  // Tabla üst yüzü (paralelkenar)
  ctx.fillStyle='#D9A05B';
  ctx.beginPath();
  ctx.moveTo(mx-yari+derin,my-derin); ctx.lineTo(mx+yari+derin,my-derin);
  ctx.lineTo(mx+yari,my);             ctx.lineTo(mx-yari,my);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#7A4B1C'; ctx.lineWidth=2; ctx.stroke();
  // Tabla ön kenarı
  ctx.fillStyle='#C68642';
  ctx.fillRect(mx-yari,my,gen,kalin);
  ctx.strokeRect(mx-yari,my,gen,kalin);
  // Ayaklar
  ctx.fillStyle='#A66A2E';
  ctx.fillRect(mx-yari+6,my+kalin,8,34);
  ctx.fillRect(mx+yari-14,my+kalin,8,34);
  ctx.strokeRect(mx-yari+6,my+kalin,8,34);
  ctx.strokeRect(mx+yari-14,my+kalin,8,34);
}

// Kutu: açık üstlü, ön duvar ayrı
function cizKutuArka(ctx,mx,my,gen){
  const yari=gen/2, yuk=gen*0.72;
  ctx.fillStyle='#E8D3B0';
  ctx.fillRect(mx-yari,my-yuk/2,gen,yuk);
  ctx.strokeStyle='#8D5524';ctx.lineWidth=3;
  ctx.strokeRect(mx-yari,my-yuk/2,gen,yuk);
}
function cizKutuOn(ctx,mx,my,gen){
  const yari=gen/2, yuk=gen*0.72;
  ctx.fillStyle='#C68642';
  ctx.fillRect(mx-yari,my+yuk/2-24,gen,24);
  ctx.strokeStyle='#8D5524';ctx.lineWidth=3;
  ctx.strokeRect(mx-yari,my+yuk/2-24,gen,24);
  ctx.beginPath();
  ctx.moveTo(mx-yari-7,my-yuk/2);ctx.lineTo(mx-yari,my-yuk/2);
  ctx.moveTo(mx+yari,my-yuk/2);ctx.lineTo(mx+yari+7,my-yuk/2);
  ctx.stroke();
}

// MASA sahnesi
const MASA_KONUM={
  'üstünde':  {ip:'Üstünde olan, masanın tam üzerine konmuştur.'},
  'altında':  {ip:'Altında olan, masanın aşağısında, ayakların arasındadır.'},
  'solunda':  {ip:'Sol taraf, bu resimde masanın sol yanıdır.'},
  'sağında':  {ip:'Sağ taraf, bu resimde masanın sağ yanıdır.'},
  'önünde':   {ip:'Önünde olan bize yakındır, masanın önünde durur ve daha büyük görünür.'},
  'arkasında':{ip:'Arkasında olan uzaktadır, masa onun bir kısmını gizler.'}
};
function cizMasaSahne(nesne,konum){
  const{c,ctx,W,H}=sahne(148,136);
  cizZemin(ctx,W,H);
  const mx=W/2, my=H*0.56, gen=76;

  if(konum==='arkasında'){
    // Uzakta: küçük, yukarıda, zeminin derin kısmında — masa onu ÖRTER
    emoji(ctx,nesne,mx+2,my-24,28);
    cizMasa(ctx,mx,my,gen);
  }else if(konum==='önünde'){
    cizMasa(ctx,mx,my,gen);
    // Yakında: EN BÜYÜK, kartın alt kenarına yakın, ayakları örter
    golge(ctx,mx-2,H-26,52);
    emoji(ctx,nesne,mx-2,H-26,52);
  }else if(konum==='altında'){
    cizMasa(ctx,mx,my,gen);
    // Tablanın hemen ALTINDA, iki ayağın arasında, küçük
    emoji(ctx,nesne,mx,my+24,26);
  }else if(konum==='üstünde'){
    cizMasa(ctx,mx,my,gen);
    // Tablaya TEMAS ederek üstünde
    emoji(ctx,nesne,mx+5,my-25,34);
  }else{
    cizMasa(ctx,mx,my,gen);
    const x=konum==='solunda'?mx-56:mx+56;
    golge(ctx,x,my+20,34);
    emoji(ctx,nesne,x,my+20,34);
  }
  return c;
}

// KUTU sahnesi: içinde, dışında
const KUTU_KONUM={
  'içinde': {ip:'İçinde olan, kutunun içine girmiştir.'},
  'dışında':{ip:'Dışında olan, kutunun dışında kalmıştır.'}
};
function cizKutuSahne(nesne,konum){
  const{c,ctx,W,H}=sahne(148,136);
  cizZemin(ctx,W,H);
  const mx=W/2-8, my=H*0.54, gen=72;

  cizKutuArka(ctx,mx,my,gen);
  if(konum==='içinde'){
    emoji(ctx,nesne,mx,my-2,36);         // kutunun içinde
    cizKutuOn(ctx,mx,my,gen);            // ön duvar nesnenin ÖNÜNE gelir
  }else{
    cizKutuOn(ctx,mx,my,gen);
    golge(ctx,mx+58,my+24,34);
    emoji(ctx,nesne,mx+58,my+24,34);     // kutunun dışında, yanda
  }
  return c;
}

const TUM_KONUM={...MASA_KONUM,...KUTU_KONUM};
const masaKonumu=k=>k in MASA_KONUM;
function cizSahne(nesne,konum){
  return masaKonumu(konum)?cizMasaSahne(nesne,konum):cizKutuSahne(nesne,konum);
}
const referans=k=>masaKonumu(k)?MASA:KUTU;

// ETKİNLİK 1: Konum kavramı — doğru resmi bul
function etkKonum(){
  const nesne=pick(NESNELER);
  const masaMi=rnd(0,3)>0;                       // çoğunlukla masa, bazen kutu
  const havuz=Object.keys(masaMi?MASA_KONUM:KUTU_KONUM);
  const dogru=pick(havuz);
  const ref=referans(dogru);
  // Seçenekler aynı sahne tipinden olmalı ki karşılaştırılabilsin
  const digerler=shuffle(havuz.filter(x=>x!==dogru)).slice(0,masaMi?2:1);
  return{
    yonerge:`${nesne.ad} ${ref.nin} ${dogru}. Doğru resmi bul.`,
    secenek:[dogru,...digerler], dogru,
    ciz:s=>cizSahne(nesne.n,s),
    ipucu:TUM_KONUM[dogru].ip
  };
}

// ETKİNLİK 2: Resme bak, konumu söyle
function etkTers(){
  const nesne=pick(NESNELER);
  const masaMi=rnd(0,3)>0;
  const havuz=Object.keys(masaMi?MASA_KONUM:KUTU_KONUM);
  const dogru=pick(havuz);
  const ref=referans(dogru);
  const digerler=shuffle(havuz.filter(x=>x!==dogru)).slice(0,masaMi?2:1);
  const buyuk=cizSahne(nesne.n,dogru);
  buyuk.style.width='200px'; buyuk.style.height='180px';
  return{
    yonerge:`${nesne.ad} nerede? Resme bak ve doğru sözcüğü seç.`,
    secenek:[dogru,...digerler], dogru,
    ustGorsel:buyuk,
    ciz:s=>{
      const{c,ctx,W,H}=sahne(148,96);
      ctx.fillStyle='#4E4E4E';
      ctx.font='600 21px Fredoka,Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(s,W/2,H/2);
      return c;
    },
    ipucu:TUM_KONUM[dogru].ip
  };
}

// ETKİNLİK 3: Yakın - uzak
function etkYakinUzak(){
  const nesne=pick(NESNELER);
  const soru=pick(['yakın','uzak']);
  function ciz(s){
    const{c,ctx,W,H}=sahne(148,136);
    cizZemin(ctx,W,H);
    const my=H*0.58;
    cizMasa(ctx,40,my,50);
    const x=s==='yakın'?82:132;
    golge(ctx,x,my+22,34);
    emoji(ctx,nesne.n,x,my+22,34);
    return c;
  }
  return{
    yonerge:`${nesne.ad} ${soru==='yakın'?MASA.e:MASA.den} ${soru}. Doğru resmi bul.`,
    secenek:['yakın','uzak'], dogru:soru, ciz,
    ipucu:soru==='yakın'?'Yakın olan, hemen yanı başındadır.':'Uzak olan, aralarında çok mesafe vardır.'
  };
}

// ETKİNLİK 4: Arasında
function etkArasinda(){
  const nesne=pick(NESNELER);
  function ciz(s){
    const{c,ctx,W,H}=sahne(148,136);
    cizZemin(ctx,W,H);
    const my=H*0.58;
    [28,74,120].forEach((x,i)=>{
      if(i===+s){ golge(ctx,x,my+20,34); emoji(ctx,nesne.n,x,my+20,34); }
      else cizMasa(ctx,x,my,38);
    });
    return c;
  }
  return{
    yonerge:`${nesne.ad} iki ${MASA.nin} arasında. Doğru resmi bul.`,
    secenek:['0','1','2'], dogru:'1', ciz,
    ipucu:'Arasında olan tam ortadadır, iki yanında birer masa vardır.'
  };
}

initEtkinlik([etkKonum,etkTers,etkYakinUzak,etkArasinda],
  {ad:'Uzamsal İlişkiler',c1:'#a8edea',c2:'#fed6e3',koyu:'#00796B',orta:'#4DB6AC',acik:'#E0F2F1'});
</script>
