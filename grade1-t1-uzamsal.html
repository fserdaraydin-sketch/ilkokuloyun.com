</div>

<script src="grade1-engine.js"></script>
<script>
// Küçük nesneler — emoji (tek başına net görünür)
const NESNELER=[
  {n:'⚽',ad:'Top'},{n:'🐱',ad:'Kedi'},{n:'🍎',ad:'Elma'},
  {n:'🧸',ad:'Ayı'},{n:'🐦',ad:'Kuş'},{n:'🎈',ad:'Balon'},
  {n:'🐰',ad:'Tavşan'},{n:'🐟',ad:'Balık'}
];

// Referans nesneler CANVAS ile çizilir — emoji üst üste binince
// "içinde" ile "önünde" ayırt edilemiyordu.
const MASA={rad:'masa',nin:'masanın',e:'masaya',den:'masadan'};
const KUTU={rad:'kutu',nin:'kutunun',e:'kutuya',den:'kutudan'};

// ===== HACİMLİ (İZOMETRİK) ÇİZİM =====
// Emoji yığını yerine hacimli kaplar: içi görünen kutu, cam fanus,
// izometrik masa. Böylece "içinde" gerçekten içeride görünüyor.

function cizZemin(ctx,W,H){
  ctx.fillStyle='#F4EEE2';
  ctx.beginPath();
  ctx.moveTo(W*0.22,H*0.40); ctx.lineTo(W*0.78,H*0.40);
  ctx.lineTo(W-3,H-6);       ctx.lineTo(3,H-6);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#E3D8C4'; ctx.lineWidth=2; ctx.stroke();
}
function golge(ctx,x,yMerkez,boyut){
  ctx.save();
  ctx.fillStyle='rgba(120,100,70,.14)';
  ctx.beginPath();
  ctx.ellipse(x,yMerkez+boyut*0.44,boyut*0.40,boyut*0.13,0,0,Math.PI*2);
  ctx.fill(); ctx.restore();
}

// ---- İZOMETRİK MASA ----
function cizMasa(ctx,mx,my,gen){
  const y2=gen/2, d=gen*0.26, kal=8;
  // Üst yüz
  ctx.fillStyle='#E0AC69';
  ctx.beginPath();
  ctx.moveTo(mx-y2+d,my-d); ctx.lineTo(mx+y2+d,my-d);
  ctx.lineTo(mx+y2,my);     ctx.lineTo(mx-y2,my);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#7A4B1C'; ctx.lineWidth=2; ctx.stroke();
  // Ön kalınlık
  ctx.fillStyle='#C68642';
  ctx.fillRect(mx-y2,my,gen,kal); ctx.strokeRect(mx-y2,my,gen,kal);
  // Sağ yan kalınlık
  ctx.fillStyle='#A86A30';
  ctx.beginPath();
  ctx.moveTo(mx+y2,my); ctx.lineTo(mx+y2+d,my-d);
  ctx.lineTo(mx+y2+d,my-d+kal); ctx.lineTo(mx+y2,my+kal);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // Ayaklar (ön iki + arka bir)
  ctx.fillStyle='#8D5524';
  ctx.fillRect(mx-y2+5,my+kal,8,32);  ctx.strokeRect(mx-y2+5,my+kal,8,32);
  ctx.fillRect(mx+y2-13,my+kal,8,32); ctx.strokeRect(mx+y2-13,my+kal,8,32);
  ctx.fillStyle='#7A4B1C';
  ctx.fillRect(mx+y2+d-11,my-d+kal,6,26); ctx.strokeRect(mx+y2+d-11,my-d+kal,6,26);
}

// ---- AĞZI AÇIK KUTU (içi görünür) ----
function cizKutuIc(ctx,mx,my,gen){
  const y2=gen/2, d=gen*0.30, yuk=gen*0.62;
  // Arka iç duvar
  ctx.fillStyle='#D9C4A0';
  ctx.beginPath();
  ctx.moveTo(mx-y2+d,my-yuk/2-d); ctx.lineTo(mx+y2+d,my-yuk/2-d);
  ctx.lineTo(mx+y2+d,my+yuk/2-d); ctx.lineTo(mx-y2+d,my+yuk/2-d);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#8D5524'; ctx.lineWidth=2; ctx.stroke();
  // İç taban
  ctx.fillStyle='#C9B38C';
  ctx.beginPath();
  ctx.moveTo(mx-y2,my+yuk/2);       ctx.lineTo(mx+y2,my+yuk/2);
  ctx.lineTo(mx+y2+d,my+yuk/2-d);   ctx.lineTo(mx-y2+d,my+yuk/2-d);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // Sol iç duvar
  ctx.fillStyle='#CDB694';
  ctx.beginPath();
  ctx.moveTo(mx-y2,my-yuk/2);     ctx.lineTo(mx-y2+d,my-yuk/2-d);
  ctx.lineTo(mx-y2+d,my+yuk/2-d); ctx.lineTo(mx-y2,my+yuk/2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
}
function cizKutuOnDuvar(ctx,mx,my,gen){
  const y2=gen/2, d=gen*0.30, yuk=gen*0.62;
  // Ön duvar — içerideki nesnenin ÖNÜNE gelir
  ctx.fillStyle='#C68642';
  ctx.beginPath();
  ctx.moveTo(mx-y2,my+yuk/2-26); ctx.lineTo(mx+y2,my+yuk/2-26);
  ctx.lineTo(mx+y2,my+yuk/2);    ctx.lineTo(mx-y2,my+yuk/2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#8D5524'; ctx.lineWidth=2; ctx.stroke();
  // Sağ dış yan
  ctx.fillStyle='#A86A30';
  ctx.beginPath();
  ctx.moveTo(mx+y2,my+yuk/2-26);   ctx.lineTo(mx+y2+d,my+yuk/2-26-d);
  ctx.lineTo(mx+y2+d,my+yuk/2-d);  ctx.lineTo(mx+y2,my+yuk/2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // Açık ağız kenarı
  ctx.strokeStyle='#8D5524'; ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(mx-y2,my-yuk/2);     ctx.lineTo(mx-y2+d,my-yuk/2-d);
  ctx.lineTo(mx+y2+d,my-yuk/2-d); ctx.lineTo(mx+y2,my-yuk/2);
  ctx.stroke();
}

// ---- CAM FANUS (balık için) ----
function cizFanusArka(ctx,mx,my,r){
  // Su
  ctx.fillStyle='rgba(120,200,235,.45)';
  ctx.beginPath(); ctx.arc(mx,my,r,0,Math.PI*2); ctx.fill();
  // Kum
  ctx.fillStyle='#E8D9A8';
  ctx.beginPath(); ctx.ellipse(mx,my+r*0.72,r*0.66,r*0.2,0,0,Math.PI*2); ctx.fill();
}
function cizFanusOn(ctx,mx,my,r){
  // Cam kenarı
  ctx.strokeStyle='#8FCEE8'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(mx,my,r,0,Math.PI*2); ctx.stroke();
  // Parlama
  ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.arc(mx,my,r*0.8,Math.PI*1.12,Math.PI*1.42); ctx.stroke();
  // Ağız
  ctx.strokeStyle='#8FCEE8'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.ellipse(mx,my-r*0.92,r*0.42,r*0.14,0,0,Math.PI*2); ctx.stroke();
  // Altlık
  ctx.fillStyle='#B0BEC5';
  ctx.beginPath(); ctx.ellipse(mx,my+r*0.98,r*0.5,r*0.14,0,0,Math.PI*2); ctx.fill();
}

// ---- KONUM TANIMLARI ----
const MASA_KONUM={
  'üstünde':  {ip:'Üstünde olan, masanın tam üzerine konmuştur.'},
  'altında':  {ip:'Altında olan, masanın aşağısında, ayakların arasındadır.'},
  'solunda':  {ip:'Sol taraf, bu resimde masanın sol yanıdır.'},
  'sağında':  {ip:'Sağ taraf, bu resimde masanın sağ yanıdır.'},
  'önünde':   {ip:'Önünde olan bize yakındır, masanın önünde durur ve daha büyük görünür.'},
  'arkasında':{ip:'Arkasında olan uzaktadır, masa onun bir kısmını gizler.'}
};
function cizMasaSahne(nesne,konum){
  const{c,ctx,W,H}=sahne(148,136);
  cizZemin(ctx,W,H);
  const mx=W/2-6, my=H*0.56, gen=72;

  if(konum==='arkasında'){
    emoji(ctx,nesne,mx+14,my-30,26);
    cizMasa(ctx,mx,my,gen);
  }else if(konum==='önünde'){
    cizMasa(ctx,mx,my,gen);
    golge(ctx,mx-2,H-26,50); emoji(ctx,nesne,mx-2,H-26,50);
  }else if(konum==='altında'){
    cizMasa(ctx,mx,my,gen);
    emoji(ctx,nesne,mx,my+25,26);
  }else if(konum==='üstünde'){
    cizMasa(ctx,mx,my,gen);
    emoji(ctx,nesne,mx+8,my-26,34);
  }else{
    cizMasa(ctx,mx,my,gen);
    const x=konum==='solunda'?mx-54:mx+58;
    golge(ctx,x,my+22,32); emoji(ctx,nesne,x,my+22,32);
  }
  return c;
}

// ---- KUTU / FANUS SAHNESİ ----
const KUTU_KONUM={
  'içinde': {ip:'İçinde olan, kabın içine girmiştir.'},
  'dışında':{ip:'Dışında olan, kabın dışında kalmıştır.'}
};
function cizKutuSahne(nesne,konum){
  const{c,ctx,W,H}=sahne(148,136);
  cizZemin(ctx,W,H);
  const mx=W/2-8, my=H*0.54;
  const fanus = (nesne==='🐟');       // balık ise cam fanus

  if(fanus){
    const r=34;
    cizFanusArka(ctx,mx,my,r);
    if(konum==='içinde') emoji(ctx,nesne,mx,my-2,32);
    cizFanusOn(ctx,mx,my,r);
    if(konum==='dışında'){ golge(ctx,mx+62,my+22,30); emoji(ctx,nesne,mx+62,my+22,30); }
  }else{
    const gen=66;
    cizKutuIc(ctx,mx,my,gen);
    if(konum==='içinde') emoji(ctx,nesne,mx+7,my+3,34);
    cizKutuOnDuvar(ctx,mx,my,gen);
    if(konum==='dışında'){ golge(ctx,mx+60,my+24,32); emoji(ctx,nesne,mx+60,my+24,32); }
  }
  return c;
}

const TUM_KONUM={...MASA_KONUM,...KUTU_KONUM};
const masaKonumu=k=>k in MASA_KONUM;
function cizSahne(nesne,konum){
  return masaKonumu(konum)?cizMasaSahne(nesne,konum):cizKutuSahne(nesne,konum);
}
const referans=k=>masaKonumu(k)?MASA:KUTU;

// ETKİNLİK 1: Konum kavramı — doğru resmi bul
function etkKonum(){
  const nesne=pick(NESNELER);
  const masaMi=rnd(0,3)>0;                       // çoğunlukla masa, bazen kutu
  const havuz=Object.keys(masaMi?MASA_KONUM:KUTU_KONUM);
  const dogru=pick(havuz);
  const ref=referans(dogru);
  // Seçenekler aynı sahne tipinden olmalı ki karşılaştırılabilsin
  const digerler=shuffle(havuz.filter(x=>x!==dogru)).slice(0,masaMi?2:1);
  return{
    yonerge:`${nesne.ad} ${ref.nin} ${dogru}. Doğru resmi bul.`,
    secenek:[dogru,...digerler], dogru,
    ciz:s=>cizSahne(nesne.n,s),
    ipucu:TUM_KONUM[dogru].ip
  };
}

// ETKİNLİK 2: Resme bak, konumu söyle
function etkTers(){
  const nesne=pick(NESNELER);
  const masaMi=rnd(0,3)>0;
  const havuz=Object.keys(masaMi?MASA_KONUM:KUTU_KONUM);
  const dogru=pick(havuz);
  const ref=referans(dogru);
  const digerler=shuffle(havuz.filter(x=>x!==dogru)).slice(0,masaMi?2:1);
  const buyuk=cizSahne(nesne.n,dogru);
  buyuk.style.width='200px'; buyuk.style.height='180px';
  return{
    yonerge:`${nesne.ad} nerede? Resme bak ve doğru sözcüğü seç.`,
    secenek:[dogru,...digerler], dogru,
    ustGorsel:buyuk,
    ciz:s=>{
      const{c,ctx,W,H}=sahne(148,96);
      ctx.fillStyle='#4E4E4E';
      ctx.font='600 21px Fredoka,Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(s,W/2,H/2);
      return c;
    },
    ipucu:TUM_KONUM[dogru].ip
  };
}

// ETKİNLİK 3: Yakın - uzak
function etkYakinUzak(){
  const nesne=pick(NESNELER);
  const soru=pick(['yakın','uzak']);
  function ciz(s){
    const{c,ctx,W,H}=sahne(148,136);
    cizZemin(ctx,W,H);
    const my=H*0.58;
    cizMasa(ctx,40,my,50);
    const x=s==='yakın'?82:132;
    golge(ctx,x,my+22,34);
    emoji(ctx,nesne.n,x,my+22,34);
    return c;
  }
  return{
    yonerge:`${nesne.ad} ${soru==='yakın'?MASA.e:MASA.den} ${soru}. Doğru resmi bul.`,
    secenek:['yakın','uzak'], dogru:soru, ciz,
    ipucu:soru==='yakın'?'Yakın olan, hemen yanı başındadır.':'Uzak olan, aralarında çok mesafe vardır.'
  };
}

// ETKİNLİK 4: Arasında
function etkArasinda(){
  const nesne=pick(NESNELER);
  function ciz(s){
    const{c,ctx,W,H}=sahne(148,136);
    cizZemin(ctx,W,H);
    const my=H*0.58;
    [28,74,120].forEach((x,i)=>{
      if(i===+s){ golge(ctx,x,my+20,34); emoji(ctx,nesne.n,x,my+20,34); }
      else cizMasa(ctx,x,my,38);
    });
    return c;
  }
  return{
    yonerge:`${nesne.ad} iki ${MASA.nin} arasında. Doğru resmi bul.`,
    secenek:['0','1','2'], dogru:'1', ciz,
    ipucu:'Arasında olan tam ortadadır, iki yanında birer masa vardır.'
  };
}

// ==================== SIRA / RAF / ODA SAHNELERİ ====================

// Seçenek kartı: tek nesne, büyük
function nesneKarti(ch){
  const{c,ctx,W,H}=sahne(148,98);
  emoji(ctx,ch,W/2,H/2,48);
  return c;
}

// ---- SIRA: nesneler yan yana ----
function cizSira(liste){
  const{c,ctx,W,H}=sahne(280,120);
  cizZemin(ctx,W,H);
  const zemin=H*0.66;
  const adim=(W-52)/liste.length;
  liste.forEach((ch,i)=>{
    const x=26+adim*i+adim/2;
    golge(ctx,x,zemin,38); emoji(ctx,ch,x,zemin,38);
  });
  // Yön okları
  ctx.save(); ctx.fillStyle='#8D6E63'; ctx.font='600 12px Fredoka,Arial';
  ctx.textAlign='left';  ctx.fillText('◀ sol',6,H-9);
  ctx.textAlign='right'; ctx.fillText('sağ ▶',W-6,H-9);
  ctx.restore();
  return c;
}
function etkSira(){
  const n=4;
  const secilen=shuffle([...NESNELER]).slice(0,n);
  const liste=secilen.map(o=>o.n);
  const sorular=[
    {s:'En sağda ne var?',    i:n-1, ip:'Sağ taraf, resmin sağ kenarıdır.'},
    {s:'En solda ne var?',    i:0,   ip:'Sol taraf, resmin sol kenarıdır.'},
    {s:'Soldan ikinci sırada ne var?', i:1, ip:'Soldan başlayıp say: bir, iki.'},
    {s:'Sağdan ikinci sırada ne var?', i:n-2, ip:'Sağdan başlayıp say: bir, iki.'}
  ];
  const q=pick(sorular);
  const dogru=liste[q.i];
  const buyuk=cizSira(liste);
  buyuk.style.width='260px'; buyuk.style.height='112px';
  return{
    yonerge:q.s+' Doğru olanı seç.',
    secenek:shuffle([...liste]).slice(0,3).includes(dogru)
      ? shuffle([dogru,...shuffle(liste.filter(x=>x!==dogru)).slice(0,2)])
      : shuffle([dogru,...shuffle(liste.filter(x=>x!==dogru)).slice(0,2)]),
    dogru, ustGorsel:buyuk, ciz:nesneKarti, ipucu:q.ip
  };
}

// ---- RAF: üç katlı, yukarıda/aşağıda ----
function cizRaf(liste){
  const{c,ctx,W,H}=sahne(220,160);
  const solX=26, sagX=W-26, kat=[34,78,122];
  // Yan destekler
  ctx.fillStyle='#B98B55';
  ctx.fillRect(solX-10,22,9,120); ctx.fillRect(sagX+1,22,9,120);
  ctx.strokeStyle='#7A4B1C'; ctx.lineWidth=2;
  ctx.strokeRect(solX-10,22,9,120); ctx.strokeRect(sagX+1,22,9,120);
  // Raflar + nesneler
  kat.forEach((y,i)=>{
    ctx.fillStyle='#D9A05B';
    ctx.fillRect(solX-10,y+18,sagX-solX+20,7);
    ctx.strokeRect(solX-10,y+18,sagX-solX+20,7);
    if(liste[i]) emoji(ctx,liste[i],W/2,y+2,34);
  });
  return c;
}
function etkRaf(){
  const secilen=shuffle([...NESNELER]).slice(0,3);
  const liste=secilen.map(o=>o.n);
  const sorular=[
    {s:'Hangisi en yukarıda?', i:0, ip:'Yukarı, rafın en üst katıdır.'},
    {s:'Hangisi en aşağıda?',  i:2, ip:'Aşağı, rafın en alt katıdır.'},
    {s:'Hangisi ortada?',      i:1, ip:'Orta kat, üst ile alt arasındadır.'}
  ];
  const q=pick(sorular);
  const buyuk=cizRaf(liste);
  buyuk.style.width='196px'; buyuk.style.height='142px';
  return{
    yonerge:q.s+' Doğru olanı seç.',
    secenek:shuffle([...liste]), dogru:liste[q.i],
    ustGorsel:buyuk, ciz:nesneKarti, ipucu:q.ip
  };
}

// ---- ODA: kapıya / pencereye yakınlık ----
function cizOda(liste,kapiSolda){
  const{c,ctx,W,H}=sahne(280,140);
  // Duvar ve zemin
  ctx.fillStyle='#FBF4E6'; ctx.fillRect(0,0,W,H*0.52);
  ctx.fillStyle='#EFE3CC'; ctx.fillRect(0,H*0.52,W,H*0.48);
  ctx.strokeStyle='#DCCFB4'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,H*0.52); ctx.lineTo(W,H*0.52); ctx.stroke();

  // Kapı
  const kx=kapiSolda?16:W-52;
  ctx.fillStyle='#A1663A';
  ctx.fillRect(kx,H*0.18,36,H*0.48);
  ctx.strokeStyle='#6E4423'; ctx.lineWidth=2.5;
  ctx.strokeRect(kx,H*0.18,36,H*0.48);
  ctx.fillStyle='#FFD54F';
  ctx.beginPath(); ctx.arc(kx+(kapiSolda?29:7),H*0.42,3.5,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.fillStyle='#6E4423'; ctx.font='600 11px Fredoka,Arial';
  ctx.textAlign='center'; ctx.fillText('kapı',kx+18,H*0.18-6); ctx.restore();

  // Pencere (karşı taraf)
  const px=kapiSolda?W-60:24;
  ctx.fillStyle='#BFE3F5';
  ctx.fillRect(px,H*0.16,40,30);
  ctx.strokeStyle='#5A8FA8'; ctx.lineWidth=2.5;
  ctx.strokeRect(px,H*0.16,40,30);
  ctx.beginPath(); ctx.moveTo(px+20,H*0.16); ctx.lineTo(px+20,H*0.16+30); ctx.stroke();
  ctx.save(); ctx.fillStyle='#41707F'; ctx.font='600 11px Fredoka,Arial';
  ctx.textAlign='center'; ctx.fillText('pencere',px+20,H*0.16-6); ctx.restore();

  // Nesneler zeminde, kapıdan uzaklaşan sırayla
  const zemin=H*0.80;
  const xler = kapiSolda ? [74,132,190] : [W-74,W-132,W-190];
  liste.forEach((ch,i)=>{ golge(ctx,xler[i],zemin,36); emoji(ctx,ch,xler[i],zemin,36); });
  return c;
}
function etkOda(){
  const secilen=shuffle([...NESNELER]).slice(0,3);
  const liste=secilen.map(o=>o.n);
  const kapiSolda=rnd(0,1)===0;
  const sorular=[
    {s:'Kapıya en yakın ne var?',   i:0, ip:'Kapıya en yakın olan, kapının hemen yanındakidir.'},
    {s:'Kapıdan en uzak ne var?',   i:2, ip:'Kapıdan en uzak olan, kapıya en çok mesafesi olandır.'},
    {s:'Pencereye en yakın ne var?',i:2, ip:'Pencere kapının karşı tarafındadır.'}
  ];
  const q=pick(sorular);
  const buyuk=cizOda(liste,kapiSolda);
  buyuk.style.width='266px'; buyuk.style.height='133px';
  return{
    yonerge:q.s+' Doğru olanı seç.',
    secenek:shuffle([...liste]), dogru:liste[q.i],
    ustGorsel:buyuk, ciz:nesneKarti, ipucu:q.ip
  };
}

initEtkinlik([etkKonum,etkTers,etkYakinUzak,etkArasinda,etkSira,etkRaf,etkOda],
