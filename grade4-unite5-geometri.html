// AŞAMA 1: Geometrik şekilleri tanıma (GÖRSEL)
const SHAPES=[
  {name:'Üçgen',sides:3,info:'3 kenar, 3 köşe'},
  {name:'Kare',sides:4,info:'4 eşit kenar, 4 köşe'},
  {name:'Dikdörtgen',sides:4,info:'karşılıklı kenarları eşit'},
  {name:'Beşgen',sides:5,info:'5 kenar, 5 köşe'},
  {name:'Altıgen',sides:6,info:'6 kenar, 6 köşe'}
];

function drawPolyShape(name){
  const{c,ctx,W,H}=newCanvas(1,.58,340);
  const cx=W/2, cy=H/2, r=Math.min(W,H)*0.34;
  ctx.fillStyle='#E1BEE7';ctx.strokeStyle='#6A1B9A';ctx.lineWidth=4;ctx.lineJoin='round';
  if(name==='Dikdörtgen'){
    const w=r*1.65,h=r*1.0;
    ctx.beginPath();ctx.rect(cx-w/2,cy-h/2,w,h);ctx.fill();ctx.stroke();
  }else if(name==='Kare'){
    const s=r*1.35;
    ctx.beginPath();ctx.rect(cx-s/2,cy-s/2,s,s);ctx.fill();ctx.stroke();
  }else{
    const n=SHAPES.find(s=>s.name===name).sides;
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const a=-Math.PI/2+i*2*Math.PI/n;
      const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();ctx.fill();ctx.stroke();
  }
  return c;
}

function genShapeId(){
  const s=pick(SHAPES);
  const kind=rnd(0,1);
  if(kind===0){
    return{
      text:'Aşağıdaki geometrik şeklin adı nedir?',
      visual:()=>drawPolyShape(s.name),
      answer:s.name,
      options:shuffle([s.name,...shuffle(SHAPES.filter(x=>x.name!==s.name)).slice(0,3).map(x=>x.name)]),
      explain:`Bu şekil bir ${s.name.toUpperCase()}.\nÖzelliği: ${s.info}\n\n💡 Kenar sayısını sayarak şekli tanıyabilirsin.`
    };
  }
  return{
    text:`Aşağıdaki şeklin KENAR sayısı kaçtır?`,
    visual:()=>drawPolyShape(s.name),
    answer:String(s.sides),
    options:shuffle([String(s.sides),...distractors(String(s.sides),()=>String(rnd(3,8)))]),
    explain:`Bu şekil bir ${s.name}.\nKenar sayısı: ${s.sides}\nKöşe sayısı: ${s.sides}\n\n💡 Çokgenlerde kenar sayısı = köşe sayısı`
  };
}

// AŞAMA 2: Eş küplerden oluşan yapı (GÖRSEL)
function drawCubeStack(cols){
  const{c,ctx,W,H}=newCanvas(1,.58,400);
  const cs=Math.min(30,(W-60)/(cols.length+2));
  const dx=cs*0.45, dy=cs*0.26;
  const baseX=(W-cols.length*cs-dx*3)/2+20, baseY=H-34;

  cols.forEach((cnt,ci)=>{
    for(let k=0;k<cnt;k++){
      const x=baseX+ci*cs, y=baseY-k*cs;
      // Ön yüz
      ctx.fillStyle='#FFB74D';ctx.fillRect(x,y-cs,cs,cs);
      ctx.strokeStyle='#E65100';ctx.lineWidth=1.8;ctx.strokeRect(x,y-cs,cs,cs);
      // Üst yüz
      ctx.fillStyle='#FFCC80';ctx.beginPath();
      ctx.moveTo(x,y-cs);ctx.lineTo(x+dx,y-cs-dy);
      ctx.lineTo(x+cs+dx,y-cs-dy);ctx.lineTo(x+cs,y-cs);
      ctx.closePath();ctx.fill();ctx.stroke();
      // Sağ yüz
      ctx.fillStyle='#EF9A4D';ctx.beginPath();
      ctx.moveTo(x+cs,y-cs);ctx.lineTo(x+cs+dx,y-cs-dy);
      ctx.lineTo(x+cs+dx,y-dy);ctx.lineTo(x+cs,y);
      ctx.closePath();ctx.fill();ctx.stroke();
    }
  });
  return c;
}

function genCubeCount(){
  const n=rnd(3,5);
  const cols=Array.from({length:n},()=>rnd(1,4));
  const total=cols.reduce((a,b)=>a+b,0);
  const w=distractors(total,()=>total+pick([-3,-2,-1,1,2,3]));
  return{
    text:'Aşağıdaki yapı eş küplerden oluşturulmuştur.\n\nBu yapıda toplam kaç küp kullanılmıştır?',
    visual:()=>drawCubeStack(cols),
    answer:String(total),
    options:shuffle([String(total),...w.map(String)]),
    explain:`Sütunlardaki küp sayıları: ${cols.join(' + ')} = ${total}\n\n💡 Her sütunu ayrı ayrı say, sonra topla.`
  };
}

// AŞAMA 3: Simetri - 2 SORU TİPİ
//  Tip A: Çocuk simetriği kendi oluşturur (interaktif)
//  Tip B: Verilen simetrik mi? (doğrulama)
function genSymmetry(){
  return rnd(0,1)===0 ? genSymBuild() : genSymCheck();
}

// Rastgele şekil + dikey eksene göre simetriği
function makeSymPair(N){
  const cells=new Set();
  const cnt=rnd(4,7);
  while(cells.size<cnt) cells.add(rnd(0,N-1)+','+rnd(0,N-1));
  const mirror=new Set();
  cells.forEach(k=>{const[r,c]=k.split(',').map(Number);mirror.add(r+','+(N-1-c));});
  return {cells,mirror};
}

// ---- TİP A: İNTERAKTİF OLUŞTURMA ----
function genSymBuild(){
  const N=4;
  const {cells,mirror}=makeSymPair(N);
  return{
    interactive:true,
    text:'Soldaki şeklin kırmızı çizgiye göre SİMETRİĞİNİ oluştur.\n\nSağdaki boş karelere tıklayarak boya. Hazır olduğunda "Kontrol Et" düğmesine bas.',
    mount:(box,api)=>mountSymmetry(box,api,cells,mirror,N)
  };
}

// ---- TİP B: DOĞRULAMA ----
function genSymCheck(){
  const N=4;
  const {cells,mirror}=makeSymPair(N);
  const isCorrect=rnd(0,1)===0;

  let shown=new Set(mirror), hataTipi='';
  if(!isCorrect){
    // Şekli boz; kazara simetrik kalırsa tekrar dene
    const isSameAsMirror=set=>set.size===mirror.size&&[...mirror].every(k=>set.has(k));
    let guard=0;
    do{
      shown=new Set(mirror);
      const kind=rnd(0,2);
      if(kind===0){
        // Bir kareyi yanlış yere taşı (yeni yer eskisinden farklı olmalı)
        const drop=pick([...shown]);
        shown.delete(drop);
        const bos=[];
        for(let r=0;r<N;r++)for(let c=0;c<N;c++){
          const k=r+','+c;
          if(!shown.has(k)&&k!==drop) bos.push(k);
        }
        if(bos.length){ shown.add(pick(bos)); hataTipi='Bir kare yanlış yerde.'; }
      }else if(kind===1){
        // Eksik kare
        shown.delete(pick([...shown]));
        hataTipi='Bir kare eksik.';
      }else{
        // Yansıtmak yerine aynen kopyalanmış
        shown=new Set(cells);
        hataTipi='Şekil yansıtılmamış, aynen kopyalanmış.';
      }
    }while(isSameAsMirror(shown)&&guard++<40);

    // Son güvence: hâlâ simetrikse bir kare sil
    if(isSameAsMirror(shown)){
      shown.delete(pick([...shown]));
      hataTipi='Bir kare eksik.';
    }
  }

  const dogru=[...mirror].filter(k=>shown.has(k)).length;
  return{
    text:'Sağdaki şekil, soldaki şeklin kırmızı çizgiye göre simetriği midir?',
    visual:()=>drawSymPair(cells,shown,N),
    answer:isCorrect?'Evet, simetriktir':'Hayır, simetrik değildir',
    options:shuffle(['Evet, simetriktir','Hayır, simetrik değildir']),
    explain:isCorrect
      ? `✓ Doğru simetri.\nSoldaki boyalı kare: ${cells.size}\nSağdaki boyalı kare: ${shown.size}\nHer kare eksenin karşı tarafında AYNI uzaklıkta.\n\n💡 Simetride satır (yükseklik) değişmez, sadece sağ-sol yer değiştirir.`
      : `✗ Simetrik değil. ${hataTipi}\nOlması gereken boyalı kare: ${mirror.size}\nGösterilen: ${shown.size} (bunun ${dogru} tanesi doğru yerde)\n\n💡 Her kareyi tek tek kontrol et: eksene 1 kare uzaktaysa, karşıda da 1 kare uzakta olmalı.`
  };
}

function drawSymPair(left,right,N){
  const W=Math.min(400,window.innerWidth-90);
  const cs=Math.floor(Math.min((W-30)/(N*2+0.7),52));
  const c=document.createElement('canvas');
  c.width=cs*(N*2)+cs*0.7+20; c.height=cs*N+20;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  const x0=10,y0=10,gap=cs*0.7,x1=x0+cs*N+gap;

  function grid(ox,set){
    for(let r=0;r<N;r++)for(let col=0;col<N;col++){
      ctx.fillStyle=set.has(r+','+col)?'#42A5F5':'#F5F5F5';
      ctx.fillRect(ox+col*cs,y0+r*cs,cs,cs);
      ctx.strokeStyle='#BDBDBD';ctx.lineWidth=1.5;
      ctx.strokeRect(ox+col*cs,y0+r*cs,cs,cs);
    }
  }
  grid(x0,left); grid(x1,right);

  const mx=x0+cs*N+gap/2;
  ctx.strokeStyle='#E53935';ctx.lineWidth=3;ctx.setLineDash([7,5]);
  ctx.beginPath();ctx.moveTo(mx,y0-6);ctx.lineTo(mx,y0+cs*N+6);ctx.stroke();
  ctx.setLineDash([]);
  return c;
}

function mountSymmetry(box,api,cells,target,N){
  const picked=new Set();
  let locked=false;

  const wrap=document.createElement('div');
  wrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:14px';

  const canvas=document.createElement('canvas');
  const W=Math.min(400,window.innerWidth-90);
  const cs=Math.floor(Math.min((W-30)/(N*2+0.7),56));
  canvas.width=cs*(N*2)+cs*0.7+20;
  canvas.height=cs*N+20;
  canvas.style.cssText='border-radius:12px;cursor:pointer;touch-action:manipulation';
  const ctx=canvas.getContext('2d');

  const x0=10, y0=10, gap=cs*0.7;
  const x1=x0+cs*N+gap; // sağ ızgaranın başlangıcı

  function render(showAnswer){
    ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);

    // SOL ızgara (verilen şekil)
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      ctx.fillStyle=cells.has(r+','+c)?'#42A5F5':'#F5F5F5';
      ctx.fillRect(x0+c*cs,y0+r*cs,cs,cs);
      ctx.strokeStyle='#BDBDBD';ctx.lineWidth=1.5;
      ctx.strokeRect(x0+c*cs,y0+r*cs,cs,cs);
    }

    // SAĞ ızgara (çocuğun boyadığı)
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const key=r+','+c;
      let fill='#FAFAFA';
      if(showAnswer){
        const inTarget=target.has(key), inPicked=picked.has(key);
        if(inTarget&&inPicked) fill='#66BB6A';      // doğru boyanmış
        else if(inTarget&&!inPicked) fill='#FFE082'; // boyanmalıydı
        else if(!inTarget&&inPicked) fill='#EF9A9A'; // fazladan boyanmış
      }else if(picked.has(key)) fill='#42A5F5';
      ctx.fillStyle=fill;
      ctx.fillRect(x1+c*cs,y0+r*cs,cs,cs);
      ctx.strokeStyle='#BDBDBD';ctx.lineWidth=1.5;
      ctx.strokeRect(x1+c*cs,y0+r*cs,cs,cs);
    }

    // Simetri ekseni
    const mx=x0+cs*N+gap/2;
    ctx.strokeStyle='#E53935';ctx.lineWidth=3;ctx.setLineDash([7,5]);
    ctx.beginPath();ctx.moveTo(mx,y0-6);ctx.lineTo(mx,y0+cs*N+6);ctx.stroke();
    ctx.setLineDash([]);
  }

  function hit(e){
    if(locked)return;
    const rect=canvas.getBoundingClientRect();
    const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
    const px=(( e.touches? e.touches[0].clientX : e.clientX )-rect.left)*sx;
    const py=(( e.touches? e.touches[0].clientY : e.clientY )-rect.top)*sy;
    if(px<x1||px>x1+cs*N||py<y0||py>y0+cs*N)return;
    const c=Math.floor((px-x1)/cs), r=Math.floor((py-y0)/cs);
    if(r<0||r>=N||c<0||c>=N)return;
    const key=r+','+c;
    picked.has(key)?picked.delete(key):picked.add(key);
    render(false);
  }

  canvas.addEventListener('click',hit);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();hit(e);},{passive:false});

  const hint=document.createElement('div');
  hint.style.cssText='font-size:13px;color:#999;text-align:center;font-weight:500';
  hint.textContent='👆 Sağdaki kareye dokun → boya | tekrar dokun → sil';

  const row=document.createElement('div');
  row.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%';

  const clearBtn=document.createElement('button');
  clearBtn.className='opt';clearBtn.textContent='🔄 Temizle';
  clearBtn.onclick=()=>{if(locked)return;picked.clear();render(false);};

  const checkBtn=document.createElement('button');
  checkBtn.className='opt';
  checkBtn.style.cssText='background:#42A5F5;color:#fff;border-color:#1E88E5';
  checkBtn.textContent='✓ Kontrol Et';
  checkBtn.onclick=()=>{
    if(locked)return;
    if(picked.size===0){hint.textContent='⚠️ Önce sağdaki karelerden boya!';return;}
    locked=true;
    clearBtn.disabled=true;checkBtn.disabled=true;
    const ok = picked.size===target.size && [...target].every(k=>picked.has(k));
    render(true);
    hint.innerHTML='🟩 Doğru &nbsp; 🟨 Eksik kalan &nbsp; 🟥 Fazladan';
    const dogru=[...target].filter(k=>picked.has(k)).length;
    api.done(ok,
      `Simetri, şekli AYNA gibi yansıtır.\nSoldaki boyalı kare sayısı: ${cells.size}\nSimetrikte de aynı sayıda olmalı: ${target.size}\nSenin doğru boyadığın: ${dogru}\n\n💡 Eksene en yakın kare, karşı tarafta da en yakın olur.\n💡 Satır (yükseklik) değişmez, sadece sağ-sol yer değiştirir.`);
  };

  row.appendChild(clearBtn);row.appendChild(checkBtn);
  wrap.appendChild(canvas);wrap.appendChild(hint);wrap.appendChild(row);
  box.appendChild(wrap);
  render(false);
}

// AŞAMA 4: Küp açınımı (GÖRSEL)
function drawNet(type){
  const{c,ctx,W,H}=newCanvas(1,.62,360);
  const cs=Math.min((W-40)/5,(H-30)/4);
  const layouts={
    cross:[[1,0],[0,1],[1,1],[2,1],[1,2],[1,3]],
    tshape:[[0,0],[1,0],[2,0],[1,1],[1,2],[1,3]],
    zigzag:[[0,0],[1,0],[1,1],[2,1],[2,2],[3,2]],
    bad:[[0,0],[1,0],[2,0],[3,0],[0,1],[1,1]]
  };
  const cells=layouts[type];
  const maxC=Math.max(...cells.map(p=>p[0]))+1;
  const maxR=Math.max(...cells.map(p=>p[1]))+1;
  const x0=(W-maxC*cs)/2, y0=(H-maxR*cs)/2;
  cells.forEach(([col,r])=>{
    ctx.fillStyle='#80CBC4';
    ctx.fillRect(x0+col*cs,y0+r*cs,cs,cs);
    ctx.strokeStyle='#00695C';ctx.lineWidth=2.5;
    ctx.strokeRect(x0+col*cs,y0+r*cs,cs,cs);
  });
  return c;
}

function genCubeNet(){
  const good=['cross','tshape','zigzag'];
  const isGood=rnd(0,1)===0;
  const type=isGood?pick(good):'bad';
  return{
    text:'Aşağıdaki açınım katlandığında bir KÜP oluşturur mu?',
    visual:()=>drawNet(type),
    answer:isGood?'Evet, küp olur':'Hayır, küp olmaz',
    options:shuffle(['Evet, küp olur','Hayır, küp olmaz','Sadece dikdörtgen prizma olur','Hiçbir şekil oluşmaz']),
    explain:isGood
      ?`Bu açınım 6 kareden oluşuyor ve katlandığında yüzler üst üste binmiyor → KÜP olur ✓\n\n💡 Küp açınımı: 6 eş kare + yüzler çakışmamalı`
      :`Bu açınımda 4 kare yan yana dizilmiş ve katlandığında yüzler ÜST ÜSTE biniyor → küp olmaz ✗\n\n💡 Bir sırada en fazla 4 kare olabilir ve kalan 2 kare farklı taraflarda durmalı.`
  };
}

// AŞAMA 5: Örüntü ve uzamsal düşünme
function genPattern(){
  const kind=rnd(0,1);
  if(kind===0){ // Sayı örüntüsü
    const start=rnd(3,20), step=rnd(3,12);
    const seq=[start,start+step,start+2*step,start+3*step];
    const ans=start+4*step;
    const w=distractors(ans,()=>ans+pick([-step,step,-1,1,step*2]));
    return{
      text:'Aşağıdaki örüntüde "?" yerine hangi sayı gelmelidir?',
      readDisplay:seq.join('  →  ')+'  →  ?',
      answer:String(ans),
      options:shuffle([String(ans),...w.map(String)]),
      explain:`Kural: her adımda ${step} artıyor.\n${seq[3]} + ${step} = ${ans}\n\n💡 Ardışık iki sayının farkını bul, kuralı yakala.`
    };
  }
  // Şekil örüntüsü (kenar sayısı artan)
  const startSides=rnd(3,4);
  const seq=[startSides,startSides+1,startSides+2];
  const ans=startSides+3;
  const names={3:'Üçgen',4:'Kare',5:'Beşgen',6:'Altıgen',7:'Yedigen'};
  return{
    text:'Şekil örüntüsünde kenar sayıları birer artmaktadır.\n\nSıradaki şekil hangisidir?',
    readDisplay:seq.map(s=>names[s]).join('  →  ')+'  →  ?',
    answer:names[ans],
    options:shuffle([names[ans],...Object.values(names).filter(v=>v!==names[ans]).slice(0,3)]),
    explain:`${seq.map(s=>names[s]+' ('+s+' kenar)').join(' → ')}\nSıradaki: ${ans} kenar → ${names[ans]}\n\n💡 Kenar sayısı her adımda 1 artıyor.`
  };
}

// ==================== AÇILAR (GÖRSEL) ====================
function drawAci(derece,etiketli){
  const{c,ctx,W,H}=newCanvas(1,.6,360);
  const ox=W*0.24, oy=H*0.74, uzun=Math.min(W*0.52,H*0.62);
  ctx.lineCap='round';

  // Kenarlar (ışınlar)
  ctx.strokeStyle='#5E35B1';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+uzun,oy);ctx.stroke();
  const rad=derece*Math.PI/180;
  const bx=ox+uzun*Math.cos(rad), by=oy-uzun*Math.sin(rad);
  ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(bx,by);ctx.stroke();

  // Açı yayı — dik açıda kare işareti
  if(Math.abs(derece-90)<0.5){
    ctx.strokeStyle='#E53935';ctx.lineWidth=3;
    ctx.strokeRect(ox,oy-24,24,24);
  }else{
    ctx.strokeStyle='#E53935';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(ox,oy,32,-rad,0);ctx.stroke();
  }

  // Köşe noktası
  ctx.fillStyle='#311B92';ctx.beginPath();ctx.arc(ox,oy,5,0,Math.PI*2);ctx.fill();

  if(etiketli){
    ctx.fillStyle='#311B92';ctx.font='700 15px Fredoka,Arial';
    ctx.textAlign='right';ctx.textBaseline='top';
    ctx.fillText('A',ox-8,oy-4);                       // köşe
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText('B',ox+uzun+8,oy);                    // yatay kenar ucu
    ctx.fillText('C',bx+8,by-4);                       // eğik kenar ucu
  }
  return c;
}

const ACI_TIP=d=>d<90?'Dar açı':d>90?'Geniş açı':'Dik açı';

function genAci(){
  const tip=rnd(0,3);

  // 1) Görselden açı türü
  if(tip===0){
    const d=pick([25,35,48,62,78, 90, 105,120,138,155,168]);
    return{
      text:'Aşağıda verilen açı hangi türdendir?',
      visual:()=>drawAci(d,false),
      answer:ACI_TIP(d),
      options:shuffle(['Dar açı','Dik açı','Geniş açı']),
      explain:`Bu açı ${d}°'dir → ${ACI_TIP(d).toUpperCase()}\n\n💡 DAR açı: 90°'den KÜÇÜK\n💡 DİK açı: tam 90° (köşesinde küçük kare ile gösterilir)\n💡 GENİŞ açı: 90°'den BÜYÜK, 180°'den küçük`
    };
  }

  // 2) Açının elemanları
  if(tip===1){
    const d=pick([40,55,70,110,130]);
    const dogrular=[
      {t:'Kenarları AB ışını ve AC ışınıdır.',d:true},
      {t:'Köşesi A noktasıdır.',d:true},
      {t:`Bu bir ${ACI_TIP(d).toLowerCase()}dır.`,d:true},
      {t:'Sembolle BAC açısı olarak gösterilir.',d:true},
      {t:'Köşesi B noktasıdır.',d:false},
      {t:'Sembolle ABC açısı olarak gösterilir.',d:false},
      {t:`Bu bir ${ACI_TIP(d)==='Dar açı'?'geniş açı':'dar açı'}dır.`,d:false}
    ];
    const yanlis=pick(dogrular.filter(x=>!x.d));
    const w=shuffle(dogrular.filter(x=>x.d)).slice(0,3).map(x=>x.t);
    return{
      text:'Aşağıdaki açı ile ilgili hangisi SÖYLENEMEZ?',
      visual:()=>drawAci(d,true),
      answer:yanlis.t,
      options:shuffle([yanlis.t,...w]),
      explain:`Açının KÖŞESİ ortadaki harftir: A\nKENARLARI köşeden çıkan iki ışındır: AB ve AC\nSembolle gösterimde köşe ORTADA yazılır: BAC açısı\nBu açı ${d}° → ${ACI_TIP(d)}\n\n💡 "ABC açısı" deseydik köşe B olurdu — yanlış olurdu.`
    };
  }

  // 3) Saatteki açı
  if(tip===2){
    const saatler=[
      {s:'03.00',d:90, t:'Dik açı'},  {s:'09.00',d:90, t:'Dik açı'},
      {s:'01.00',d:30, t:'Dar açı'},  {s:'02.00',d:60, t:'Dar açı'},
      {s:'04.00',d:120,t:'Geniş açı'},{s:'05.00',d:150,t:'Geniş açı'},
      {s:'10.00',d:60, t:'Dar açı'},  {s:'08.00',d:120,t:'Geniş açı'}
    ];
    const it=pick(saatler);
    return{
      text:`Saat ${it.s}'da akrep ile yelkovan arasındaki açı hangi türdendir?`,
      numberDisplay:it.s,
      answer:it.t,
      options:shuffle(['Dar açı','Dik açı','Geniş açı']),
      explain:`Saat ${it.s}'da açı ${it.d}° → ${it.t.toUpperCase()}\n\n💡 Saatte her rakam arası 30°'dir (360° ÷ 12 = 30°).\nAkrep ile yelkovan arasında kaç rakam varsa × 30 yaparsın.`
    };
  }

  // 4) Günlük hayattan dik açı
  const ornekler=[
    {n:'Kitap sayfasının köşesi',t:'Dik açı'},
    {n:'Kare şeklindeki bir fayansın köşesi',t:'Dik açı'},
    {n:'Duvar ile tavanın birleştiği yer',t:'Dik açı'},
    {n:'Yarı açılmış bir makasın kolları',t:'Dar açı'},
    {n:'Neredeyse tamamen açılmış bir yelpaze',t:'Geniş açı'},
    {n:'Pizzanın ince bir diliminin ucu',t:'Dar açı'}
  ];
  const it=pick(ornekler);
  return{
    text:'Aşağıdaki durumda oluşan açı hangi türdendir?',
    readDisplay:it.n,
    answer:it.t,
    options:shuffle(['Dar açı','Dik açı','Geniş açı']),
    explain:`${it.n} → ${it.t}\n\n💡 Dik açıyı tanımanın kolay yolu: kâğıdın köşesini tutup karşılaştır.`
  };
}

// ==================== ÜÇGEN ÇEŞİTLERİ ====================
function drawUcgen(a,b,c2){
  const{c,ctx,W,H}=newCanvas(1,.58,340);
  // Kenarlardan üçgeni kur (kosinüs teoremi ile üçüncü köşe)
  const olcek=Math.min((W-90)/Math.max(a,b,c2), (H-70)/Math.max(a,b,c2))*0.9;
  const A=a*olcek,B=b*olcek,C=c2*olcek;
  const x1=(W-A)/2, y1=H*0.78, x2=x1+A;
  const cosA=(A*A+C*C-B*B)/(2*A*C);
  const x3=x1+C*cosA, y3=y1-C*Math.sqrt(Math.max(0,1-cosA*cosA));

  ctx.fillStyle='#E1BEE7';ctx.strokeStyle='#6A1B9A';ctx.lineWidth=4;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y1);ctx.lineTo(x3,y3);ctx.closePath();
  ctx.fill();ctx.stroke();

  ctx.fillStyle='#4A148C';ctx.font='700 14px Fredoka,Arial';
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText(a+' cm',(x1+x2)/2,y1+8);
  ctx.textBaseline='bottom';ctx.textAlign='right';
  ctx.fillText(c2+' cm',(x1+x3)/2-6,(y1+y3)/2);
  ctx.textAlign='left';
  ctx.fillText(b+' cm',(x2+x3)/2+6,(y1+y3)/2);
  return c;
}

function ucgenTuru(a,b,c){
  if(a===b&&b===c) return 'Eşkenar üçgen';
  if(a===b||b===c||a===c) return 'İkizkenar üçgen';
  return 'Çeşitkenar üçgen';
}

function genUcgen(){
  const tip=rnd(0,2);

  // 1) Görselden tür
  if(tip===0){
    const setler=[[6,6,6],[8,8,8],[5,5,8],[7,7,4],[9,9,5],[5,6,7],[4,6,8],[6,8,9],[5,5,5]];
    const [a,b,c]=pick(setler);
    const t=ucgenTuru(a,b,c);
    return{
      text:'Aşağıdaki üçgen kenar uzunluklarına göre hangi türdendir?',
      visual:()=>drawUcgen(a,b,c),
      answer:t,
      options:shuffle(['Eşkenar üçgen','İkizkenar üçgen','Çeşitkenar üçgen']),
      explain:`Kenarlar: ${a} cm, ${b} cm, ${c} cm → ${t.toUpperCase()}\n\n💡 EŞKENAR: üç kenarı da eşit\n💡 İKİZKENAR: iki kenarı eşit\n💡 ÇEŞİTKENAR: üç kenarı da farklı`
    };
  }

  // 2) Tanımdan tür
  if(tip===1){
    const tanimlar=[
      {t:'Eşkenar üçgen',d:'Üç kenarının uzunluğu da birbirine eşittir.'},
      {t:'İkizkenar üçgen',d:'Yalnızca iki kenarının uzunluğu birbirine eşittir.'},
      {t:'Çeşitkenar üçgen',d:'Üç kenarının uzunluğu da birbirinden farklıdır.'}
    ];
    const it=pick(tanimlar);
    return{
      text:'Aşağıda özelliği verilen üçgen hangisidir?',
      readDisplay:it.d,
      answer:it.t,
      options:shuffle(tanimlar.map(x=>x.t)),
      explain:`${it.t}: ${it.d}\n\n💡 Üçgenler kenar uzunluklarına göre üçe ayrılır:\neşkenar (3 eşit) · ikizkenar (2 eşit) · çeşitkenar (hepsi farklı)`
    };
  }

  // 3) Üçgen eşitsizliği — hangi kenarlar üçgen oluşturur?
  const olur=[[5,6,7],[8,8,8],[4,5,6],[7,7,9],[3,4,5],[6,8,10]];
  const olmaz=[[2,3,9],[1,2,8],[3,3,10],[2,5,12],[4,4,11]];
  const dogru=pick(olur), yanlis=shuffle([...olmaz]).slice(0,3);
  const f=x=>x.join(' cm, ')+' cm';
  return{
    text:'Aşağıdaki uzunluklardan hangisi bir ÜÇGEN oluşturabilir?',
    answer:f(dogru),
    options:shuffle([f(dogru),...yanlis.map(f)]),
    explain:`${f(dogru)} → üçgen olur ✓\n${dogru[0]} + ${dogru[1]} = ${dogru[0]+dogru[1]} > ${dogru[2]} ✓\n\n💡 KURAL: İki kısa kenarın toplamı, en uzun kenardan BÜYÜK olmalıdır.\nÖrnek: ${yanlis[0][0]} + ${yanlis[0][1]} = ${yanlis[0][0]+yanlis[0][1]} < ${yanlis[0][2]} → üçgen olmaz ✗`
  };
}
