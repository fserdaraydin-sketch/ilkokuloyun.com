<script>
function metinKarti(t,b){
  const{c,ctx,W,H}=sahne(148,92);
  ctx.save(); ctx.fillStyle='#37474F'; ctx.font='600 '+(b||16)+'px Fredoka,Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const kel=t.split(' '); const satir=[]; let s='';
  kel.forEach(k=>{ const d=s?s+' '+k:k;
    if(ctx.measureText(d).width>128){ satir.push(s); s=k; } else s=d; });
  if(s) satir.push(s);
  const bas=H/2-(satir.length-1)*10;
  satir.forEach((x,i)=>ctx.fillText(x,W/2,bas+i*20));
  ctx.restore(); return c;
}
function emojiKarti(ch){
  const{c,ctx,W,H}=sahne(148,100);
  emoji(ctx,ch,W/2,H/2,52); return c;
}

/* ===== DUYGU YÜZÜ ÇİZİMİ ===== */
function duyguYuz(ctx,cx,cy,r,tip){
  // Yüz
  ctx.fillStyle='#FFD86B';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#E0A82E'; ctx.lineWidth=r*0.07; ctx.stroke();
  const gz=r*0.34, gy=cy-r*0.18;
  ctx.fillStyle='#4A3B10'; ctx.strokeStyle='#4A3B10';
  ctx.lineWidth=r*0.075; ctx.lineCap='round';

  // Gözler
  if(tip==='şaşkın'||tip==='heyecanlı'){
    [-1,1].forEach(s=>{ ctx.beginPath(); ctx.arc(cx+s*gz,gy,r*0.15,0,Math.PI*2); ctx.fill(); });
  }else if(tip==='korkmuş'){
    [-1,1].forEach(s=>{ ctx.beginPath(); ctx.ellipse(cx+s*gz,gy,r*0.12,r*0.17,0,0,Math.PI*2); ctx.fill(); });
  }else{
    [-1,1].forEach(s=>{ ctx.beginPath(); ctx.arc(cx+s*gz,gy,r*0.11,0,Math.PI*2); ctx.fill(); });
  }
  // Kaşlar
  ctx.beginPath();
  if(tip==='kızgın'){
    ctx.moveTo(cx-gz-r*0.18,gy-r*0.42); ctx.lineTo(cx-gz+r*0.16,gy-r*0.25);
    ctx.moveTo(cx+gz+r*0.18,gy-r*0.42); ctx.lineTo(cx+gz-r*0.16,gy-r*0.25);
  }else if(tip==='üzgün'||tip==='korkmuş'||tip==='endişeli'){
    ctx.moveTo(cx-gz-r*0.18,gy-r*0.26); ctx.lineTo(cx-gz+r*0.16,gy-r*0.42);
    ctx.moveTo(cx+gz+r*0.18,gy-r*0.26); ctx.lineTo(cx+gz-r*0.16,gy-r*0.42);
  }else if(tip==='şaşkın'){
    ctx.moveTo(cx-gz-r*0.17,gy-r*0.46); ctx.lineTo(cx-gz+r*0.17,gy-r*0.46);
    ctx.moveTo(cx+gz-r*0.17,gy-r*0.46); ctx.lineTo(cx+gz+r*0.17,gy-r*0.46);
  }
  ctx.stroke();
  // Ağız
  ctx.lineWidth=r*0.085;
  ctx.beginPath();
  if(tip==='mutlu'){
    ctx.arc(cx,cy+r*0.10,r*0.42,0.18*Math.PI,0.82*Math.PI);
  }else if(tip==='heyecanlı'){
    // Açık ağızla gülümseme — mutludan ayırt edilsin
    ctx.save();
    ctx.fillStyle='#4A3B10';
    ctx.beginPath(); ctx.ellipse(cx,cy+r*0.34,r*0.28,r*0.22,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#FF8A80';
    ctx.beginPath(); ctx.ellipse(cx,cy+r*0.44,r*0.15,r*0.10,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }else if(tip==='üzgün'){
    ctx.arc(cx,cy+r*0.62,r*0.42,1.18*Math.PI,1.82*Math.PI);
  }else if(tip==='kızgın'){
    ctx.arc(cx,cy+r*0.58,r*0.36,1.20*Math.PI,1.80*Math.PI);
  }else if(tip==='şaşkın'){
    ctx.ellipse(cx,cy+r*0.30,r*0.17,r*0.24,0,0,Math.PI*2);
  }else if(tip==='korkmuş'){
    ctx.ellipse(cx,cy+r*0.32,r*0.20,r*0.16,0,0,Math.PI*2);
  }else if(tip==='endişeli'){
    // Dalgalı ağız — kararsızlık, tedirginlik
    ctx.moveTo(cx-r*0.30,cy+r*0.34);
    ctx.quadraticCurveTo(cx-r*0.10,cy+r*0.20,cx,cy+r*0.32);
    ctx.quadraticCurveTo(cx+r*0.10,cy+r*0.44,cx+r*0.30,cy+r*0.28);
  }else{ // sakin
    ctx.moveTo(cx-r*0.26,cy+r*0.30); ctx.lineTo(cx+r*0.26,cy+r*0.30);
  }
  ctx.stroke();
  if(tip==='heyecanlı'){
    ctx.save(); ctx.font=(r*0.45)+'px serif'; ctx.textAlign='center';
    ctx.fillText('✨',cx+r*0.86,cy-r*0.66); ctx.restore();
  }
  if(tip==='üzgün'){
    ctx.fillStyle='#4FC3F7';
    ctx.beginPath(); ctx.ellipse(cx-gz,gy+r*0.36,r*0.07,r*0.12,0,0,Math.PI*2); ctx.fill();
  }
}
function yuzKarti(tip,boyut){
  const b=boyut||120;
  const{c,ctx,W,H}=sahne(b,b);
  duyguYuz(ctx,W/2,H/2,b*0.36,tip);
  return c;
}

const DUYGULAR=[
  {ad:'mutlu',    tip:'mutlu',    ne:'Sevindiğimizde, hoşumuza giden bir şey olduğunda mutlu oluruz.'},

/* ===== 1. KENDİNİ TANITMA ===== */
function etkTanisma(){
  const sorular=[
    {s:'Yeni tanıştığın bir arkadaşına önce ne söylersin?',c:'Adımı söylerim',
     y:['Hiçbir şey söylemem','Sırasını alırım'],
     e:'Tanışırken önce adımızı söyleriz. “Merhaba, benim adım …” demek güzel bir başlangıçtır.'},

    {s:'Herkesin adı, boyu ve saçı aynı mıdır?',c:'Hayır, herkes farklıdır',

    {s:'Tanışırken hangi söz uygundur?',c:'Tanıştığımıza memnun oldum',
     y:['Sen kimsin ya?','Çekil önümden'],
     e:'“Senin adın ne?”, “Tanıştığımıza memnun oldum.” gibi ifadeler nazik tanışma sözleridir.'},
    {s:'Biri konuşurken ne yaparsın?',c:'Sözünü bitirmesini beklerim',
     y:['Sözünü keserim','Başka yere bakarım'],

    {s:'Tanışırken beden dilimiz nasıl olmalı?',c:'Dik durup gülümsemeliyim',
     y:['Yere bakıp mırıldanmalıyım','Sırtımı dönmeliyim'],

  const it=pick(sorular);
  return{
    yonerge:it.s, secenek:shuffle([it.c,...it.y]), dogru:it.c,
    ciz:t=>metinKarti(t,15), ipucu:it.e
  };
}

/* ===== 2. OKUL MEKÂNLARI ===== */

/* ============================================================
   OKUL MEKÂNI SAHNELERİ
   Tek nesne emojisi (tabak, sandalye) mekânı anlatmıyor.
   Her mekân kendi karakteristik öğeleriyle sahne olarak çizilir.
   ============================================================ */
function zeminDuvar(ctx,W,H,duvar,zemin){
  ctx.fillStyle=duvar; ctx.fillRect(0,0,W,H*0.62);
  ctx.fillStyle=zemin; ctx.fillRect(0,H*0.62,W,H*0.38);
  ctx.strokeStyle='rgba(0,0,0,.09)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,H*0.62); ctx.lineTo(W,H*0.62); ctx.stroke();
}
function kutuCiz(ctx,x,y,g,h,dolgu,cizgi,r){
  ctx.fillStyle=dolgu; ctx.strokeStyle=cizgi; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(x,y,g,h,r||3); ctx.fill(); ctx.stroke();
}
function mekanCiz(ad,W,H){
  const{c,ctx}=sahne(W||210,H||132);
  const w=W||210, h=H||132;

  if(ad==='sınıf'){
    zeminDuvar(ctx,w,h,'#EAF4FB','#D7BFA6');
    // Yazı tahtası
    kutuCiz(ctx,w*0.22,h*0.10,w*0.56,h*0.32,'#2E7D32','#1B5E20',4);
    ctx.strokeStyle='#A5D6A7'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(w*0.30,h*0.22); ctx.lineTo(w*0.56,h*0.22);
    ctx.moveTo(w*0.30,h*0.30); ctx.lineTo(w*0.62,h*0.30); ctx.stroke();
    // Sıralar
    [[0.13,0.66],[0.42,0.66],[0.71,0.66]].forEach(([x,y])=>{
      kutuCiz(ctx,w*x,h*y,w*0.17,h*0.07,'#D9A05B','#7A4B1C',2);
      ctx.fillStyle='#8D5524';
      ctx.fillRect(w*x+2,h*(y+0.07),3,h*0.16);
      ctx.fillRect(w*x+w*0.17-5,h*(y+0.07),3,h*0.16);
    });
    // Öğretmen masası
    kutuCiz(ctx,w*0.36,h*0.47,w*0.28,h*0.055,'#C68642','#7A4B1C',2);
  }
  else if(ad==='kütüphane'){
    zeminDuvar(ctx,w,h,'#F6EFE4','#C9A87C');
    // İki raf, dikey kitaplar
    [0.14,0.36].forEach(ry=>{
      kutuCiz(ctx,w*0.10,h*(ry+0.16),w*0.80,h*0.035,'#8D6E52','#5D4632',2);
      const renk=['#E53935','#1E88E5','#43A047','#FB8C00','#8E24AA','#00ACC1','#D81B60'];
      for(let i=0;i<9;i++){
        const kg=w*0.065, gx=w*0.13+i*kg*1.02;
        const kh=h*(0.10+(i%3)*0.018);
        kutuCiz(ctx,gx,h*(ry+0.16)-kh,kg*0.82,kh,renk[i%renk.length],'rgba(0,0,0,.28)',1.5);
      }
    });
    // Okuma masası
    kutuCiz(ctx,w*0.30,h*0.74,w*0.40,h*0.05,'#C68642','#7A4B1C',2);
    emoji(ctx,'📖',w*0.50,h*0.70,17);
  }
  else if(ad==='yemekhane'){
    zeminDuvar(ctx,w,h,'#FFF6E8','#D8C3A5');
    // İki uzun masa, üstünde tabaklar
    [0.44,0.70].forEach((my,mi)=>{
      kutuCiz(ctx,w*0.08,h*my,w*0.84,h*0.05,'#EFEBE9','#BCAAA4',3);
      ctx.fillStyle='#9E9E9E';
      ctx.fillRect(w*0.14,h*(my+0.05),4,h*0.11);
      ctx.fillRect(w*0.82,h*(my+0.05),4,h*0.11);
      for(let i=0;i<4;i++){
        const px=w*(0.16+i*0.21);
        ctx.fillStyle='#fff'; ctx.strokeStyle='#B0BEC5'; ctx.lineWidth=1.8;
        ctx.beginPath(); ctx.ellipse(px,h*(my-0.015),w*0.045,h*0.022,0,0,Math.PI*2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle='#FFB74D';
        ctx.beginPath(); ctx.ellipse(px,h*(my-0.015),w*0.022,h*0.011,0,0,Math.PI*2); ctx.fill();
      }
    });
    // Tepsi taşıyan öğrenci
    emoji(ctx,'🧒',w*0.12,h*0.25,22);
    kutuCiz(ctx,w*0.19,h*0.26,w*0.11,h*0.035,'#90CAF9','#1565C0',2);
  }
  else if(ad==='bahçe'){
    // Gökyüzü + çim
    ctx.fillStyle='#BFE3F5'; ctx.fillRect(0,0,w,h*0.58);
    ctx.fillStyle='#8BC34A'; ctx.fillRect(0,h*0.58,w,h*0.42);
    ctx.fillStyle='#FFE082';
    ctx.beginPath(); ctx.arc(w*0.86,h*0.14,h*0.085,0,Math.PI*2); ctx.fill();
    // Ağaç
    ctx.fillStyle='#795548'; ctx.fillRect(w*0.15,h*0.42,w*0.045,h*0.20);
    ctx.fillStyle='#2E7D32';
    [[0.175,0.34,0.115],[0.13,0.40,0.085],[0.225,0.40,0.085]].forEach(([x,y,r])=>{
      ctx.beginPath(); ctx.arc(w*x,h*y,h*r,0,Math.PI*2); ctx.fill(); });
    // Kaydırak — salıncaktan daha tanınabilir
    ctx.strokeStyle='#6D4C41'; ctx.lineWidth=3.5; ctx.lineCap='round';
    // Merdiven direkleri
    ctx.beginPath();
    ctx.moveTo(w*0.50,h*0.62); ctx.lineTo(w*0.50,h*0.32);
    ctx.moveTo(w*0.57,h*0.62); ctx.lineTo(w*0.57,h*0.32);
    ctx.stroke();
    // Basamaklar
    ctx.lineWidth=2.5;
    [0.38,0.45,0.52,0.59].forEach(y=>{
      ctx.beginPath(); ctx.moveTo(w*0.50,h*y); ctx.lineTo(w*0.57,h*y); ctx.stroke(); });
    // Kayma yüzeyi
    ctx.fillStyle='#FB8C00'; ctx.strokeStyle='#E65100'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(w*0.565,h*0.30); ctx.lineTo(w*0.62,h*0.30);
    ctx.quadraticCurveTo(w*0.76,h*0.48,w*0.74,h*0.64);
    ctx.lineTo(w*0.68,h*0.64);
    ctx.quadraticCurveTo(w*0.70,h*0.48,w*0.565,h*0.36);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Üst platform
    ctx.fillStyle='#8D6E52'; ctx.strokeStyle='#5D4632'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(w*0.47,h*0.285,w*0.16,h*0.035,2); ctx.fill(); ctx.stroke();
    // Oynayan çocuklar ve top
    emoji(ctx,'🧒',w*0.84,h*0.70,22);
    emoji(ctx,'⚽',w*0.76,h*0.80,16);
  }
  else if(ad==='spor salonu'){
    zeminDuvar(ctx,w,h,'#E8F1F8','#E8B87A');
    // Pota
    ctx.fillStyle='#90A4AE'; ctx.fillRect(w*0.76,h*0.18,4,h*0.44);
    kutuCiz(ctx,w*0.60,h*0.14,w*0.18,h*0.14,'#FFFFFF','#546E7A',2);
    ctx.strokeStyle='#E53935'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(w*0.62,h*0.26); ctx.lineTo(w*0.72,h*0.26); ctx.stroke();
    ctx.strokeStyle='#EF9A9A'; ctx.lineWidth=1.6;
    for(let i=0;i<4;i++){ ctx.beginPath();
      ctx.moveTo(w*(0.625+i*0.026),h*0.26); ctx.lineTo(w*(0.645+i*0.018),h*0.32); ctx.stroke(); }
    // Saha çizgileri
    ctx.strokeStyle='#C77B3E'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(w*0.06,h*0.80); ctx.lineTo(w*0.94,h*0.80); ctx.stroke();
    ctx.beginPath(); ctx.arc(w*0.30,h*0.80,h*0.11,Math.PI,0); ctx.stroke();
    emoji(ctx,'🏀',w*0.46,h*0.72,20);
    emoji(ctx,'🧒',w*0.18,h*0.66,22);
  }
  else if(ad==='revir'){
    zeminDuvar(ctx,w,h,'#F4FBFF','#DCE7EC');
    // Yatak
    kutuCiz(ctx,w*0.14,h*0.50,w*0.50,h*0.14,'#ECEFF1','#90A4AE',4);
    kutuCiz(ctx,w*0.14,h*0.42,w*0.13,h*0.10,'#FFFFFF','#B0BEC5',4);
    ctx.fillStyle='#90CAF9';
    ctx.beginPath(); ctx.roundRect(w*0.30,h*0.50,w*0.34,h*0.09,3); ctx.fill();
    ctx.fillStyle='#78909C'; ctx.fillRect(w*0.15,h*0.64,4,h*0.09);
    ctx.fillRect(w*0.61,h*0.64,4,h*0.09);
    // Duvarda sağlık haçı
    kutuCiz(ctx,w*0.74,h*0.16,w*0.17,h*0.17,'#FFFFFF','#E53935',4);
    ctx.fillStyle='#E53935';
    ctx.fillRect(w*0.805,h*0.19,w*0.045,h*0.11);
    ctx.fillRect(w*0.765,h*0.225,w*0.125,h*0.04);
    emoji(ctx,'🩹',w*0.80,h*0.56,20);
  }
  else if(ad==='müdür odası'){
    zeminDuvar(ctx,w,h,'#F3EEF8','#C8A77E');
    // Kapı + tabela
    kutuCiz(ctx,w*0.08,h*0.18,w*0.22,h*0.60,'#A1663A','#6E4423',3);
    ctx.fillStyle='#FFD54F';
    ctx.beginPath(); ctx.arc(w*0.27,h*0.50,3.5,0,Math.PI*2); ctx.fill();
    kutuCiz(ctx,w*0.09,h*0.22,w*0.20,h*0.09,'#FFFFFF','#6E4423',2);
    ctx.save(); ctx.fillStyle='#5D4037'; ctx.font='600 9px Fredoka,Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('MÜDÜR',w*0.19,h*0.265); ctx.restore();
    // Çalışma masası + koltuk
    kutuCiz(ctx,w*0.40,h*0.56,w*0.48,h*0.06,'#8D6E52','#5D4632',3);
    ctx.fillStyle='#6D4C41';
    ctx.fillRect(w*0.44,h*0.62,4,h*0.14); ctx.fillRect(w*0.83,h*0.62,4,h*0.14);
    kutuCiz(ctx,w*0.56,h*0.30,w*0.16,h*0.26,'#5C6BC0','#3949AB',4);
    emoji(ctx,'📋',w*0.50,h*0.53,15);
  }
  else if(ad==='kantin'){
    zeminDuvar(ctx,w,h,'#FFF3E0','#D7B98E');
    // Tezgah
    kutuCiz(ctx,w*0.08,h*0.56,w*0.84,h*0.10,'#B0BEC5','#78909C',3);
    kutuCiz(ctx,w*0.08,h*0.66,w*0.84,h*0.16,'#CFD8DC','#90A4AE',2);
    // Arka raf + ürünler
    kutuCiz(ctx,w*0.14,h*0.34,w*0.72,h*0.035,'#8D6E52','#5D4632',2);
    ['🥪','🧃','🍎','🥛','🍪'].forEach((e,i)=>emoji(ctx,e,w*(0.22+i*0.15),h*0.28,17));
    emoji(ctx,'🧒',w*0.30,h*0.50,20);
    emoji(ctx,'🧒',w*0.46,h*0.50,20);
  }
  else if(ad==='tuvalet'){
    zeminDuvar(ctx,w,h,'#EAF6FA','#CFD8DC');
    // Ayna
    kutuCiz(ctx,w*0.16,h*0.12,w*0.26,h*0.26,'#E1F5FE','#90A4AE',4);
    kutuCiz(ctx,w*0.58,h*0.12,w*0.26,h*0.26,'#E1F5FE','#90A4AE',4);
    // İki lavabo
    [0.29,0.71].forEach(x=>{
      ctx.fillStyle='#FFFFFF'; ctx.strokeStyle='#90A4AE'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(w*x,h*0.54,w*0.115,h*0.075,0,0,Math.PI*2);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle='#B0BEC5'; ctx.fillRect(w*x-2.5,h*0.42,5,h*0.09);
      ctx.beginPath(); ctx.roundRect(w*x-2.5,h*0.41,w*0.05,4,2); ctx.fill();
      ctx.fillStyle='#90A4AE'; ctx.fillRect(w*x-3,h*0.61,6,h*0.14);
      // Akan su
      ctx.strokeStyle='#4FC3F7'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(w*x+w*0.02,h*0.44); ctx.lineTo(w*x+w*0.02,h*0.51); ctx.stroke();
    });
    emoji(ctx,'🧼',w*0.50,h*0.80,17);
  }
  return c;
}
