<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dalga Çizgileri - İlkokulOyun.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Fredoka', 'Arial', sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 720px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 30px;
            font-weight: 700;
            background: linear-gradient(135deg, #4facfe, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .header p {
            color: #9E9E9E;
            font-size: 15px;
            font-weight: 500;
        }

        .story {
            background: linear-gradient(135deg, #e8f7ff 0%, #e0f7fa 100%);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 14px;
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            border: 1px solid #b3e5fc;
        }

        .story strong {
            color: #0288d1;
        }

        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .dot {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #EEE;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: all 0.3s ease;
            color: #BBB;
            font-weight: 600;
        }

        .dot.done {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: white;
            transform: scale(0.9);
        }

        .dot.active {
            background: linear-gradient(135deg, #4facfe, #0072ff);
            color: white;
            transform: scale(1.15);
            box-shadow: 0 4px 14px rgba(79, 172, 254, 0.4);
        }

        .task-title {
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            color: #444;
            margin-bottom: 14px;
            padding: 12px;
            background: linear-gradient(135deg, #fdfbfb 0%, #f0f9ff 100%);
            border-radius: 16px;
            border: 2px dashed #90caf9;
        }

        .game-area {
            position: relative;
            background: white;
            border-radius: 20px;
            width: 100%;
            height: 400px;
            margin-bottom: 16px;
            overflow: hidden;
            touch-action: none;
            box-shadow: inset 0 2px 12px rgba(0,0,0,0.06);
            border: 3px solid #E1F5FE;
        }

        #canvas {
            display: block;
            cursor: crosshair;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        .message {
            text-align: center;
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 14px;
            min-height: 28px;
            transition: all 0.3s ease;
        }

        .message.success {
            color: #2ecc71;
            animation: pop 0.4s ease;
        }

        .message.fail {
            color: #ff7043;
            animation: shake 0.4s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat {
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f2f8 100%);
            border-radius: 14px;
            padding: 10px 22px;
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: #999;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #0288d1;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-reset {
            background: #F1F3F5;
            color: #555;
        }

        .btn-reset:hover {
            background: #E4E7EB;
        }

        .btn-next {
            background: linear-gradient(135deg, #4facfe, #0072ff);
            color: white;
            box-shadow: 0 4px 14px rgba(79, 172, 254, 0.35);
        }

        .btn-next:hover {
            box-shadow: 0 6px 18px rgba(79, 172, 254, 0.5);
            transform: translateY(-2px);
        }

        .back-btn {
            width: 100%;
            padding: 13px;
            background: transparent;
            color: #999;
            border: 2px solid #E0E0E0;
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            border-color: #4facfe;
            color: #4facfe;
        }

        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            top: -20px;
            z-index: 999;
            animation: fall linear forwards;
            border-radius: 3px;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0.3;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 16px;
            }

            .game-area {
                height: 320px;
            }
            
            .header h1 {
                font-size: 24px;
            }

            .dot {
                width: 28px;
                height: 28px;
                font-size: 13px;
            }

            .task-title {
                font-size: 18px;
            }
        }
    </style>
  <script defer src="analytics.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌊 Dalga Çizgileri</h1>
            <p>Dalgaların üzerinden geçerek takip et</p>
        </div>

        <div class="story">
            📖 <strong>Hikaye:</strong> Balık Fifi denizde yüzüyor! Dalgaların üzerinden geçerek Fifi'ye yolu göster. Soldan başla, sağa doğru dalgayı takip et! 🐟
        </div>

        <div class="progress-dots" id="progressDots"></div>

        <div class="task-title" id="taskTitle">🌊 Küçük Dalgalar</div>

        <div class="message" id="message"></div>

        <div class="game-area" id="gameArea">
            <canvas id="canvas"></canvas>
        </div>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-label">PUAN</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">SEVİYE</div>
                <div class="stat-value" id="level">1/6</div>
            </div>
        </div>

        <div class="buttons">
            <button class="btn btn-reset" onclick="resetLevel()">🔄 Yeniden Çiz</button>
            <button class="btn btn-next" onclick="nextLevel()">Devam ➜</button>
        </div>

        <button class="back-btn" onclick="history.back()">← Geri Dön</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const gameArea = document.getElementById('gameArea');
        const messageEl = document.getElementById('message');

        let score = 0;
        let level = 0;
        let isDrawing = false;
        let coveredPixels = new Set();

        const LINE_COLOR = '#42A5F5';
        const LINE_WIDTH = 10;

        const wavePatterns = [
            { name: '🌊 Küçük Dalgalar', draw: () => drawSineWave(30, 3) },
            { name: '🌊 Büyük Dalgalar', draw: () => drawSineWave(70, 2) },
            { name: '⚡ Zikzak Çizgiler', draw: () => drawZigzag(60, 5) },
            { name: '☁️ Tümsekler', draw: () => drawBumps(4) },
            { name: '🌈 Büyük Kavis', draw: drawBigArc },
            { name: '🐍 Yılan Yolu', draw: drawSnake }
        ];

        function resizeCanvas() {
            const rect = gameArea.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            drawCurrentPattern();
        }

        window.addEventListener('resize', resizeCanvas);

        function setLineStyle() {
            ctx.strokeStyle = LINE_COLOR;
            ctx.lineWidth = LINE_WIDTH;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        function drawArrowHead(tipX, tipY, angle) {
            const size = 22;
            ctx.beginPath();
            ctx.moveTo(
                tipX - size * Math.cos(angle - Math.PI / 7),
                tipY - size * Math.sin(angle - Math.PI / 7)
            );
            ctx.lineTo(tipX, tipY);
            ctx.lineTo(
                tipX - size * Math.cos(angle + Math.PI / 7),
                tipY - size * Math.sin(angle + Math.PI / 7)
            );
            ctx.stroke();
        }

        function drawStartPoint(x, y) {
            ctx.fillStyle = '#FFD54F';
            ctx.beginPath();
            ctx.arc(x, y, 16, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.font = 'bold 16px Fredoka, Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('👆', x, y + 1);
        }

        // ========== DALGA DESENLERİ ==========

        // Sinüs dalgası - amplitude: dalga yüksekliği, cycles: dalga sayısı
        function drawSineWave(amplitude, cycles) {
            setLineStyle();
            const startX = 60;
            const endX = canvas.width - 60;
            const centerY = canvas.height / 2;
            const width = endX - startX;

            ctx.beginPath();
            let lastX, lastY;
            for (let x = startX; x <= endX; x += 2) {
                const progress = (x - startX) / width;
                const y = centerY - amplitude * Math.sin(progress * Math.PI * 2 * cycles);
                if (x === startX) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                lastX = x;
                lastY = y;
            }
            ctx.stroke();

            // Son noktadaki eğim yönünde ok
            const p1 = (lastX - 4 - startX) / width;
            const y1 = centerY - amplitude * Math.sin(p1 * Math.PI * 2 * cycles);
            const angle = Math.atan2(lastY - y1, 4);
            drawArrowHead(lastX, lastY, angle);

            const startYPos = centerY - amplitude * Math.sin(0);
            drawStartPoint(startX, startYPos);
        }

        // Zikzak - height: yükseklik, segments: parça sayısı
        function drawZigzag(height, segments) {
            setLineStyle();
            const startX = 60;
            const endX = canvas.width - 60;
            const centerY = canvas.height / 2;
            const segWidth = (endX - startX) / segments;

            ctx.beginPath();
            ctx.moveTo(startX, centerY + height / 2);
            
            let lastX = startX, lastY = centerY + height / 2;
            for (let i = 1; i <= segments; i++) {
                const x = startX + i * segWidth;
                const y = (i % 2 === 1) ? centerY - height / 2 : centerY + height / 2;
                ctx.lineTo(x, y);
                lastX = x;
                lastY = y;
            }
            ctx.stroke();

            // Son segmentin yönünde ok
            const prevY = ((segments - 1) % 2 === 1) ? centerY - height / 2 : centerY + height / 2;
            const angle = Math.atan2(lastY - prevY, segWidth);
            drawArrowHead(lastX, lastY, angle);

            drawStartPoint(startX, centerY + height / 2);
        }

        // Tümsekler (yarım daireler) - count: tümsek sayısı
        function drawBumps(count) {
            setLineStyle();
            const startX = 60;
            const endX = canvas.width - 60;
            const baseY = canvas.height / 2 + 40;
            const bumpWidth = (endX - startX) / count;
            const bumpRadius = bumpWidth / 2;

            ctx.beginPath();
            for (let i = 0; i < count; i++) {
                const cx = startX + i * bumpWidth + bumpRadius;
                ctx.arc(cx, baseY, bumpRadius, Math.PI, 0, false);
            }
            ctx.stroke();

            // Ok - son tümseğin bitişinde sağa bakar
            drawArrowHead(endX, baseY, Math.PI / 2.5);

            drawStartPoint(startX, baseY);
        }

        // Büyük kavis (gökkuşağı)
        function drawBigArc() {
            setLineStyle();
            const centerX = canvas.width / 2;
            const baseY = canvas.height / 2 + 80;
            const radius = Math.min(canvas.width * 0.35, canvas.height * 0.55);

            ctx.beginPath();
            ctx.arc(centerX, baseY, radius, Math.PI, 0, false);
            ctx.stroke();

            // Ok - sağ uçta aşağı bakar
            drawArrowHead(centerX + radius, baseY, Math.PI / 2);

            drawStartPoint(centerX - radius, baseY);
        }

        // Yılan yolu (S şekli)
        function drawSnake() {
            setLineStyle();
            const startX = 70;
            const endX = canvas.width - 70;
            const topY = 80;
            const bottomY = canvas.height - 80;
            const midY = (topY + bottomY) / 2;

            ctx.beginPath();
            ctx.moveTo(startX, topY);
            ctx.bezierCurveTo(
                endX, topY,
                startX, midY,
                (startX + endX) / 2, midY
            );
            ctx.bezierCurveTo(
                endX, midY,
                startX, bottomY,
                endX, bottomY
            );
            ctx.stroke();

            // Ok - sağ altta sağa bakar
            drawArrowHead(endX, bottomY, 0.3);

            drawStartPoint(startX, topY);
        }

        // ========== SEVİYE YÖNETİMİ ==========
        function buildProgressDots() {
            const container = document.getElementById('progressDots');
            container.innerHTML = '';
            for (let i = 0; i < wavePatterns.length; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                if (i < level) dot.className += ' done';
                if (i === level) dot.className += ' active';
                dot.textContent = i < level ? '✓' : (i + 1);
                container.appendChild(dot);
            }
        }

        function drawCurrentPattern() {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            wavePatterns[level].draw();
            document.getElementById('taskTitle').textContent = wavePatterns[level].name;
            buildProgressDots();
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches) {
                return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                };
            }
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('mouseup', finishDrawing);
        canvas.addEventListener('touchend', finishDrawing);

        function startDrawing(e) {
            e.preventDefault();
            isDrawing = true;
            coveredPixels.clear();
            messageEl.textContent = '';
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const pos = getPos(e);

            // Mavi çizgi üzerinde miyiz kontrol et
            const imageData = ctx.getImageData(
                Math.max(0, pos.x - 10), Math.max(0, pos.y - 10), 20, 20
            );
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                // Mavi renk tespiti (#42A5F5)
                if (data[i] < 150 && data[i + 1] > 100 && data[i + 2] > 180) {
                    coveredPixels.add(`${Math.round(pos.x/6)},${Math.round(pos.y/6)}`);
                    break;
                }
            }

            // Takip izini çiz (turuncu)
            ctx.fillStyle = 'rgba(255, 152, 0, 0.4)';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 11, 0, Math.PI * 2);
            ctx.fill();
        }

        function finishDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            checkSuccess();
        }

        function checkSuccess() {
            const required = 40;
            const covered = coveredPixels.size;

            if (covered >= required) {
                showMessage('🌟 SÜPER! Harika takip ettin!', 'success');
                score += 100;
                if(window.IO) IO.asamaTamam(wavePatterns[level].name, level+1);
                document.getElementById('score').textContent = score;
                launchConfetti(15);
                setTimeout(nextLevel, 1200);
            } else if (covered >= required * 0.5) {
                showMessage('👍 Az kaldı! Bir daha dene!', 'fail');
            } else {
                showMessage('💪 Dalganın üzerinden geçmeyi dene!', 'fail');
            }
        }

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
        }

        function launchConfetti(count) {
            const colors = ['#4facfe', '#0072ff', '#43e97b', '#FFD54F', '#FF7043'];
            for (let i = 0; i < count; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.animationDuration = (1.2 + Math.random() * 1.3) + 's';
                c.style.animationDelay = Math.random() * 0.3 + 's';
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 3000);
            }
        }

        function resetLevel() {
            coveredPixels.clear();
            messageEl.textContent = '';
            drawCurrentPattern();
        }

        function nextLevel() {
            if (level < wavePatterns.length - 1) {
                level++;
                if(window.IO) IO.asama(wavePatterns[level].name, level+1);
                document.getElementById('level').textContent = (level + 1) + '/' + wavePatterns.length;
                resetLevel();
            } else {
                launchConfetti(40);
                setTimeout(() => {
                    if(window.IO) IO.oyunBitti(score);
                    alert('🎉 OYUNU BİTİRDİN!\n\nToplam Puan: ' + score + ' 🏆\n\nTüm dalga tiplerini başarıyla takip ettin!');
                    location.reload();
                }, 500);
            }
        }

        // Başlat
        resizeCanvas();
        document.getElementById('level').textContent = '1/' + wavePatterns.length;
    </script>
</body>
</html>
