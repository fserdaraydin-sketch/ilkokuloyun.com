<script>
function metinKarti(t,b){
  const{c,ctx,W,H}=sahne(148,96);
  ctx.save(); ctx.fillStyle='#37474F'; ctx.font='600 '+(b||15)+'px Fredoka,Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const kel=t.split(' '); const sat=[]; let s='';
  kel.forEach(k=>{ const d=s?s+' '+k:k;
    if(ctx.measureText(d).width>130){ sat.push(s); s=k; } else s=d; });
  if(s) sat.push(s);
  const bas=H/2-(sat.length-1)*9.5;
  sat.forEach((x,i)=>ctx.fillText(x,W/2,bas+i*19));
  ctx.restore(); return c;
}
function emojiKarti(ch){
  const{c,ctx,W,H}=sahne(148,100); emoji(ctx,ch,W/2,H/2,50); return c;
}

/* ============================================================
   YERLEŞİM ÖLÇEĞİ — ev → mahalle → şehir → ülke
   İç içe halkalarla gösterilir; çocuk "benim yerim" fikrini
   büyüyen çemberler olarak görür.
   ============================================================ */
const OLCEK=[
  {ad:'ev',      ch:'🏠', ne:'Ailemizle birlikte yaşadığımız yerdir.'},
  {ad:'mahalle', ch:'🏘️', ne:'Evimizin bulunduğu, komşularımızla birlikte yaşadığımız yerdir.'},
  {ad:'şehir',   ch:'🏙️', ne:'Birçok mahallenin bir araya gelmesiyle oluşur.'},
  {ad:'ülke',    ch:'🇹🇷', ne:'Birçok şehrin bir araya gelmesiyle oluşur. Bizim ülkemiz Türkiye’dir.'}
];
function olcekSahne(vurgu){
  const{c,ctx,W,H}=sahne(240,150);
  ctx.fillStyle='#F4FAFF'; ctx.fillRect(0,0,W,H);
  const cx=W/2, cy=H*0.50;
  const renkler=['#FFCC80','#A5D6A7','#90CAF9','#CE93D8'];
  // Dıştan içe: ülke, şehir, mahalle, ev
  [4,3,2,1].forEach((k,i)=>{
    const r=H*(0.14+k*0.085);
    const idx=k-1;
    const secili=(OLCEK[idx].ad===vurgu);
    ctx.fillStyle=secili?renkler[idx]:'#FFFFFF';
    ctx.globalAlpha=secili?0.95:0.55;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle=secili?'#37474F':'#CFD8DC';
    ctx.lineWidth=secili?3:2;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
    // Etiket halkanın üst kenarında
    ctx.save();
    ctx.fillStyle=secili?'#263238':'#90A4AE';
    ctx.font=(secili?'700 ':'600 ')+'11px Fredoka,Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(OLCEK[idx].ad,cx,cy-r+10);
    ctx.restore();
  });
  emoji(ctx,'🏠',cx,cy+4,20);
  return c;
}

/* ===== BAYRAK ÇİZİMİ ===== */
function bayrakSahne(){
  const{c,ctx,W,H}=sahne(220,130);
  ctx.fillStyle='#EAF4FB'; ctx.fillRect(0,0,W,H);
  // Direk
  ctx.fillStyle='#90A4AE'; ctx.fillRect(W*0.12,H*0.10,5,H*0.82);
  // Bayrak
  ctx.fillStyle='#E30A17';
  ctx.fillRect(W*0.145,H*0.16,W*0.62,H*0.42);
  ctx.strokeStyle='#B71C1C'; ctx.lineWidth=1.5;
  ctx.strokeRect(W*0.145,H*0.16,W*0.62,H*0.42);
  // Ay
  const mx=W*0.38, my=H*0.37, r=H*0.125;
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(mx,my,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#E30A17';
  ctx.beginPath(); ctx.arc(mx+r*0.34,my,r*0.80,0,Math.PI*2); ctx.fill();
  // Yıldız
  ctx.fillStyle='#fff';
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*0.22:r*0.52;
    const x=W*0.52+rr*Math.cos(a), y=my+rr*Math.sin(a);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.closePath(); ctx.fill();
  return c;
}

/* ===== BAYRAM SAHNESİ ===== */
function bayramSahne(tip){
  const{c,ctx,W,H}=sahne(230,150);
  if(tip==='milli'){
    ctx.fillStyle='#BFE3F5'; ctx.fillRect(0,0,W,H*0.56);
    ctx.fillStyle='#8BC34A'; ctx.fillRect(0,H*0.56,W,H*0.28);
    ctx.fillStyle='#FFFDF8'; ctx.fillRect(0,H*0.84,W,H*0.16);
    // Bayraklar
    [0.16,0.50,0.84].forEach(x=>{
      ctx.fillStyle='#90A4AE'; ctx.fillRect(W*x,H*0.16,3,H*0.40);
      ctx.fillStyle='#E30A17'; ctx.fillRect(W*x+3,H*0.16,W*0.115,H*0.14);
    });
    emoji(ctx,'🧒',W*0.32,H*0.68,26);
    emoji(ctx,'👧',W*0.66,H*0.68,26);
    ctx.save(); ctx.fillStyle='#37474F'; ctx.font='700 13px Fredoka,Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('millî bayram',W/2,H*0.92); ctx.restore();
  }else{
    ctx.fillStyle='#FFF3E0'; ctx.fillRect(0,0,W,H*0.84);
    ctx.fillStyle='#FFFDF8'; ctx.fillRect(0,H*0.84,W,H*0.16);
    // Sofra / ziyaret
    ctx.fillStyle='#C68642'; ctx.strokeStyle='#7A4B1C'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(W/2,H*0.64,W*0.34,H*0.09,0,0,Math.PI*2);
    ctx.fill(); ctx.stroke();
    emoji(ctx,'🍬',W*0.38,H*0.62,16);
    emoji(ctx,'🍫',W*0.50,H*0.64,16);
    emoji(ctx,'🍪',W*0.62,H*0.62,16);
    emoji(ctx,'🧓',W*0.30,H*0.34,32);
    emoji(ctx,'🧒',W*0.56,H*0.38,26);
    ctx.save(); ctx.fillStyle='#8D6E52'; ctx.font='700 13px Fredoka,Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('bayram ziyareti',W/2,H*0.92); ctx.restore();
  }
  return c;
}

/* ===== 1. YAŞADIĞIM YER ===== */

    {s:'Bizim ülkemizin adı nedir?',c:'Türkiye',y:['Ankara','İstanbul'],
     e:'Ülkemizin adı Türkiye’dir. Ankara ise başkentimizdir.'},
    {s:'Ülkemizin başkenti neresidir?',c:'Ankara',y:['İstanbul','İzmir'],
     e:'Türkiye’nin başkenti Ankara’dır.'},
    {s:'Kaybolmamak için hangi bilgiyi bilmeliyiz?',c:'Adresimizi',
     y:['En sevdiğimiz rengi','Arkadaşımızın adını'],
     e:'Adresimizi ve bir aile büyüğümüzün telefonunu bilmek bizi güvende tutar.'},
    {s:'Yaşadığın yeri temiz tutmak kimin görevidir?',c:'Orada yaşayan herkesin',
     y:['Sadece belediyenin','Sadece büyüklerin'],
     e:'Yaşadığımız yeri temiz tutmak hepimizin görevidir. Çöpümüzü yere atmayız.'},
    {s:'Mahallende bir parkta oyun oynadın. Ayrılırken ne yaparsın?',
     c:'Çöpümü toplarım',y:['Bırakırım','Salıncakta bırakırım'],
     e:'Ortak kullandığımız yerleri temiz bırakmak herkesin hakkıdır.'},
    {s:'Komşularımıza nasıl davranmalıyız?',c:'Saygılı ve yardımsever',
     y:['İlgisiz','Gürültülü'],
     e:'Komşuluk önemli bir değerimizdir. Komşular birbirine destek olur.'},
    {s:'Köyde yaşayanlar ne iş yapar?',c:'Çoğunlukla tarım ve hayvancılık',
     y:['Hiçbir iş','Sadece ticaret'],
     e:'Köylerde genellikle tarım ve hayvancılık yapılır. Sofralarımıza ürünler oradan gelir.'},
    {s:'Şehirde neler bulunur?',c:'Okul, hastane, park, çarşı',
     y:['Sadece evler','Hiçbir şey'],
     e:'Şehirlerde okul, hastane, park, kütüphane ve çarşı gibi pek çok yer bulunur.'},
    {s:'Ülkemizin bayrağı nerelerde dalgalanır?',c:'Okullarda, resmî binalarda ve bayramlarda',
     y:['Hiçbir yerde','Sadece evlerde'],
     e:'Bayrağımız okullarda, resmî binalarda ve bayramlarda dalgalanır.'},
    {s:'Bir yere giderken adresi nasıl buluruz?',c:'Sokak ve numara bilgisine bakarız',
     y:['Rastgele yürürüz','Sormayız'],

  const it=pick(sorular);
  return{

/* ===== 2. BAYRAK VE MARŞ ===== */

   ne:'23 Nisan 1920’de Türkiye Büyük Millet Meclisi açıldı. Atatürk bu günü çocuklara armağan etti.'},
  {tarih:'19 Mayıs',ad:'Atatürk’ü Anma, Gençlik ve Spor Bayramı',
   ne:'19 Mayıs 1919’da Atatürk Samsun’a giderek Millî Mücadele’yi başlattı.'},
  {tarih:'30 Ağustos',ad:'Zafer Bayramı',
   ne:'30 Ağustos 1922’de Millî Mücadele’miz zaferle sonuçlandı.'},
  {tarih:'29 Ekim',ad:'Cumhuriyet Bayramı',
   ne:'29 Ekim 1923’te Cumhuriyet ilan edildi.'},
  {tarih:'15 Temmuz',ad:'Demokrasi ve Millî Birlik Günü',
   ne:'15 Temmuz’da milletimiz bağımsızlığına sahip çıktı.'}
];
function etkMilliBayram(){
  const it=pick(MILLI);
  const yon=rnd(0,1);
  if(yon===0){
    const w=distractors(it.ad,()=>pick(MILLI).ad);
    return{
      yonerge:'"'+it.tarih+'" hangi bayramımızdır?',
      secenek:shuffle([it.ad,...w.slice(0,2)]), dogru:it.ad,
      ustGorsel:(()=>{const c=bayramSahne('milli');c.style.width='220px';c.style.height='143px';return c;})(),
      ciz:t=>metinKarti(t,13), ipucu:it.ne

  const w=distractors(it.tarih,()=>pick(MILLI).tarih);
  return{
    yonerge:'"'+it.ad+'" ne zaman kutlanır?',
    secenek:shuffle([it.tarih,...w.slice(0,2)]), dogru:it.tarih,
    ciz:t=>metinKarti(t,17), ipucu:it.ne
  };
}

/* ===== 6. ÜLKEMİZİN GÜZELLİKLERİ ===== */
function etkGuzellik(){
  const yerler=[
    {ch:'🏖️',ad:'deniz',    ne:'Ülkemiz dört bir yanı denizlerle çevrili güzel bir ülkedir.'},
    {ch:'⛰️',ad:'dağ',      ne:'Ülkemizde pek çok yüksek dağ vardır.'},

    {ch:'🏛️',ad:'tarihî yapı',ne:'Ülkemizde binlerce yıllık tarihî yapılar bulunur.'},
    {ch:'🌊',ad:'göl',      ne:'Ülkemizde büyük ve güzel göller vardır.'}
  ];
  const tip=rnd(0,1);
  if(tip===0){
    const it=pick(yerler);
    const w=distractors(it.ad,()=>pick(yerler).ad);
    return{
      yonerge:'Bu doğal güzelliğin adı nedir?',
      secenek:shuffle([it.ad,...w.slice(0,2)]), dogru:it.ad,
      ustGorsel:(()=>{const c=emojiKarti(it.ch);c.style.width='130px';c.style.height='88px';return c;})(),
      ciz:t=>metinKarti(t,17), ipucu:it.ne
    };
  }
  const sorular=[

  return{
